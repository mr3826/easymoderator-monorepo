      <!-- Sentry CSP removed -->
      <!-- PWA / installable -->
      <link rel="manifest" href="/manifest.webmanifest" />
      <meta name="theme-color" content="#00A651" />
      <meta name="mobile-web-app-capable" content="yes" />
      <meta name="apple-mobile-web-app-capable" content="yes" />
      <meta name="apple-mobile-web-app-status-bar-style" content="default" />
      <meta name="apple-mobile-web-app-title" content="EasyModerator" />
      <!--
        The ?v= query busts two caches at once: nginx serves *.png with
        max-age=2592000 (nginx.conf), and sw.js is cache-first for png/svg.
        index.html itself is no-cache, so a new ?v= propagates on first load.
        Bump it (and CACHE_VERSION in sw.js) whenever the icons change.
      -->
      <link rel="apple-touch-icon" href="/icon-512.png?v=2" />
      <!-- SVG mark first: stays crisp at 16px where the full logo blurs. PNG is the Safari fallback. -->
      <link rel="icon" type="image/svg+xml" href="/brand/mark.svg?v=2" />
      <link rel="icon" type="image/png" href="/icon-512.png?v=2" />

      <!-- Link previews (Messenger / WhatsApp / Twitter). Copy mirrors manifest.webmanifest. -->
      <meta property="og:type" content="website" />
      <meta property="og:url" content="https://easymod.tech/" />
      <meta property="og:title" content="EasyModerator" />
