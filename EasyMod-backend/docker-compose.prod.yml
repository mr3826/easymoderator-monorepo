version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - easymod-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - easymod-network

  backend:
    image: ${ECR_IMAGE}
    restart: unless-stopped
    env_file:
      - .env.prod
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
    networks:
      - easymod-network

  worker:
    image: ${ECR_IMAGE}
    restart: unless-stopped
    command: ["npm", "run", "start:worker"]
    env_file:
      - .env.prod
    depends_on:
      - postgres
      - redis
    networks:
      - easymod-network

volumes:
  postgres_data:
  redis_data:

networks:
  easymod-network:
    driver: bridge
