name: Deploy Backend To AWS

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    name: Build And Push To ECR
    runs-on: ubuntu-latest
    outputs:
      ecr-image: ${{ steps.image.outputs.ecr-image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region ap-south-1 \
            | docker login --username AWS --password-stdin \
              441250065813.dkr.ecr.ap-south-1.amazonaws.com

      - name: Build and push image
        id: image
        run: |
          ECR_IMAGE="441250065813.dkr.ecr.ap-south-1.amazonaws.com/easymod-backend:${{ github.sha }}"
          docker build -t "$ECR_IMAGE" .
          docker tag "$ECR_IMAGE" "441250065813.dkr.ecr.ap-south-1.amazonaws.com/easymod-backend:latest"
          docker push "$ECR_IMAGE"
          docker push "441250065813.dkr.ecr.ap-south-1.amazonaws.com/easymod-backend:latest"
          echo "ecr-image=$ECR_IMAGE" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy On EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy docker-compose to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 3.111.186.159
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker-compose.prod.yml
          target: /home/ubuntu/easymod-backend/

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          ECR_IMAGE: ${{ needs.build-and-push.outputs.ecr-image }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          PORT: ${{ secrets.PORT }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          BASE_URL: ${{ secrets.BASE_URL }}
          BODY_SIZE_LIMIT: ${{ secrets.BODY_SIZE_LIMIT }}
          ALLOW_SELF_SIGNED_TLS: ${{ secrets.ALLOW_SELF_SIGNED_TLS }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          JWT_ACCESS_EXPIRES_IN: ${{ secrets.JWT_ACCESS_EXPIRES_IN }}
          JWT_REFRESH_EXPIRES_IN: ${{ secrets.JWT_REFRESH_EXPIRES_IN }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          PAYMENT_ENCRYPTION_KEY: ${{ secrets.PAYMENT_ENCRYPTION_KEY }}
          CHANNEL_ENCRYPTION_KEY: ${{ secrets.CHANNEL_ENCRYPTION_KEY }}
          WF1_WEBHOOK_URL: ${{ secrets.WF1_WEBHOOK_URL }}
          INTERNAL_WEBHOOK_SECRET: ${{ secrets.INTERNAL_WEBHOOK_SECRET }}
          META_WEBHOOK_APP_SECRET: ${{ secrets.META_WEBHOOK_APP_SECRET }}
          META_WEBHOOK_VERIFY_TOKEN: ${{ secrets.META_WEBHOOK_VERIFY_TOKEN }}
          EMBEDDING_PROVIDER: ${{ secrets.EMBEDDING_PROVIDER }}
          EMBEDDING_MODEL: ${{ secrets.EMBEDDING_MODEL }}
          GEMINI_EMBEDDING_MODEL: ${{ secrets.GEMINI_EMBEDDING_MODEL }}
          Google_Gemini_Api_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX: ${{ secrets.PINECONE_INDEX }}
          PINECONE_NAMESPACE: ${{ secrets.PINECONE_NAMESPACE }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          DELIVERY_ENCRYPTION_KEY: ${{ secrets.DELIVERY_ENCRYPTION_KEY }}
        with:
          host: 3.111.186.159
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ECR_IMAGE,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,POSTGRES_DB,POSTGRES_USER,POSTGRES_PASSWORD,DATABASE_URL,REDIS_URL,PORT,CORS_ORIGINS,FRONTEND_URL,BASE_URL,BODY_SIZE_LIMIT,ALLOW_SELF_SIGNED_TLS,JWT_ACCESS_SECRET,JWT_REFRESH_SECRET,JWT_ACCESS_EXPIRES_IN,JWT_REFRESH_EXPIRES_IN,SESSION_SECRET,PAYMENT_ENCRYPTION_KEY,CHANNEL_ENCRYPTION_KEY,WF1_WEBHOOK_URL,INTERNAL_WEBHOOK_SECRET,META_WEBHOOK_APP_SECRET,META_WEBHOOK_VERIFY_TOKEN,EMBEDDING_PROVIDER,EMBEDDING_MODEL,GEMINI_EMBEDDING_MODEL,Google_Gemini_Api_KEY,OPENAI_API_KEY,PINECONE_API_KEY,PINECONE_INDEX,PINECONE_NAMESPACE,SMTP_HOST,SMTP_PORT,SMTP_USER,SMTP_PASS,SMTP_SECURE,EMAIL_FROM,DELIVERY_ENCRYPTION_KEY
          script: |
            set -eo pipefail

            # Install Docker if not present
            if ! command -v docker &> /dev/null; then
              curl -fsSL https://get.docker.com | sh
              sudo usermod -aG docker ubuntu
              newgrp docker
            fi

            # Install AWS CLI v2 if not present
            if ! command -v aws &> /dev/null; then
              sudo apt-get install -y -qq unzip
              curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
              unzip -q /tmp/awscliv2.zip -d /tmp
              sudo /tmp/aws/install
              rm -rf /tmp/awscliv2.zip /tmp/aws
            fi

            cd /home/ubuntu/easymod-backend

            # URL-encode the DB password so special chars are safe in the connection URL
            ENCODED_PG_PASS=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1],safe=''))" "${POSTGRES_PASSWORD}")
            DB_URL_DEFAULT="postgresql://${POSTGRES_USER}:${ENCODED_PG_PASS}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
            REDIS_URL_DEFAULT="redis://redis:6379"
            DATABASE_URL_FINAL="${DATABASE_URL:-$DB_URL_DEFAULT}"
            REDIS_URL_FINAL="${REDIS_URL:-$REDIS_URL_DEFAULT}"

            # Resolve CHANNEL_ENCRYPTION_KEY with safe fallbacks.
            # Priority: GitHub secret -> previous .env.prod value -> generated 32-byte hex key.
            EXISTING_CHANNEL_KEY=""
            if [ -f .env.prod ]; then
              EXISTING_CHANNEL_KEY=$(grep -E '^CHANNEL_ENCRYPTION_KEY=' .env.prod | tail -1 | cut -d= -f2- | sed -e 's/^"//' -e 's/"$//')
            fi

            CHANNEL_ENCRYPTION_KEY_FINAL="${CHANNEL_ENCRYPTION_KEY:-}"
            if [ -z "$CHANNEL_ENCRYPTION_KEY_FINAL" ] && [ -n "$EXISTING_CHANNEL_KEY" ]; then
              CHANNEL_ENCRYPTION_KEY_FINAL="$EXISTING_CHANNEL_KEY"
            fi

            if ! echo "$CHANNEL_ENCRYPTION_KEY_FINAL" | grep -Eq '^[A-Fa-f0-9]{64}$'; then
              CHANNEL_ENCRYPTION_KEY_FINAL=$(python3 - <<'PY'
              import secrets
              print(secrets.token_hex(32))
              PY
)
            fi

            # Write .env.prod using printf to avoid heredoc YAML conflicts
            {
              printf 'ECR_IMAGE="%s"\n'               "${ECR_IMAGE}"
              printf 'POSTGRES_DB="%s"\n'             "${POSTGRES_DB}"
              printf 'POSTGRES_USER="%s"\n'           "${POSTGRES_USER}"
              printf 'POSTGRES_PASSWORD="%s"\n'       "${POSTGRES_PASSWORD}"
              printf 'PORT="%s"\n'                    "${PORT:-3000}"
              printf 'NODE_ENV=production\n'
              printf 'DATABASE_URL="%s"\n'            "${DATABASE_URL_FINAL}"
              printf 'REDIS_URL="%s"\n'               "${REDIS_URL_FINAL}"
              printf 'BODY_SIZE_LIMIT="%s"\n'         "${BODY_SIZE_LIMIT:-10mb}"
              printf 'ALLOW_SELF_SIGNED_TLS="%s"\n'   "${ALLOW_SELF_SIGNED_TLS:-false}"
              printf 'CORS_ORIGINS="%s"\n'            "${CORS_ORIGINS}"
              printf 'JWT_ACCESS_SECRET="%s"\n'       "${JWT_ACCESS_SECRET}"
              printf 'JWT_REFRESH_SECRET="%s"\n'      "${JWT_REFRESH_SECRET}"
              printf 'JWT_ACCESS_EXPIRES_IN="%s"\n'   "${JWT_ACCESS_EXPIRES_IN}"
              printf 'JWT_REFRESH_EXPIRES_IN="%s"\n'  "${JWT_REFRESH_EXPIRES_IN}"
              printf 'SESSION_SECRET="%s"\n'          "${SESSION_SECRET}"
              printf 'PAYMENT_ENCRYPTION_KEY="%s"\n'  "${PAYMENT_ENCRYPTION_KEY}"
              printf 'CHANNEL_ENCRYPTION_KEY="%s"\n'  "${CHANNEL_ENCRYPTION_KEY_FINAL}"
              printf 'DELIVERY_ENCRYPTION_KEY="%s"\n' "${DELIVERY_ENCRYPTION_KEY}"
              printf 'WF1_WEBHOOK_URL="%s"\n'         "${WF1_WEBHOOK_URL}"
              printf 'INTERNAL_WEBHOOK_SECRET="%s"\n' "${INTERNAL_WEBHOOK_SECRET}"
              printf 'META_WEBHOOK_APP_SECRET="%s"\n' "${META_WEBHOOK_APP_SECRET}"
              printf 'META_WEBHOOK_VERIFY_TOKEN="%s"\n' "${META_WEBHOOK_VERIFY_TOKEN}"
              printf 'EMBEDDING_PROVIDER="%s"\n'      "${EMBEDDING_PROVIDER}"
              printf 'EMBEDDING_MODEL="%s"\n'         "${EMBEDDING_MODEL}"
              printf 'GEMINI_EMBEDDING_MODEL="%s"\n'  "${GEMINI_EMBEDDING_MODEL}"
              printf 'Google_Gemini_Api_KEY="%s"\n'   "${Google_Gemini_Api_KEY}"
              printf 'OPENAI_API_KEY="%s"\n'          "${OPENAI_API_KEY}"
              printf 'FRONTEND_URL="%s"\n'            "${FRONTEND_URL}"
              printf 'BASE_URL="%s"\n'                "${BASE_URL}"
              printf 'SMTP_HOST="%s"\n'               "${SMTP_HOST}"
              printf 'SMTP_PORT="%s"\n'               "${SMTP_PORT}"
              printf 'SMTP_USER="%s"\n'               "${SMTP_USER}"
              printf 'SMTP_PASS="%s"\n'               "${SMTP_PASS}"
              printf 'SMTP_SECURE="%s"\n'             "${SMTP_SECURE:-false}"
              printf 'EMAIL_FROM="%s"\n'              "${EMAIL_FROM}"
              printf 'PINECONE_API_KEY="%s"\n'        "${PINECONE_API_KEY}"
              printf 'PINECONE_INDEX="%s"\n'          "${PINECONE_INDEX}"
              printf 'PINECONE_NAMESPACE="%s"\n'      "${PINECONE_NAMESPACE}"
            } > .env.prod

            # Login to ECR
            aws ecr get-login-password --region ap-south-1 \
              | docker login --username AWS --password-stdin \
                441250065813.dkr.ecr.ap-south-1.amazonaws.com

            # Pull new backend image
            docker compose --env-file .env.prod -f docker-compose.prod.yml pull backend

            # Start / restart postgres and redis
            docker compose --env-file .env.prod -f docker-compose.prod.yml up -d postgres redis

            # Wait for postgres to be ready (up to 30s)
            echo "Waiting for postgres..."
            for i in $(seq 1 15); do
              docker compose --env-file .env.prod -f docker-compose.prod.yml exec -T postgres \
                pg_isready -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" && break
              sleep 2
            done

            # Sync base schema (creates tables defined in Sequelize models, e.g. shops)
            # Use force:false so Sequelize respects FK ordering when creating fresh tables
            docker compose --env-file .env.prod -f docker-compose.prod.yml run --rm backend \
              node -e "require('module-alias/register');require('src/modules/entities');const{sequelize}=require('src/utils/database/database-setup');sequelize.sync({force:false}).then(()=>{console.log('Sync complete');process.exit(0)}).catch(e=>{console.error(e);process.exit(1)})"

            # Run migrations (depends on base tables existing)
            docker compose --env-file .env.prod -f docker-compose.prod.yml run --rm backend npm run migrate

            # Start/restart backend
            docker compose --env-file .env.prod -f docker-compose.prod.yml up -d backend

            # Clean up old images
            docker image prune -af --filter "until=72h"

            # Post-deploy health check (up to 60s)
            echo "Waiting for backend to be healthy..."
            for i in $(seq 1 20); do
              STATUS=$(docker compose --env-file .env.prod -f docker-compose.prod.yml \
                exec -T backend node -e \
                "require('http').get('http://localhost:3000/health/ready',(r)=>{process.stdout.write(String(r.statusCode));process.exit(0)}).on('error',()=>{process.stdout.write('000');process.exit(0)})" \
                2>/dev/null || echo "000")
              if [ "$STATUS" = "200" ]; then
                echo "Backend is healthy (attempt $i)"
                break
              fi
              if [ "$i" = "20" ]; then
                echo "ERROR: Backend failed health check after 20 attempts"
                docker compose --env-file .env.prod -f docker-compose.prod.yml logs --tail=50 backend
                exit 1
              fi
              sleep 3
            done
            echo "Deployment complete."
