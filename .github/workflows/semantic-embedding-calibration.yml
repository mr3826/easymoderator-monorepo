name: Semantic Embedding Calibration

on:
  workflow_dispatch:
    inputs:
      dimensions:
        description: 'Comma-separated Gemini output dimensions (384 is authoritative; 768 is diagnostic)'
        required: false
        default: '384,768'
        type: string

permissions:
  contents: read

jobs:
  calibration:
    name: Gemini semantic calibration (no Qdrant)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: vars.PRODUCTION_DEPLOY_ENABLED != 'true'
    env:
      GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
      GEMINI_EMBEDDING_MODEL: gemini-embedding-2
      CALIBRATION_DIMENSIONS: ${{ inputs.dimensions || '384,768' }}
    steps:
      - name: Check out calibration runner
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'

      - name: Run in-memory calibration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GEMINI_API_KEY"
          node --check scripts/semantic-calibration.js
          node scripts/semantic-calibration.js \
            --dimensions="$CALIBRATION_DIMENSIONS" \
            --output=semantic-calibration.json

      - name: Upload calibration artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: semantic-calibration-${{ github.run_id }}
          path: semantic-calibration.json
          if-no-files-found: error
