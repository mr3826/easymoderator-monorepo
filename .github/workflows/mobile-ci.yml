name: Mobile CI

# Isolation contract (ADR M-009, docs/mobile/adr/M-009-ci-isolation.md): this
# workflow only ever runs against feature/mobile-app and mobile/** branches,
# never main; it carries no secrets, no deployment environment, and no
# workflow_dispatch trigger; and it never pushes to a registry or reaches a
# host over SSH. The isolation-guard job below fails the run structurally if
# any of that ever changes — do not weaken it to make a future change pass.

on:
  push:
    branches:
      - feature/mobile-app
      - 'mobile/**'
    paths:
      - 'EasyMod-mobile/**'
      - 'EasyMod-backend/**'
      - 'docs/mobile/**'
      - '.github/workflows/mobile-ci.yml'
      - '.github/scripts/verify-mobile-ci-isolation.js'
      - '.github/scripts/verify-mobile-protected-paths.js'
  pull_request:
    branches:
      - feature/mobile-app
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'EasyMod-mobile/**'
      - 'EasyMod-backend/**'
      - 'docs/mobile/**'
      - '.github/workflows/mobile-ci.yml'
      - '.github/scripts/verify-mobile-ci-isolation.js'
      - '.github/scripts/verify-mobile-protected-paths.js'

permissions:
  contents: read

jobs:
  isolation-guard:
    name: Isolation guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Verify this workflow carries no secrets, environment, dispatch, or main-reaching trigger
        run: node .github/scripts/verify-mobile-ci-isolation.js

  protected-paths:
    name: Protected paths untouched
    runs-on: ubuntu-latest
    needs: [isolation-guard]
    outputs:
      backend_touched: ${{ steps.diff.outputs.backend_touched }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Diff against origin/main and enforce the mobile-isolation allowlist
        id: diff
        run: node .github/scripts/verify-mobile-protected-paths.js

  gitleaks:
    name: Historical secret scan
    runs-on: ubuntu-latest
    needs: [isolation-guard]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Scan repository history with Gitleaks
        # Same pinned digest as the existing Security Scan workflow (Gitleaks
        # v8.28.0). Keep the block scalar free of inline comments — they
        # become literal Docker arguments.
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/repo"
          zricethezav/gitleaks@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
          git --config=/repo/.gitleaks.toml --redact --verbose --log-opts="--all" /repo

  mobile:
    name: Mobile — typecheck, lint, unit, audit
    runs-on: ubuntu-latest
    needs: [isolation-guard]
    defaults:
      run:
        working-directory: ./EasyMod-mobile
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: EasyMod-mobile/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        # Expo Router's native test environment leaves asynchronous handles open; keep the
        # isolated mobile job deterministic while the underlying warning is tracked separately.
        run: npm test -- --ci --runInBand --forceExit

      - name: Dependency audit
        run: npm audit --audit-level=high

  mobile-e2e-scope:
    name: Android E2E path scope (opt-in)
    runs-on: ubuntu-latest
    needs: [isolation-guard, protected-paths]
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'mobile-e2e') &&
      needs.isolation-guard.result == 'success' &&
      needs.protected-paths.result == 'success'
    outputs:
      native_touched: ${{ steps.scope.outputs.native_touched }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Check mobile and backend path scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git rev-parse --verify "$BASE_SHA^{commit}" >/dev/null
          if git diff --name-only "$BASE_SHA" "$GITHUB_SHA" | awk '/^EasyMod-mobile\// || /^EasyMod-backend\// { found=1 } END { exit found ? 0 : 1 }'; then
            echo 'native_touched=true' >> "$GITHUB_OUTPUT"
            echo 'Android E2E scope: mobile/backend paths changed'
          else
            echo 'native_touched=false' >> "$GITHUB_OUTPUT"
            echo 'Android E2E scope: no mobile/backend paths changed; emulator job skipped'
          fi

  mobile-e2e:
    name: Android Maestro E2E (opt-in)
    runs-on: ubuntu-latest
    needs: [isolation-guard, protected-paths, mobile-e2e-scope]
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'mobile-e2e') &&
      needs.isolation-guard.result == 'success' &&
      needs.protected-paths.result == 'success' &&
      needs.mobile-e2e-scope.result == 'success' &&
      needs.mobile-e2e-scope.outputs.native_touched == 'true'
    timeout-minutes: 90
    env:
      APP_VARIANT: development
      EXPO_PUBLIC_API_BASE_URL: http://localhost:4000
      E2E_API_BASE_URL: http://127.0.0.1:4000
      E2E_DATABASE_URL: postgres://e2e:e2e@127.0.0.1:5432/easymod_mobile_e2e
      E2E_REDIS_URL: redis://127.0.0.1:6379
      E2E_EMAIL: mobile-dev@easymod.test
      E2E_PASSWORD: MobileDev123!
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: easymod_mobile_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U e2e -d easymod_mobile_e2e"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: EasyMod-mobile/package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Install mobile dependencies
        working-directory: ./EasyMod-mobile
        run: npm ci

      - name: Generate development Android project
        working-directory: ./EasyMod-mobile
        run: CI=1 npx expo prebuild --platform android --no-install

      - name: Build development APK
        working-directory: ./EasyMod-mobile
        run: |
          set -o pipefail
          mkdir -p e2e/artifacts
          chmod +x android/gradlew
          android/gradlew --no-daemon assembleDebug 2>&1 | tee e2e/artifacts/gradle-build.log

      - name: Install Maestro CLI
        run: |
          set -euo pipefail
          export MAESTRO_VERSION='2.6.0'
          export MAESTRO_DIR="$RUNNER_TEMP/maestro"
          export MAESTRO_ZIP="$RUNNER_TEMP/maestro.zip"
          export MAESTRO_UNPACK="$RUNNER_TEMP/maestro-unpack"
          mkdir -p "$MAESTRO_DIR" "$MAESTRO_UNPACK"
          curl -fsSL --retry 3 --retry-all-errors --proto '=https' --tlsv1.2 \
            -o "$MAESTRO_ZIP" \
            "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo '80185105a5d7e227e3b3fbcf225f45b312508ea676a9fc8e1b1aa1cac8b9ff6e  '"$MAESTRO_ZIP" | sha256sum --check --status
          unzip -t "$MAESTRO_ZIP" >/dev/null
          unzip -q "$MAESTRO_ZIP" -d "$MAESTRO_UNPACK"
          cp -R "$MAESTRO_UNPACK/maestro/." "$MAESTRO_DIR/"
          echo "$MAESTRO_DIR/bin" >> "$GITHUB_PATH"
          "$MAESTRO_DIR/bin/maestro" --version

      - name: Enable KVM
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run seeded Maestro smoke flow on API 24
        uses: reactivecircus/android-emulator-runner@324029e2f414c084d8b15ba075288885e74aef9c # v2.34.0
        with:
          api-level: 24
          target: google_apis
          arch: x86
          profile: Nexus 5
          ram-size: 1536M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: ./EasyMod-mobile
          script: |
            set -o pipefail
            mkdir -p e2e/artifacts
            node e2e/run-maestro.js --start-backend --install --apk android/app/build/outputs/apk/debug/app-debug.apk 2>&1 | tee e2e/artifacts/maestro-run.log

      - name: Upload Maestro artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobile-maestro-e2e
          if-no-files-found: ignore
          path: |
            EasyMod-mobile/e2e/artifacts/
            EasyMod-mobile/android/app/build/outputs/apk/debug/app-debug.apk

  backend-regression:
    name: Backend regression (Node 20)
    runs-on: ubuntu-latest
    needs: [protected-paths]
    # Only runs when this branch's diff against origin/main touches
    # EasyMod-backend/ at all — a documentation-only or mobile-app-only branch
    # never spins up Postgres/Redis for this job.
    if: needs.protected-paths.outputs.backend_touched == 'true'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: easymod_integration_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Backend unit + security suite
        working-directory: ./EasyMod-backend
        run: |
          npm run test:security
          npm test

      - name: Migrate the integration database
        working-directory: ./EasyMod-backend
        env:
          DATABASE_URL: postgres://e2e:e2e@127.0.0.1:5432/easymod_integration_test
          DB_SSL: 'false'
          NODE_ENV: test
        run: npm run migrate

      - name: Backend integration suite
        working-directory: ./EasyMod-backend
        env:
          DATABASE_URL: postgres://e2e:e2e@127.0.0.1:5432/easymod_integration_test
          REDIS_URL: redis://127.0.0.1:6379
        run: npm run test:integration

  mobile-ci-gate:
    name: Mobile CI
    runs-on: ubuntu-latest
    if: always()
    needs: [isolation-guard, protected-paths, gitleaks, mobile, mobile-e2e-scope, mobile-e2e]
    steps:
      - name: Report the mobile CI verdict
        env:
          R_GUARD: ${{ needs.isolation-guard.result }}
          R_PATHS: ${{ needs.protected-paths.result }}
          R_LEAKS: ${{ needs.gitleaks.result }}
          R_MOBILE: ${{ needs.mobile.result }}
          R_E2E_SCOPE: ${{ needs.mobile-e2e-scope.result }}
          R_E2E: ${{ needs.mobile-e2e.result }}
        run: |
          set -euo pipefail
          echo "Isolation guard:    $R_GUARD"
          echo "Protected paths:    $R_PATHS"
          echo "Gitleaks:           $R_LEAKS"
          echo "Mobile checks:      $R_MOBILE"
          echo "Mobile E2E scope:   $R_E2E_SCOPE"
          echo "Mobile E2E:         $R_E2E"
          if [ "$R_GUARD" != "success" ] || [ "$R_PATHS" != "success" ] || [ "$R_LEAKS" != "success" ] || [ "$R_MOBILE" != "success" ] || { [ "$R_E2E_SCOPE" != "success" ] && [ "$R_E2E_SCOPE" != "skipped" ]; } || { [ "$R_E2E" != "success" ] && [ "$R_E2E" != "skipped" ]; }; then
            echo "Mobile CI: FAIL"
            exit 1
          fi
          echo "Mobile CI: PASS"
