name: Deploy Prod

on:
  push:
    branches:
      - prod

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: commerce_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run migrations
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/commerce_ai_test
        run: npm run migrate

      - name: Run tests
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/commerce_ai_test
          JWT_ACCESS_SECRET: test-access-secret
          JWT_REFRESH_SECRET: test-refresh-secret
          SESSION_SECRET: test-session-secret
        run: npm test

  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} \
          | docker login --username AWS --password-stdin \
          ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

      - name: Build Docker image
        run: |
          docker build -t backend .

      - name: Tag Docker image
        run: |
          docker tag backend:latest \
          ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:latest

      - name: Push Docker image to ECR
        run: |
          docker push \
          ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:latest

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          PORT: ${{ secrets.PORT }}
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          PAYMENT_ENCRYPTION_KEY: ${{ secrets.PAYMENT_ENCRYPTION_KEY }}
          DELIVERY_ENCRYPTION_KEY: ${{ secrets.DELIVERY_ENCRYPTION_KEY }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          BASE_URL: ${{ secrets.BASE_URL }}
          META_WEBHOOK_APP_SECRET: ${{ secrets.META_WEBHOOK_APP_SECRET }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          QDRANT_COLLECTION: ${{ secrets.QDRANT_COLLECTION }}
          QDRANT_VECTOR_SIZE: ${{ secrets.QDRANT_VECTOR_SIZE }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: AWS_REGION,AWS_ACCOUNT_ID,ECR_REPOSITORY,PORT,NODE_ENV,DATABASE_URL,REDIS_URL,REDIS_PASSWORD,JWT_ACCESS_SECRET,JWT_REFRESH_SECRET,SESSION_SECRET,PAYMENT_ENCRYPTION_KEY,DELIVERY_ENCRYPTION_KEY,CORS_ORIGINS,FRONTEND_URL,BASE_URL,META_WEBHOOK_APP_SECRET,QDRANT_URL,QDRANT_API_KEY,QDRANT_COLLECTION,QDRANT_VECTOR_SIZE
          script: |
            set -e

            if [ -z "$AWS_REGION" ] || [ -z "$AWS_ACCOUNT_ID" ] || [ -z "$ECR_REPOSITORY" ]; then
              echo "AWS_REGION, AWS_ACCOUNT_ID, and ECR_REPOSITORY must be set"
              exit 1
            fi

            aws ecr get-login-password --region "$AWS_REGION" \
              | docker login --username AWS --password-stdin \
              "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"

            docker pull \
              "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:latest"

            docker stop backend || true
            docker rm backend || true

            cat <<EOF > .env.prod
            PORT=$PORT
            NODE_ENV=$NODE_ENV
            DATABASE_URL=$DATABASE_URL
            REDIS_URL=$REDIS_URL
            REDIS_PASSWORD=$REDIS_PASSWORD
            JWT_ACCESS_SECRET=$JWT_ACCESS_SECRET
            JWT_REFRESH_SECRET=$JWT_REFRESH_SECRET
            SESSION_SECRET=$SESSION_SECRET
            PAYMENT_ENCRYPTION_KEY=$PAYMENT_ENCRYPTION_KEY
            DELIVERY_ENCRYPTION_KEY=$DELIVERY_ENCRYPTION_KEY
            CORS_ORIGINS=$CORS_ORIGINS
            FRONTEND_URL=$FRONTEND_URL
            BASE_URL=$BASE_URL
            META_WEBHOOK_APP_SECRET=$META_WEBHOOK_APP_SECRET
            QDRANT_URL=$QDRANT_URL
            QDRANT_API_KEY=$QDRANT_API_KEY
            QDRANT_COLLECTION=$QDRANT_COLLECTION
            QDRANT_VECTOR_SIZE=$QDRANT_VECTOR_SIZE
            EOF

            docker run -d \
              --name backend \
              -p 3000:3000 \
              --restart unless-stopped \
              --env-file .env.prod \
              "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:latest"

            rm -f .env.prod
