name: Deploy to Digital Ocean

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 'Which service to deploy'
        required: false
        default: 'all'
        type: choice
        options: [all, backend, frontend]
      wipe_db_first:
        description: 'DESTRUCTIVE — wipe easymod DB before deploy. Type WIPE to confirm (anything else = no-op).'
        required: false
        default: ''
        type: string

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  GHCR_BACKEND: ghcr.io/${{ github.repository_owner }}/easymod-backend
  GHCR_FRONTEND: ghcr.io/${{ github.repository_owner }}/easymod-frontend

# ──────────────────────────────────────────────────────────────────────────────
# Required GitHub secrets (Settings → Secrets → Actions):
#   DO_HOST              — Droplet IP or hostname
#   DO_SSH_PRIVATE_KEY   — SSH private key with root access to the droplet
#   VITE_API_BASE_URL    — e.g. https://api.easymod.tech
#   VITE_META_APP_ID     — Meta App ID (public, used for OAuth popup)
#   VITE_SENTRY_DSN      — Sentry DSN (optional)
#
# The droplet must have /opt/easymod/docker-compose.prod.yml and .env.prod in place.
# ──────────────────────────────────────────────────────────────────────────────

jobs:
  # ── 1. Detect which services changed ────────────────────────────────────────
  changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'all' || github.event.inputs.target == 'backend') || steps.filter.outputs.backend == 'true' }}
      frontend: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'all' || github.event.inputs.target == 'frontend') || steps.filter.outputs.frontend == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'EasyMod-backend/**'
              - '.github/workflows/deploy.yml'
            frontend:
              - 'EasyMod-frontend/**'
              - '.github/workflows/deploy.yml'

  # ── 2. Backend tests ─────────────────────────────────────────────────────────
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    defaults:
      run:
        working-directory: EasyMod-backend
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: EasyMod-backend/package-lock.json

      - run: npm ci
      - run: npm test -- --passWithNoTests --forceExit

  # ── 3. Build & push images ───────────────────────────────────────────────────
  build:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [changes, test-backend]
    if: |
      always() && !cancelled() &&
      (needs.test-backend.result == 'success' || needs.test-backend.result == 'skipped') &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true')
    outputs:
      backend_tag: ${{ steps.meta.outputs.backend_tag }}
      frontend_tag: ${{ steps.meta.outputs.frontend_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: meta
        run: |
          SHA="${{ github.sha }}"
          SHORT="${SHA::8}"
          if [ "${{ needs.changes.outputs.backend }}" = "true" ]; then
            echo "backend_tag=${{ env.GHCR_BACKEND }}:${SHORT}" >> $GITHUB_OUTPUT
          else
            echo "backend_tag=" >> $GITHUB_OUTPUT
          fi
          if [ "${{ needs.changes.outputs.frontend }}" = "true" ]; then
            echo "frontend_tag=${{ env.GHCR_FRONTEND }}:${SHORT}" >> $GITHUB_OUTPUT
          else
            echo "frontend_tag=" >> $GITHUB_OUTPUT
          fi

      - name: Build & push backend image
        if: needs.changes.outputs.backend == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./EasyMod-backend
          file: ./EasyMod-backend/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.backend_tag }}
            ${{ env.GHCR_BACKEND }}:latest
          cache-from: type=registry,ref=${{ env.GHCR_BACKEND }}:buildcache
          cache-to: type=registry,ref=${{ env.GHCR_BACKEND }}:buildcache,mode=max

      - name: Build & push frontend image
        if: needs.changes.outputs.frontend == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./EasyMod-frontend
          file: ./EasyMod-frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.frontend_tag }}
            ${{ env.GHCR_FRONTEND }}:latest
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
            VITE_META_APP_ID=${{ secrets.VITE_META_APP_ID }}
            VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}
            VITE_ENV=production
          cache-from: type=registry,ref=${{ env.GHCR_FRONTEND }}:buildcache
          cache-to: type=registry,ref=${{ env.GHCR_FRONTEND }}:buildcache,mode=max

  # ── 4. Deploy to DO droplet ──────────────────────────────────────────────────
  deploy:
    name: Deploy to DO Droplet
    runs-on: ubuntu-latest
    needs: [changes, build]
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DO_HOST }}
          username: root
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          timeout: 300s
          envs: GHCR_BACKEND,GHCR_FRONTEND,BACKEND_TAG,FRONTEND_TAG,GH_ACTOR,GH_TOKEN,WIPE_DB
          script: |
            set -e

            # Set image vars FIRST so docker compose can validate docker-compose.prod.yml
            # for any commands run inside the WIPE block (compose substitutes ${GHCR_IMAGE_*}
            # at parse time, even for stop/exec). These are re-affirmed below after pull.
            export GHCR_IMAGE_BACKEND="$GHCR_BACKEND:latest"
            export GHCR_IMAGE_FRONTEND="$GHCR_FRONTEND:latest"

            # ── DESTRUCTIVE WIPE (only when manually triggered with WIPE_DB=WIPE) ──
            if [ "$WIPE_DB" = "WIPE" ]; then
              echo "==> WIPE_DB=WIPE detected — dropping easymod database"
              cd /opt/easymod
              docker compose -f docker-compose.prod.yml stop backend worker scheduler || true
              docker compose -f docker-compose.prod.yml exec -T postgres psql -U easymod_user -d postgres -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = 'easymod' AND pid <> pg_backend_pid();"
              docker compose -f docker-compose.prod.yml exec -T postgres psql -U easymod_user -d postgres -c "DROP DATABASE IF EXISTS easymod;"
              docker compose -f docker-compose.prod.yml exec -T postgres psql -U easymod_user -d postgres -c "CREATE DATABASE easymod OWNER easymod_user;"
              docker compose -f docker-compose.prod.yml exec -T postgres psql -U easymod_user -d easymod -c 'CREATE EXTENSION IF NOT EXISTS "uuid-ossp";'
              echo "==> DB wiped + recreated; backend stays stopped until new image is pulled below"
            fi

            # Authenticate to ghcr.io on the droplet
            echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

            # Pull only images that were rebuilt
            if [ -n "$BACKEND_TAG" ]; then
              echo "Pulling backend: $BACKEND_TAG"
              docker pull "$BACKEND_TAG"
              docker tag "$BACKEND_TAG" "$GHCR_BACKEND:latest"
            fi

            if [ -n "$FRONTEND_TAG" ]; then
              echo "Pulling frontend: $FRONTEND_TAG"
              docker pull "$FRONTEND_TAG"
              docker tag "$FRONTEND_TAG" "$GHCR_FRONTEND:latest"
            fi

            cd /opt/easymod

            # Restart services with latest images
            # (GHCR_IMAGE_BACKEND/FRONTEND already exported at top of script)
            docker compose -f docker-compose.prod.yml up -d --no-build --remove-orphans

            # Run migrations when backend was updated OR DB was just wiped
            if [ -n "$BACKEND_TAG" ] || [ "$WIPE_DB" = "WIPE" ]; then
              echo "Running database migrations..."
              docker compose -f docker-compose.prod.yml exec -T backend npm run migrate
            fi

            # Health check
            for i in $(seq 1 20); do
              STATUS=$(curl -sf http://localhost:3000/health/ready -o /dev/null -w "%{http_code}" || echo "000")
              if [ "$STATUS" = "200" ]; then
                echo "Health check passed on attempt $i"
                break
              fi
              echo "Attempt $i: status=$STATUS — retrying in 5s..."
              sleep 5
              if [ "$i" = "20" ]; then
                echo "ERROR: Health check failed after 100s"
                exit 1
              fi
            done

            # Clean up dangling images
            docker image prune -f
        env:
          GHCR_BACKEND: ${{ env.GHCR_BACKEND }}
          GHCR_FRONTEND: ${{ env.GHCR_FRONTEND }}
          BACKEND_TAG: ${{ needs.build.outputs.backend_tag }}
          FRONTEND_TAG: ${{ needs.build.outputs.frontend_tag }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIPE_DB: ${{ github.event.inputs.wipe_db_first }}
