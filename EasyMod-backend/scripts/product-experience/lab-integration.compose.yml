services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab-local-only
      POSTGRES_DB: easymod_product_lab_test
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:${LAB_POSTGRES_PORT}:5432"
    tmpfs:
      - /var/lib/postgresql/data:size=512m
    mem_limit: 768m
    cpus: 1.5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d easymod_product_lab_test"]
      interval: 2s
      timeout: 3s
      retries: 45
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--databases", "23", "--maxmemory", "128mb"]
    ports:
      - "127.0.0.1:${LAB_REDIS_PORT}:6379"
    tmpfs:
      - /data:size=64m
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 45
networks:
  default:
    driver: bridge
    internal: false
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
    ipam:
      config:
        - subnet: "${LAB_NETWORK_SUBNET:?The integration runner must choose a non-overlapping subnet}"
