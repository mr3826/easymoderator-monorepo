# Production docker-compose for Digital Ocean Droplet (2vCPU 2GB)
# Images pulled from GitHub Container Registry (ghcr.io)
# Set GHCR_IMAGE_BACKEND, GHCR_IMAGE_FRONTEND env vars on the droplet

version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-easymod}
      POSTGRES_USER: ${POSTGRES_USER:-easymod_user}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - easymod-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-easymod_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256m

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "100mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    networks:
      - easymod-network
    deploy:
      resources:
        limits:
          memory: 128m

  backend:
    image: ${GHCR_IMAGE_BACKEND}
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      PORT: 3000
      RUN_MIGRATIONS_ON_STARTUP: "false"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - easymod-network
    volumes:
      - invoice_data:/app/uploads/invoices
    deploy:
      resources:
        limits:
          memory: 400m

  worker:
    image: ${GHCR_IMAGE_BACKEND}
    restart: unless-stopped
    command: ["node", "src/jobs/worker.js"]
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - easymod-network
    deploy:
      resources:
        limits:
          memory: 200m

  scheduler:
    image: ${GHCR_IMAGE_BACKEND}
    restart: unless-stopped
    # Runs token_refresh_check daily at 08:00 UTC, then sleeps until next run.
    # Uses BusyBox-compatible date arithmetic (Alpine Linux has no GNU date).
    command:
      - /bin/sh
      - -c
      - |
        while true; do
          echo "[scheduler] $$(date -u '+%Y-%m-%dT%H:%M:%SZ') Running token_refresh_check"
          node src/jobs/job-runner.js token_refresh_check || true
          # BusyBox-compatible sleep until next 08:00 UTC using pure arithmetic.
          # $$ escapes prevent Docker Compose from interpolating shell variables.
          H=$$(date -u +%H); M=$$(date -u +%M); S=$$(date -u +%S)
          SECS_NOW=$$((H * 3600 + M * 60 + S))
          TARGET=28800
          if [ "$$SECS_NOW" -lt "$$TARGET" ]; then
            SLEEP=$$((TARGET - SECS_NOW))
          else
            SLEEP=$$((86400 - SECS_NOW + TARGET))
          fi
          echo "[scheduler] Sleeping $${SLEEP}s until next run at 08:00 UTC"
          sleep "$$SLEEP"
        done
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - easymod-network
    # Disable the inherited HTTP healthcheck — scheduler has no HTTP server
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          memory: 64m

  frontend:
    image: ${GHCR_IMAGE_FRONTEND}
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - easymod-network
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 128m

volumes:
  postgres_data:
  redis_data:
  invoice_data:

networks:
  easymod-network:
    driver: bridge
