name: Database Backup

on:
  schedule:
    # Daily at 02:00 UTC (08:00 Bangladesh time)
    - cron: '0 2 * * *'
  workflow_dispatch:

# ──────────────────────────────────────────────────────────────────────────────
# Required GitHub secrets:
#   DO_HOST            — Droplet IP or hostname
#   DO_SSH_PRIVATE_KEY — SSH private key with root access to the droplet
#
# Backups are stored on the droplet at /opt/easymod/backups/ (7-day retention).
# ──────────────────────────────────────────────────────────────────────────────

jobs:
  backup:
    name: Backup PostgreSQL
    runs-on: ubuntu-latest
    steps:
      - name: Run pg_dump via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DO_HOST }}
          username: root
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          timeout: 120s
          script: |
            set -e

            BACKUP_DIR=/opt/easymod/backups
            mkdir -p "$BACKUP_DIR"

            TIMESTAMP=$(date +%Y%m%d-%H%M%S)
            BACKUP_FILE="$BACKUP_DIR/easymod-${TIMESTAMP}.sql.gz"
            UPLOADS_BACKUP_FILE="easymod-uploads-${TIMESTAMP}.tar.gz"

            echo "Starting backup: $BACKUP_FILE"

            # Dump from the running postgres container and gzip inline
            docker compose -f /opt/easymod/docker-compose.prod.yml exec -T postgres \
              pg_dump -U easymod_user easymod | gzip > "$BACKUP_FILE"

            echo "Backup complete: $(du -sh "$BACKUP_FILE" | cut -f1)"

            echo "Starting uploads volume backup: $BACKUP_DIR/$UPLOADS_BACKUP_FILE"
            docker compose --env-file /opt/easymod/.env.prod -f /opt/easymod/docker-compose.prod.yml run \
              --rm --no-deps --user root -v "$BACKUP_DIR":/backup --entrypoint sh backend \
              -c "cd /app/uploads && tar czf /backup/$UPLOADS_BACKUP_FILE ."
            echo "Uploads backup complete: $(du -sh "$BACKUP_DIR/$UPLOADS_BACKUP_FILE" | cut -f1)"

            # Retain only the last 7 days
            find "$BACKUP_DIR" -name "easymod-*.sql.gz" -mtime +7 -delete
            find "$BACKUP_DIR" -name "easymod-uploads-*.tar.gz" -mtime +7 -delete
            echo "Retention cleanup done. Current backups:"
            ls -lh "$BACKUP_DIR"
