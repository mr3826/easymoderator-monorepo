name: Deploy Backend To AWS

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    name: Build And Push To ECR
    runs-on: ubuntu-latest
    outputs:
      ecr-image: ${{ steps.image.outputs.ecr-image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Compute image tag
        id: image
        run: |
          ECR_IMAGE="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}"
          echo "ecr-image=$ECR_IMAGE" >> "$GITHUB_OUTPUT"

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region "${{ secrets.AWS_REGION }}" \
            | docker login --username AWS --password-stdin \
              "${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com"

      - name: Build image
        run: |
          docker build -t "${{ steps.image.outputs.ecr-image }}" .
          docker tag "${{ steps.image.outputs.ecr-image }}" "${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:latest"

      - name: Push image
        run: |
          docker push "${{ steps.image.outputs.ecr-image }}"
          docker push "${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:latest"

  deploy:
    name: Deploy On EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          ECR_IMAGE: ${{ needs.build-and-push.outputs.ecr-image }}
          PORT: ${{ secrets.PORT }}
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          BODY_SIZE_LIMIT: ${{ secrets.BODY_SIZE_LIMIT }}
          ALLOW_SELF_SIGNED_TLS: ${{ secrets.ALLOW_SELF_SIGNED_TLS }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          JWT_ACCESS_EXPIRES_IN: ${{ secrets.JWT_ACCESS_EXPIRES_IN }}
          JWT_REFRESH_EXPIRES_IN: ${{ secrets.JWT_REFRESH_EXPIRES_IN }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          PAYMENT_ENCRYPTION_KEY: ${{ secrets.PAYMENT_ENCRYPTION_KEY }}
          WF1_WEBHOOK_URL: ${{ secrets.WF1_WEBHOOK_URL }}
          INTERNAL_WEBHOOK_SECRET: ${{ secrets.INTERNAL_WEBHOOK_SECRET }}
          META_WEBHOOK_APP_SECRET: ${{ secrets.META_WEBHOOK_APP_SECRET }}
          META_WEBHOOK_VERIFY_TOKEN: ${{ secrets.META_WEBHOOK_VERIFY_TOKEN }}
          EMBEDDING_PROVIDER: ${{ secrets.EMBEDDING_PROVIDER }}
          EMBEDDING_MODEL: ${{ secrets.EMBEDDING_MODEL }}
          GEMINI_EMBEDDING_MODEL: ${{ secrets.GEMINI_EMBEDDING_MODEL }}
          Google_Gemini_Api_KEY: ${{ secrets.Google_Gemini_Api_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          BASE_URL: ${{ secrets.BASE_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX: ${{ secrets.PINECONE_INDEX }}
          PINECONE_NAMESPACE: ${{ secrets.PINECONE_NAMESPACE }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: AWS_REGION,AWS_ACCOUNT_ID,ECR_REPOSITORY,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,ECR_IMAGE,PORT,NODE_ENV,DATABASE_URL,REDIS_URL,BODY_SIZE_LIMIT,ALLOW_SELF_SIGNED_TLS,CORS_ORIGINS,JWT_ACCESS_SECRET,JWT_REFRESH_SECRET,JWT_ACCESS_EXPIRES_IN,JWT_REFRESH_EXPIRES_IN,SESSION_SECRET,PAYMENT_ENCRYPTION_KEY,WF1_WEBHOOK_URL,INTERNAL_WEBHOOK_SECRET,META_WEBHOOK_APP_SECRET,META_WEBHOOK_VERIFY_TOKEN,EMBEDDING_PROVIDER,EMBEDDING_MODEL,GEMINI_EMBEDDING_MODEL,Google_Gemini_Api_KEY,OPENAI_API_KEY,FRONTEND_URL,BASE_URL,SMTP_HOST,SMTP_PORT,SMTP_USER,SMTP_PASS,SMTP_SECURE,EMAIL_FROM,PINECONE_API_KEY,PINECONE_INDEX,PINECONE_NAMESPACE,POSTGRES_DB,POSTGRES_USER,POSTGRES_PASSWORD
          script: |
            set -euo pipefail

            mkdir -p /app/easymod-backend
            cd /app/easymod-backend

            # Keep compose file on server so deploy stays self-contained.
            cat > docker-compose.prod.yml <<'EOF'
            version: "3.9"

            services:
              postgres:
                image: postgres:15-alpine
                restart: unless-stopped
                environment:
                  POSTGRES_DB: ${POSTGRES_DB}
                  POSTGRES_USER: ${POSTGRES_USER}
                  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
                volumes:
                  - postgres_data:/var/lib/postgresql/data
                networks:
                  - easymod-network

              redis:
                image: redis:7-alpine
                restart: unless-stopped
                command: ["redis-server", "--appendonly", "yes"]
                volumes:
                  - redis_data:/data
                networks:
                  - easymod-network

              backend:
                image: ${ECR_IMAGE}
                restart: unless-stopped
                env_file:
                  - .env.prod
                ports:
                  - "3000:3000"
                depends_on:
                  - postgres
                  - redis
                networks:
                  - easymod-network

            volumes:
              postgres_data:
              redis_data:

            networks:
              easymod-network:
                driver: bridge
            EOF

            # Set default local service URLs if not explicitly provided via secrets.
            DB_URL_DEFAULT="postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
            REDIS_URL_DEFAULT="redis://redis:6379"
            DATABASE_URL_FINAL="${DATABASE_URL:-$DB_URL_DEFAULT}"
            REDIS_URL_FINAL="${REDIS_URL:-$REDIS_URL_DEFAULT}"

            cat > .env.prod <<EOF
            ECR_IMAGE=${ECR_IMAGE}
            POSTGRES_DB=${POSTGRES_DB}
            POSTGRES_USER=${POSTGRES_USER}
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            PORT=${PORT}
            NODE_ENV=${NODE_ENV}
            DATABASE_URL=${DATABASE_URL_FINAL}
            REDIS_URL=${REDIS_URL_FINAL}
            BODY_SIZE_LIMIT=${BODY_SIZE_LIMIT}
            ALLOW_SELF_SIGNED_TLS=${ALLOW_SELF_SIGNED_TLS}
            CORS_ORIGINS=${CORS_ORIGINS}
            JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
            JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
            JWT_ACCESS_EXPIRES_IN=${JWT_ACCESS_EXPIRES_IN}
            JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN}
            SESSION_SECRET=${SESSION_SECRET}
            PAYMENT_ENCRYPTION_KEY=${PAYMENT_ENCRYPTION_KEY}
            WF1_WEBHOOK_URL=${WF1_WEBHOOK_URL}
            INTERNAL_WEBHOOK_SECRET=${INTERNAL_WEBHOOK_SECRET}
            META_WEBHOOK_APP_SECRET=${META_WEBHOOK_APP_SECRET}
            META_WEBHOOK_VERIFY_TOKEN=${META_WEBHOOK_VERIFY_TOKEN}
            EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER}
            EMBEDDING_MODEL=${EMBEDDING_MODEL}
            GEMINI_EMBEDDING_MODEL=${GEMINI_EMBEDDING_MODEL}
            Google_Gemini_Api_KEY=${Google_Gemini_Api_KEY}
            OPENAI_API_KEY=${OPENAI_API_KEY}
            FRONTEND_URL=${FRONTEND_URL}
            BASE_URL=${BASE_URL}
            SMTP_HOST=${SMTP_HOST}
            SMTP_PORT=${SMTP_PORT}
            SMTP_USER=${SMTP_USER}
            SMTP_PASS=${SMTP_PASS}
            SMTP_SECURE=${SMTP_SECURE}
            EMAIL_FROM=${EMAIL_FROM}
            PINECONE_API_KEY=${PINECONE_API_KEY}
            PINECONE_INDEX=${PINECONE_INDEX}
            PINECONE_NAMESPACE=${PINECONE_NAMESPACE}
            EOF

            aws ecr get-login-password --region "${AWS_REGION}" \
              | docker login --username AWS --password-stdin \
                "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

            docker compose --env-file .env.prod -f docker-compose.prod.yml pull backend
            docker compose --env-file .env.prod -f docker-compose.prod.yml up -d postgres redis
            sleep 8
            docker compose --env-file .env.prod -f docker-compose.prod.yml run --rm backend npm run migrate
            docker compose --env-file .env.prod -f docker-compose.prod.yml up -d backend
            docker image prune -af --filter "until=72h"