version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: easymod-postgres
    environment:
      POSTGRES_DB: easymod_dev
      POSTGRES_USER: easymod_user
      POSTGRES_PASSWORD: easymod_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - easymod-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: easymod-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - easymod-network

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: easymod-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
    networks:
      - easymod-network

  # Backend Application
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: easymod-backend
    ports:
      - "3000:3000"
    env_file:
      - .env.docker   # git-ignored; copy from .env.docker.example and fill in local dev secrets
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://easymod_user:easymod_password@postgres:5432/easymod_dev
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      PORT: 3000
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - postgres
      - redis
      - qdrant
    networks:
      - easymod-network
    command: npm run dev

volumes:
  postgres_data:
  redis_data:
  qdrant_data:

networks:
  easymod-network:
    driver: bridge
