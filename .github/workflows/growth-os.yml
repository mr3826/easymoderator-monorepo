name: Growth OS CI / CD

on:
  push:
    branches: [main]
    paths:
      - "GrowthOS/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/growth-os.yml"
  pull_request:
    branches: [main]
    paths:
      - "GrowthOS/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/growth-os.yml"
  workflow_dispatch:

concurrency:
  group: growth-os-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/easymoderator-growth-os
  VITE_APP_DOMAIN: growth.easymod.tech
  VITE_APP_API_BASE: https://api.easymod.tech/api/internal/growth-os

jobs:
  verify:
    name: Growth OS build gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: GrowthOS/package-lock.json

      - name: Install dependencies
        working-directory: ./GrowthOS
        run: npm ci

      - name: Build
        working-directory: ./GrowthOS
        run: npm run build
        env:
          VITE_APP_DOMAIN: ${{ env.VITE_APP_DOMAIN }}
          VITE_APP_API_BASE: ${{ env.VITE_APP_API_BASE }}

  build-and-push:
    name: Build and publish Growth OS image
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./GrowthOS
          file: ./GrowthOS/Dockerfile
          push: true
          build-args: |
            VITE_APP_DOMAIN=${{ env.VITE_APP_DOMAIN }}
            VITE_APP_API_BASE=${{ env.VITE_APP_API_BASE }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
