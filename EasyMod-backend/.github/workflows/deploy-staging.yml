name: Deploy Staging

on:
  push:
    branches: [develop, staging]
  workflow_dispatch:

concurrency:
  group: deploy-staging-${{ github.ref }}
  cancel-in-progress: true

# Required for Workload Identity Federation
permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: gen-lang-client-0405487706
  REGION: us-central1
  REGISTRY: us-central1-docker.pkg.dev
  REPOSITORY: easymod-backend
  STAGING_SERVICE_NAME: easymod-backend-staging
  SERVICE_ACCOUNT: easymod-backend-sa@gen-lang-client-0405487706.iam.gserviceaccount.com

jobs:
  test-staging:
    name: Test Staging Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --passWithNoTests --forceExit --testPathIgnorePatterns="/__tests__/" --testPathIgnorePatterns="/test/"

  build-staging:
    name: Build Staging Image
    runs-on: ubuntu-latest
    needs: test-staging
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push staging image
        id: build
        env:
          IMAGE_TAG: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/staging:${{ github.sha }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --tag "${IMAGE_TAG}" \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --push \
            .

      - name: Extract metadata
        run: |
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-staging
    environment: staging
    
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: github-actions-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Deploy to Staging
        run: |
          gcloud run deploy ${{ env.STAGING_SERVICE_NAME }} \
            --image="${{ needs.build-staging.outputs.image_tag }}" \
            --region=${{ env.REGION }} \
            --service-account=${{ env.SERVICE_ACCOUNT }} \
            --network=easymod-vpc-staging \
            --subnet=easymod-subnet-staging \
            --vpc-egress=private-ranges-only \
            --set-env-vars="NODE_ENV=staging,GCP_PROJECT_ID=${{ env.PROJECT_ID }},GCP_SECRET_PREFIX=easymod-staging-" \
            --min-instances=1 \
            --max-instances=3 \
            --concurrency=40 \
            --cpu=0.5 \
            --memory=512Mi \
            --timeout=300 \
            --port=3000 \
            --platform=managed \
            --allow-unauthenticated

      - name: Wait for deployment
        run: sleep 30

      - name: Staging health check
        run: |
          STAGING_URL=$(gcloud run services describe ${{ env.STAGING_SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --format="value(status.url)")

          echo "Checking staging deployment: ${STAGING_URL}/health"
          
          for i in $(seq 1 10); do
            STATUS=$(curl -sf "${STAGING_URL}/health" -o /dev/null -w "%{http_code}" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Staging health check passed on attempt $i"
              break
            fi
            echo "Attempt $i: status=$STATUS — retrying in 5s..."
            sleep 5
          done
          
          if [ "$STATUS" != "200" ]; then
            echo "❌ ERROR: Staging health check failed after 10 attempts"
            exit 1
          fi

      - name: Run staging smoke tests
        run: |
          STAGING_URL=$(gcloud run services describe ${{ env.STAGING_SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --format="value(status.url)")

          echo "Running smoke tests against staging: ${STAGING_URL}"
          
          # Test key endpoints
          curl -f "${STAGING_URL}/health" | jq '.status == "healthy"'
          curl -f "${STAGING_URL}/health/database" | jq '.status == "healthy"'
          curl -f "${STAGING_URL}/health/redis" | jq '.status == "healthy"'
          
          # Test API endpoints
          curl -f "${STAGING_URL}/api/health" | jq '.success == true'
          
          echo "✅ Staging smoke tests completed"

      - name: Create staging deployment tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Create staging deployment tag
          git tag -f "staging-$(date +%Y%m%d-%H%M%S)-${{ github.sha }}"
          git push origin "staging-$(date +%Y%m%d-%H%M%S)-${{ github.sha }}"

  promote-to-production:
    name: Promote to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/staging'
    
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: github-actions-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com

      - name: Trigger production deployment
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/mr3826/EasyMod-backend/dispatches \
            -d '{
              "event_type": "workflow_dispatch",
              "client_payload": {
                "environment": "production",
                "version": "${{ github.sha }}"
              }
            }'

      - name: Create promotion tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Create production promotion tag
          git tag -f "prod-$(date +%Y%m%d-%H%M%S)-${{ github.sha }}"
          git push origin "prod-$(date +%Y%m%d-%H%M%S)-${{ github.sha }}"
