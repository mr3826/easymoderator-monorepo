appId: tech.easymod.merchant.dev
name: Product Catalog and Fast Stock Stepper Flow
tags:
  - mobile-e2e
  - products
  - stock-stepper
---
- launchApp
- extendedWaitUntil:
    visible:
      id: home-attention-list
    timeout: 60000
- openLink: easymodmerchantdev://products
- extendedWaitUntil:
    visible:
      id: product-screen-title
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: product-card-${E2E_SHOP_A_PRODUCT_ID}
    timeout: 30000
- assertVisible:
    id: product-add-draft-btn
- assertVisible:
    id: product-chip-all
- assertVisible:
    id: product-chip-low_stock
- assertVisible:
    id: product-chip-out_of_stock
- assertVisible:
    id: stepper-increment-${E2E_SHOP_A_PRODUCT_ID}
- tapOn:
    id: stepper-increment-${E2E_SHOP_A_PRODUCT_ID}
- tapOn:
    id: product-add-draft-btn
- extendedWaitUntil:
    visible:
      id: photo-draft-name-input
    timeout: 10000
- assertVisible:
    id: photo-draft-price-input
- assertVisible:
    id: photo-draft-submit-btn
- tapOn:
    id: photo-draft-close-btn
