app = "easymod-api"
primary_region = "sin"  # Singapore — closest to Bangladesh

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false   # CRITICAL: never sleep
  auto_start_machines = true
  min_machines_running = 1     # always 1 machine alive

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

[env]
  NODE_ENV = "production"
  PORT = "3000"
