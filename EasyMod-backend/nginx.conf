# Hardened NGINX config for api.easymod.tech (backend) and easymod.tech (frontend)
# Both services run as Docker containers on the same DO Droplet

worker_processes auto;
events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Rate limiting zone: 20 req/sec burst 40 per IP
    limit_req_zone $binary_remote_addr zone=meta_webhook:10m rate=20r/s;

    # ── Backend API ──────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name api.easymod.tech;
        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        location /webhooks/meta {
            limit_req zone=meta_webhook burst=40 nodelay;
            proxy_pass http://backend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://backend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ── Frontend SPA ─────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name easymod.tech;
        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        location / {
            proxy_pass http://frontend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ── HTTP → HTTPS redirect ────────────────────────────────────────────────
    server {
        listen 80;
        server_name api.easymod.tech easymod.tech;
        return 301 https://$host$request_uri;
    }
}
