name: Mobile Release

# Signed Android release build (ADR M-013, docs/mobile/adr/M-013-release-signing.md).
# Pushes to main build the mobile source from that exact commit; workflow_dispatch
# can rerun a previously merged source SHA from main without rebuilding a different
# application. The upload key is available only to the build job in the protected
# mobile-release environment. Android runtime verification runs on a fresh runner,
# after Gradle and SDK build state have been discarded with the build runner.
# Nothing is distributed from here: verified APK/AAB files are uploaded as artifacts.

on:
  push:
    branches:
      - main
    paths:
      - 'EasyMod-mobile/**'
      - '.github/workflows/mobile-release.yml'
      - '.github/workflows/mobile-production-proof.yml'
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Full main SHA whose EasyMod-mobile source must be built and signed'
        required: true
        type: string

# A release build is never cancelled halfway; a newer push to main queues behind it.
concurrency:
  group: mobile-release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  signed-build:
    name: Signed Android build, ${{ matrix.variant }} (all ABIs)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: mobile-release
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: preview
            package: tech.easymod.merchant.preview
            artifact: mobile-release
          - variant: production
            package: tech.easymod.merchant
            artifact: mobile-release-production
    env:
      APP_VARIANT: ${{ matrix.variant }}
      EXPO_PUBLIC_API_BASE_URL: https://api.easymod.tech
      SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
      GIT_SHA: ${{ inputs.source_sha || github.sha }}
      EXPO_NO_TELEMETRY: '1'
    defaults:
      run:
        working-directory: ./EasyMod-mobile
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: EasyMod-mobile/package-lock.json

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: EasyMod-mobile/package-lock.json

      - name: Validate exact source SHA
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::source_sha must be a full lowercase SHA'; exit 1; }
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          echo "SOURCE_SHA=$SOURCE_SHA"
          echo "BUILD_RUN=$GITHUB_RUN_ID"

      - name: Derive the version code
        run: echo "APP_BUILD_NUMBER=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Disk diagnostics before Android setup
        run: |
          set -euo pipefail
          df -h
          du -sh "${ANDROID_HOME:-/usr/local/lib/android/sdk}" "$HOME/.gradle" "$RUNNER_TEMP" 2>/dev/null || true

      - name: Install
        run: npm ci

      - name: Generate the Android project (clean prebuild)
        run: npx expo prebuild --platform android --clean --no-install

      - name: Record the configured ABI matrix
        run: |
          mkdir -p release
          grep -E '^reactNativeArchitectures=' android/gradle.properties | tee release/android-abis.txt

      - name: Build release APK + AAB (all ABIs, R8)
        run: |
          set -o pipefail
          mkdir -p release-logs
          df -h | tee release-logs/disk-before-gradle.txt
          cd android
          ./gradlew --no-daemon assembleRelease bundleRelease 2>&1 | tee ../release-logs/gradle-release.log
          cd ..
          df -h | tee release-logs/disk-after-gradle.txt

      - name: Sign with the upload key
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          ANDROID_UPLOAD_KEY_ALIAS="$(node -p "require('./release-signing.json').keyAlias")"
          export ANDROID_UPLOAD_KEY_ALIAS
          bash scripts/sign-android-release.sh \
            android/app/build/outputs/apk/release/app-release.apk \
            android/app/build/outputs/bundle/release/app-release.aab \
            release

      - name: Verify the signed artifacts against the pinned upload key
        env:
          APP_PACKAGE: ${{ matrix.package }}
        run: >-
          node scripts/verify-android-artifact.js
          --apk release/app-release.apk
          --aab release/app-release.aab
          --package "$APP_PACKAGE"
          --variant "$APP_VARIANT"
          --source-sha "$GIT_SHA"
          --abis armeabi-v7a,arm64-v8a,x86,x86_64
          --mapping android/app/build/outputs/mapping/release/mapping.txt
          --expect-signer "$(node -p "require('./release-signing.json').certificateSha256")"
          --out release

      - name: Record source identity and checksums
        run: |
          cp android/app/build/outputs/mapping/release/mapping.txt release/r8-mapping.txt
          printf '%s\n' "$GIT_SHA" > release/source-sha.txt
          cd release
          sha256sum app-release.apk app-release.aab r8-mapping.txt source-sha.txt > SHA256SUMS
          cat SHA256SUMS

      # This is an internal handoff artifact. The final public release artifact
      # is uploaded only by the fresh-runner runtime job after launch succeeds.
      - name: Upload signed build candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobile-release-candidate-${{ matrix.variant }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
          path: |
            EasyMod-mobile/release/
            EasyMod-mobile/release-logs/

      - name: Upload build logs (failed run)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobile-release-build-logs-${{ matrix.variant }}-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
          path: EasyMod-mobile/release-logs/

  runtime-proof:
    name: Android runtime proof, ${{ matrix.variant }} (fresh runner)
    needs: signed-build
    if: ${{ needs.signed-build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: preview
            package: tech.easymod.merchant.preview
            artifact: mobile-release
          - variant: production
            package: tech.easymod.merchant
            artifact: mobile-release-production
    env:
      SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Disk diagnostics on fresh runner
        run: |
          set -euo pipefail
          df -h
          du -sh "${ANDROID_HOME:-/usr/local/lib/android/sdk}" "$HOME/.gradle" "$RUNNER_TEMP" 2>/dev/null || true

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            EasyMod-mobile/scripts/android-install-launch-check.js

      - name: Download signed build candidate
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: mobile-release-candidate-${{ matrix.variant }}-${{ github.sha }}
          path: signed

      - name: Verify handoff and record disk state
        run: |
          set -euo pipefail
          test -f signed/release/app-release.apk
          test -f signed/release/app-release.aab
          test "$(cat signed/release/source-sha.txt)" = "$SOURCE_SHA"
          (cd signed/release && sha256sum --check SHA256SUMS)
          df -h | tee signed/release/disk-before-emulator.txt

      - name: Free safe runner storage before emulator provisioning
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sudo rm -rf "$sdk_root/system-images" "$sdk_root/ndk" "$sdk_root/cmake"
          df -h | tee signed/release/disk-after-cleanup.txt

      - name: Enable KVM
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and cold-launch the signed APK on API 24 (x86)
        uses: reactivecircus/android-emulator-runner@324029e2f414c084d8b15ba075288885e74aef9c # v2.34.0
        with:
          api-level: 24
          target: default
          arch: x86
          profile: Nexus 5
          ram-size: 2048M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: ./
          script: node EasyMod-mobile/scripts/android-install-launch-check.js signed/release/app-release.apk ${{ matrix.package }} signed/release/runtime

      - name: Disk diagnostics after emulator verification
        if: always()
        run: |
          df -h | tee signed/release/disk-after-emulator.txt

      - name: Prepare verified artifact with release root
        if: success()
        run: |
          set -euo pipefail
          mkdir -p final/release
          cp -R signed/release/. final/release/

      - name: Upload verified release artifact
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          path: final/

      - name: Upload runtime diagnostics (failed run)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobile-release-runtime-logs-${{ matrix.variant }}-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
          path: signed/release/

  release-gate:
    name: Mobile Release Gate
    needs: [signed-build, runtime-proof]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require build and fresh-runner runtime proof
        env:
          BUILD_RESULT: ${{ needs.signed-build.result }}
          RUNTIME_RESULT: ${{ needs.runtime-proof.result }}
        run: |
          set -euo pipefail
          echo "Signed build:       $BUILD_RESULT"
          echo "Fresh-runner proof: $RUNTIME_RESULT"
          [ "$BUILD_RESULT" = success ] && [ "$RUNTIME_RESULT" = success ]
