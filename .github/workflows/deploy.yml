name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 'Which service to deploy'
        required: false
        default: 'all'
        type: choice
        options: [all, backend, frontend]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write   # Required for Workload Identity Federation

env:
  PROJECT_ID: gen-lang-client-0405487706
  REGION: us-central1
  BACKEND_IMAGE: us-central1-docker.pkg.dev/gen-lang-client-0405487706/easymod-backend/app
  FRONTEND_IMAGE: us-central1-docker.pkg.dev/gen-lang-client-0405487706/easymod-frontend/app
  BACKEND_SERVICE_ACCOUNT: easymod-backend-sa@gen-lang-client-0405487706.iam.gserviceaccount.com
  FRONTEND_SERVICE_ACCOUNT: easymod-frontend-sa@gen-lang-client-0405487706.iam.gserviceaccount.com

# ──────────────────────────────────────────────────────────────────────
# Required GitHub secrets:
#   GCP_WORKLOAD_IDENTITY_PROVIDER — WIF provider (e.g. projects/123/locations/global/workloadIdentityPools/...)
#   VITE_API_BASE_URL              — e.g. https://api.easymod.tech
#   VITE_META_APP_ID               — Meta App ID (public, used for OAuth popup)
#   VITE_SENTRY_DSN                — Sentry DSN (optional, skip if not using Sentry)
#
# All other secrets (DB, Redis, Meta App Secret, etc.) are pulled from GCP
# Secret Manager at server startup via src/config/secrets-loader.js.
# ──────────────────────────────────────────────────────────────────────

jobs:
  # ── 1. Detect which services have changed ─────────────────────────────
  changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'all' || github.event.inputs.target == 'backend') || steps.filter.outputs.backend == 'true' }}
      frontend: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'all' || github.event.inputs.target == 'frontend') || steps.filter.outputs.frontend == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # paths-filter needs HEAD and HEAD~1

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'EasyMod-backend/**'
              - '.github/workflows/deploy.yml'
            frontend:
              - 'EasyMod-frontend/**'
              - '.github/workflows/deploy.yml'

  # ── 2. Backend tests (skip when only frontend changed) ────────────────
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    defaults:
      run:
        working-directory: EasyMod-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: EasyMod-backend/package-lock.json

      - run: npm ci
      - run: npm test -- --passWithNoTests --forceExit

  # ── 3. Build images and deploy ────────────────────────────────────────
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: [changes, test-backend]
    # Run when backend tests pass, or when they were skipped for a frontend-only deploy.
    if: |
      always() && !cancelled() &&
      (needs.test-backend.result == 'success' || needs.test-backend.result == 'skipped') &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true')

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: github-actions-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Ensure Artifact Registry repositories
        run: |
          for REPO in easymod-backend easymod-frontend; do
            if ! gcloud artifacts repositories describe "$REPO" \
              --location=${{ env.REGION }} \
              --project=${{ env.PROJECT_ID }} >/dev/null 2>&1; then
              gcloud artifacts repositories create "$REPO" \
                --repository-format=docker \
                --location=${{ env.REGION }} \
                --project=${{ env.PROJECT_ID }} \
                --description="EasyMod ${REPO} Docker images" \
                --quiet
            fi
          done

      # ── Backend ──
      - name: Build & push backend image
        if: needs.changes.outputs.backend == 'true'
        working-directory: EasyMod-backend
        run: |
          docker build -t ${{ env.BACKEND_IMAGE }}:${{ github.sha }} -t ${{ env.BACKEND_IMAGE }}:latest .
          docker push ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          docker push ${{ env.BACKEND_IMAGE }}:latest

      - name: Run backend migrations
        if: needs.changes.outputs.backend == 'true'
        run: |
          gcloud run jobs deploy easymod-migrate \
            --image=${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --command=npm \
            --args=run,migrate \
            --service-account=${{ env.BACKEND_SERVICE_ACCOUNT }} \
            --network=easymod-vpc \
            --subnet=easymod-subnet \
            --vpc-egress=private-ranges-only \
            --set-env-vars=NODE_ENV=production,GCP_PROJECT_ID=${{ env.PROJECT_ID }},GCP_SECRET_PREFIX=easymod- \
            --quiet
          gcloud run jobs execute easymod-migrate \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --wait \
            --quiet

      - name: Deploy backend to Cloud Run
        if: needs.changes.outputs.backend == 'true'
        run: |
          gcloud run deploy easymod-backend \
            --image=${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --service-account=${{ env.BACKEND_SERVICE_ACCOUNT }} \
            --network=easymod-vpc \
            --subnet=easymod-subnet \
            --vpc-egress=private-ranges-only \
            --update-env-vars=NODE_ENV=production,GCP_PROJECT_ID=${{ env.PROJECT_ID }},GCP_SECRET_PREFIX=easymod-,RUN_MIGRATIONS_ON_STARTUP=false \
            --min-instances=2 \
            --max-instances=20 \
            --concurrency=80 \
            --cpu=1 \
            --memory=1Gi \
            --timeout=300 \
            --port=3000 \
            --allow-unauthenticated \
            --quiet

      - name: Deploy BullMQ worker to Cloud Run
        if: needs.changes.outputs.backend == 'true'
        run: |
          gcloud run deploy easymod-worker \
            --image=${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --command="node" \
            --args="src/jobs/worker.js" \
            --service-account=${{ env.BACKEND_SERVICE_ACCOUNT }} \
            --network=easymod-vpc \
            --subnet=easymod-subnet \
            --vpc-egress=private-ranges-only \
            --update-env-vars=NODE_ENV=production,GCP_PROJECT_ID=${{ env.PROJECT_ID }},GCP_SECRET_PREFIX=easymod- \
            --min-instances=1 \
            --max-instances=2 \
            --no-allow-unauthenticated \
            --quiet

      # ── Frontend ──
      - name: Build & push frontend image
        if: needs.changes.outputs.frontend == 'true'
        working-directory: EasyMod-frontend
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }} \
            --build-arg VITE_META_APP_ID=${{ secrets.VITE_META_APP_ID }} \
            --build-arg VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }} \
            --build-arg VITE_ENV=production \
            -t ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
            -t ${{ env.FRONTEND_IMAGE }}:latest .
          docker push ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          docker push ${{ env.FRONTEND_IMAGE }}:latest

      - name: Deploy frontend to Cloud Run
        if: needs.changes.outputs.frontend == 'true'
        run: |
          gcloud run deploy easymod-frontend \
            --image=${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --service-account=${{ env.FRONTEND_SERVICE_ACCOUNT }} \
            --min-instances=1 \
            --max-instances=5 \
            --concurrency=1000 \
            --cpu=1 \
            --memory=512Mi \
            --timeout=60 \
            --port=8080 \
            --allow-unauthenticated \
            --quiet

      # ── Health check (backend only — frontend is static nginx) ────────
      - name: Health check — backend
        if: needs.changes.outputs.backend == 'true'
        run: |
          for i in $(seq 1 20); do
            STATUS=$(curl -sf "https://api.easymod.tech/health/ready" -o /dev/null -w "%{http_code}" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Backend healthy on attempt $i"
              exit 0
            fi
            echo "Attempt $i: status=$STATUS — retrying in 5s..."
            sleep 5
          done
          echo "ERROR: Backend health check failed after 100s"
          exit 1
