apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: easymod-backend
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        # Keep at least 1 instance warm to avoid cold starts on a SaaS product
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
        # VPC connector for private access to Cloud SQL and Memorystore
        run.googleapis.com/vpc-access-connector: projects/gen-lang-client-0405487706/locations/us-central1/connectors/easymod-connector
        run.googleapis.com/vpc-access-egress: private-ranges-only
        run.googleapis.com/execution-environment: gen2
    spec:
      serviceAccountName: easymod-backend-sa@gen-lang-client-0405487706.iam.gserviceaccount.com
      # Number of concurrent requests per container instance
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: us-central1-docker.pkg.dev/gen-lang-client-0405487706/easymod-backend/app:latest
          ports:
            - name: http1
              containerPort: 3000
          resources:
            limits:
              cpu: "1"
              memory: "1Gi"
          env:
            # Non-secret runtime config — everything else comes from GCP Secret Manager at startup
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: GCP_PROJECT_ID
              value: gen-lang-client-0405487706
            - name: GCP_SECRET_PREFIX
              value: easymod-
          startupProbe:
            httpGet:
              path: /health/ready
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12   # up to 60s for cold start
          livenessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            periodSeconds: 30
            failureThreshold: 3
