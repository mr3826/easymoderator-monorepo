name: Database Backup Automation

on:
  schedule:
    # Run daily at 2 AM UTC (9 PM Bangladesh time)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      backup_type:
        description: 'Type of backup to create'
        required: false
        default: 'scheduled'
        type: choice
        options:
          - scheduled
          - manual
          - full

# Required for Workload Identity Federation
permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: gen-lang-client-0405487706
  REGION: us-central1
  REGISTRY: us-central1-docker.pkg.dev
  REPOSITORY: easymod-backend
  BACKUP_SERVICE_ACCOUNT: easymod-backup-sa@gen-lang-client-0405487706.iam.gserviceaccount.com

jobs:
  backup-database:
    name: Database Backup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP for Backup
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.BACKUP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Pull latest backup image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/backup-runner:latest

      - name: Run database backup
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          BACKUP_FILE="backup-${TIMESTAMP}.sql"
          
          echo "Starting database backup at $(date)"
          
          # Run backup in container with mounted backup volume
          docker run --rm \
            --v easymod-backups:/backups \
            --env BACKUP_FILE="${BACKUP_FILE}" \
            --env DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            --env DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/backup-runner:latest

          echo "Backup completed: ${BACKUP_FILE}"

      - name: Upload backup to Cloud Storage
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          BACKUP_FILE="backup-${TIMESTAMP}.sql"
          
          # Upload to Cloud Storage
          gsutil cp "/backups/${BACKUP_FILE}" "gs://easymod-backups/database/${BACKUP_FILE}"
          
          # Create backup metadata
          cat > backup-metadata.json << EOF
          {
            "timestamp": "$(date -Iseconds)",
            "filename": "${BACKUP_FILE}",
            "environment": "production",
            "type": "scheduled",
            "location": "gs://easymod-backups/database/${BACKUP_FILE}",
            "size_bytes": $(gsutil ls -l "gs://easymod-backups/database/${BACKUP_FILE}" | awk '{print $1}' | head -1)
          }
          EOF
          
          # Upload metadata
          gsutil cp backup-metadata.json "gs://easymod-backups/metadata/backup-${TIMESTAMP}.json"

      - name: Cleanup old backups
        run: |
          echo "Cleaning up backups older than 7 days..."
          
          # List and delete old backups
          gsutil ls -l "gs://easymod-backups/database/" | while read -r line; do
            FILENAME=$(echo "$line" | awk '{print $1}')
            TIMESTAMP=$(echo "$FILENAME" | sed 's/backup-\([0-9]*\)-.sql/\1/')
            
            if [ -n "$TIMESTAMP" ]; then
              # Convert timestamp to seconds for comparison
              FILE_EPOCH=$(date -d "${TIMESTAMP:0:0:0" +%s 2>/dev/null)
              SEVEN_DAYS_AGO=$(date -d "7 days ago" +%s)
              
              if [ "$FILE_EPOCH" -lt "$SEVEN_DAYS_AGO" ]; then
                echo "Deleting old backup: $FILENAME"
                gsutil rm "gs://easymod-backups/database/$FILENAME"
                gsutil rm "gs://easymod-backups/metadata/backup-${TIMESTAMP}.json"
              fi
            fi
          done
          
          echo "Backup cleanup completed"

      - name: Verify backup
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          LATEST_BACKUP=$(gsutil ls "gs://easymod-backups/database/" | grep "backup-" | sort -r | head -1 | awk '{print $1}')
          
          if [ -n "$LATEST_BACKUP" ]; then
            echo "✅ Latest backup verified: $LATEST_BACKUP"
            
            # Check backup integrity
            BACKUP_SIZE=$(gsutil ls -l "gs://easymod-backups/database/$LATEST_BACKUP" | awk '{print $1}')
            if [ -n "$BACKUP_SIZE" ]; then
              echo "Backup size: $BACK_SIZE bytes"
            fi
          else
            echo "❌ No backup found"
            exit 1
          fi

      - name: Notify backup status
        if: always()
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          LATEST_BACKUP=$(gsutil ls "gs://easymod-backups/database/" | grep "backup-" | sort -r | head -1 | awk '{print $1}')
          
          # Send notification (could integrate with Slack, email, etc.)
          echo "📋 Database Backup Status:"
          echo "   Timestamp: $TIMESTAMP"
          echo "   Latest Backup: $LATEST_BACKUP"
          echo "   Status: ${{ job.status }}"
          
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Backup completed successfully"
          else
            echo "❌ Backup failed - check logs"
          fi

  restore-database:
    name: Database Restore
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.backup_type == 'restore'
    
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP for Restore
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.BACKUP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: List available backups
        id: list-backups
        run: |
          echo "Available backups:"
          gsutil ls "gs://easymod-backups/database/" | grep "backup-" | sort -r | head -10
          
          # Save backup list for selection
          echo "backup_list=$(gsutil ls "gs://easymod-backups/database/" | grep "backup-" | sort -r | awk '{print $1}' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Select backup to restore
        id: select-backup
        run: |
          if [ -z "${{ github.event.inputs.backup_file }}" ]; then
            echo "No backup file specified. Available backups:"
            gsutil ls "gs://easymod-backups/database/" | grep "backup-" | sort -r | head -10
            echo "Please specify backup_file input with one of the above files."
            exit 1
          fi
          
          echo "Selected backup for restore: ${{ github.event.inputs.backup_file }}"
          echo "backup_to_restore=${{ github.event.inputs.backup_file }}" >> "$GITHUB_OUTPUT"

      - name: Download selected backup
        run: |
          echo "Downloading backup: ${{ steps.select-backup.outputs.backup_to_restore }}"
          
          # Download backup from Cloud Storage
          gsutil cp "gs://easymod-backups/database/${{ steps.select-backup.outputs.backup_to_restore }}" "/backups/${{ steps.select-backup.outputs.backup_to_restore }}"

      - name: Verify backup integrity
        run: |
          BACKUP_FILE="${{ steps.select-backup.outputs.backup_to_restore }}"
          
          if [ -f "/backups/$BACKUP_FILE" ]; then
            echo "✅ Backup downloaded successfully: $BACKUP_FILE"
            echo "File size: $(stat -c%s "/backups/$BACKUP_FILE" | awk '{print $1}') bytes"
          else
            echo "❌ Failed to download backup: $BACKUP_FILE"
            exit 1
          fi

      - name: Confirm restore operation
        run: |
          echo "⚠️  WARNING: This will overwrite the current production database!"
          echo "Backup to restore: ${{ steps.select-backup.outputs.backup_to_restore }}"
          echo "Type 'confirm' to proceed or 'cancel' to abort."
          
          # Wait for manual confirmation (in real implementation, this would be interactive)
          echo "For automated restores, remove this step and add confirmation logic"
          
          CONFIRMATION="${{ github.event.inputs.confirmation || 'cancel' }}"
          if [ "$CONFIRMATION" != "confirm" ]; then
            echo "❌ Restore cancelled by user"
            exit 0
          fi

      - name: Perform database restore
        run: |
          BACKUP_FILE="${{ steps.select-backup.outputs.backup_to_restore }}"
          
          echo "🔄 Starting database restore from: $BACKUP_FILE"
          
          # Run restore in container
          docker run --rm \
            -v easymod-backups:/backups \
            --env BACKUP_FILE="${BACKUP_FILE}" \
            --env DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            --env DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/backup-runner:latest \
            restore-database "${BACKUP_FILE}"

          echo "✅ Database restore completed"

      - name: Verify restore
        run: |
          echo "Verifying database restore..."
          
          # Check database connectivity
          # This would involve checking the restored database state
          echo "📊 Restore verification completed"

      - name: Notify restore status
        if: always()
        run: |
          BACKUP_FILE="${{ steps.select-backup.outputs.backup_to_restore }}"
          
          echo "📋 Database Restore Status:"
          echo "   Restored from: $BACKUP_FILE"
          echo "   Status: ${{ job.status }}"
          echo "   Timestamp: $(date)"
          
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Database restored successfully"
          else
            echo "❌ Restore failed - check logs"
          fi

  create-backup-runner:
    name: Build Backup Runner Image
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.backup_type == 'full'
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backup runner
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --tag ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/backup-runner:latest \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --push \
            .

          echo "Backup runner image built and pushed"
