name: Load Testing

on:
  schedule:
    # Run daily at 3 AM UTC (10 PM Bangladesh time)
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Type of load test'
        required: false
        default: 'smoke'
        type: choice
        options:
          - smoke
          - baseline
          - peak
          - stress
      environment:
        description: 'Target environment'
        required: false
        default: 'staging'
        type: choice
        options:
          - staging
          - production

# Required for Workload Identity Federation
permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: gen-lang-client-0405487706
  REGION: us-central1
  REGISTRY: us-central1-docker.pkg.dev
  REPOSITORY: easymod-backend
  STAGING_SERVICE_NAME: easymod-backend-staging
  SERVICE_NAME: easymod-backend

jobs:
  load-test-staging:
    name: Load Test Staging
    runs-on: ubuntu-latest
    if: github.event.inputs.environment == 'staging' || github.event_name == 'schedule'
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install k6
        run: |
          sudo apt-key adv --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A2247B996E3D
          sudo apt-key adv --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys 1C61A2656FB57B7E439C0A1ADBA
          echo "deb https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Wait for staging to be ready
        run: |
          echo "Waiting for staging service to be ready..."
          sleep 30
          
          # Check staging health
          for i in {1..10}; do
            if curl -f https://easymod-backend-staging-xxxxx-uc.a.run.app/health; then
              echo "✅ Staging is ready"
              break
            fi
            echo "Attempt $i: waiting..."
            sleep 10
          done

      - name: Run smoke load test
        if: github.event.inputs.test_type == 'smoke' || github.event.inputs.test_type == ''
        run: |
          echo "🚀 Running smoke load test..."
          
          cat > smoke-test.js << 'EOF'
          import http from 'k6/http';
          import { check, sleep } from 'k6';
          
          export let options = {
            vus: 10,
            duration: '2m',
            thresholds: {
              http_req_duration: ['p(95)<500'],
              http_req_failed: ['rate<0.1'],
            },
          };
          
          export default function () {
            const BASE_URL = 'https://easymod-backend-staging-xxxxx-uc.a.run.app';
            
            export let setup = {
              headers: {
                'Content-Type': 'application/json',
              },
            };
            
            export default function () {
              let responses = http.get([\`\${BASE_URL}/health`, `\${BASE_URL}/health/database`, `\${BASE_URL}/health/redis`], setup);
              
              check(responses, {
                'health endpoints status': (r) => r.status === 200,
                'response time < 500ms': (r) => r.timings.duration < 500,
              });
              
              sleep(1);
            };
            
            export default function handleSummary(data) {
              console.log('Smoke Test Summary:');
              console.log(\`  Requests: \${data.metrics.http_requests_total}\`);
              console.log(\`  Failed: \${data.metrics.http_req_failed}\`);
              console.log(\`  Response Time (p95): \${data.metrics.http_req_duration['p(95)']}ms\`);
            }
          }
          EOF
          
          k6 run smoke-test.js --out json=smoke-results.json

      - name: Run baseline load test
        if: github.event.inputs.test_type == 'baseline'
        run: |
          echo "📊 Running baseline load test..."
          
          cat > baseline-test.js << 'EOF'
          import http from 'k6/http';
          import { check, sleep } from 'k6';
          
          export let options = {
            vus: 50,
            duration: '5m',
            thresholds: {
              http_req_duration: ['p(95)<1000'],
              http_req_failed: ['rate<0.05'],
            },
          };
          
          export default function () {
            const BASE_URL = 'https://easymod-backend-staging-xxxxx-uc.a.run.app';
            
            export let setup = {
              headers: {
                'Content-Type': 'application/json',
              },
            };
            
            export default function () {
              // Test health endpoints
              let healthResponses = http.get([\`\${BASE_URL}/health`, `\${BASE_URL}/health/database`, `\${BASE_URL}/health/redis`], setup);
              
              check(healthResponses, {
                'health endpoints status': (r) => r.status === 200,
                'response time < 1000ms': (r) => r.timings.duration < 1000,
              });
              
              // Test API endpoints
              let apiResponses = http.batch([
                ['GET', `\${BASE_URL}/api/health`],
                ['GET', `\${BASE_URL}/api/shop`],
                ['POST', `\${BASE_URL}/api/auth/login`, null, JSON.stringify({email: 'test@example.com', password: 'test123'})],
              ], setup);
              
              check(apiResponses, {
                'API endpoints status': (r) => r.status < 400,
                'API response time < 1000ms': (r) => r.timings.duration < 1000,
              });
              
              sleep(0.1);
            }
            
            export default function handleSummary(data) {
              console.log('Baseline Test Summary:');
              console.log(\`  Total Requests: \${data.metrics.http_requests_total}\`);
              console.log(\`  Failed Requests: \${data.metrics.http_req_failed}\`);
              console.log(\`  Response Time (p95): \${data.metrics.http_req_duration['p(95)']}ms\`);
              console.log(\`  Request Rate: \${data.metrics.http_reqs_per_sec}\`);
            }
          }
          EOF
          
          k6 run baseline-test.js --out json=baseline-results.json

      - name: Run peak load test
        if: github.event.inputs.test_type == 'peak'
        run: |
          echo "⚡ Running peak load test..."
          
          cat > peak-test.js << 'EOF'
          import http from 'k6/http';
          import { check, sleep } from 'k6';
          
          export let options = {
            vus: 200,
            duration: '10m',
            thresholds: {
              http_req_duration: ['p(95)<2000'],
              http_req_failed: ['rate<0.02'],
            },
          };
          
          export default function () {
            const BASE_URL = 'https://easymod-backend-staging-xxxxx-uc.a.run.app';
            
            export let setup = {
              headers: {
                'Content-Type': 'application/json',
              },
            };
            
            export default function () {
              // Simulate realistic user behavior
              let responses = http.batch([
                ['GET', `\${BASE_URL}/health`],
                ['GET', `\${BASE_URL}/api/shop`],
                ['GET', `\${BASE_URL}/api/product`],
                ['POST', `\${BASE_URL}/api/conversation`, null, JSON.stringify({message: 'test message'})],
              ], setup);
              
              check(responses, {
                'endpoints respond': (r) => r.status < 500,
                'response time < 2000ms': (r) => r.timings.duration < 2000,
              });
              
              sleep(0.05);
            }
            
            export default function handleSummary(data) {
              console.log('Peak Load Test Summary:');
              console.log(\`  Total Requests: \${data.metrics.http_requests_total}\`);
              console.log(\`  Failed Requests: \${data.metrics.http_req_failed}\`);
              console.log(\`  Response Time (p95): \${data.metrics.http_req_duration['p(95)']}ms\`);
              console.log(\`  Max Response Time: \${data.metrics.http_req_duration.max}ms\`);
            }
          }
          EOF
          
          k6 run peak-test.js --out json=peak-results.json

      - name: Run stress test
        if: github.event.inputs.test_type == 'stress'
        run: |
          echo "💥 Running stress load test..."
          
          cat > stress-test.js << 'EOF'
          import http from 'k6/http';
          import { check, sleep } from 'k6';
          
          export let options = {
            vus: 500,
            duration: '5m',
            thresholds: {
              http_req_duration: ['p(95)<3000'],
              http_req_failed: ['rate<0.1'],
            },
          };
          
          export default function () {
            const BASE_URL = 'https://easymod-backend-staging-xxxxx-uc.a.run.app';
            
            export let setup = {
              headers: {
                'Content-Type': 'application/json',
              },
            };
            
            export default function () {
              // Stress the system with heavy requests
              let responses = http.batch([
                ['GET', `\${BASE_URL}/health`],
                ['GET', `\${BASE_URL}/api/shop`],
                ['POST', `\${BASE_URL}/api/auth/login`, null, JSON.stringify({email: 'test@example.com', password: 'test123'})],
                ['POST', `\${BASE_URL}/api/product`, null, JSON.stringify({name: 'Stress Test Product', price: 99.99})],
                ['POST', `\${BASE_URL}/api/conversation`, null, JSON.stringify({message: 'Stress test message'})],
              ], setup);
              
              check(responses, {
                'endpoints respond': (r) => r.status < 500,
                'response time < 3000ms': (r) => r.timings.duration < 3000,
              });
              
              sleep(0.01);
            }
            
            export default function handleSummary(data) {
              console.log('Stress Test Summary:');
              console.log(\`  Total Requests: \${data.metrics.http_requests_total}\`);
              console.log(\`  Failed Requests: \${data.metrics.http_req_failed}\`);
              console.log(\`  Response Time (p95): \${data.metrics.http_req_duration['p(95)']}ms\`);
              console.log(\`  Max Response Time: \${data.metrics.http_req_duration.max}ms\`);
            }
          }
          EOF
          
          k6 run stress-test.js --out json=stress-results.json

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results-${{ github.event.inputs.test_type || 'smoke' }}
          path: |
            smoke-results.json
            baseline-results.json
            peak-results.json
            stress-results.json
          retention-days: 7

      - name: Analyze results
        run: |
          echo "📊 Load Test Analysis:"
          
          # Analyze results if they exist
          if [ -f "smoke-results.json" ]; then
            echo "Smoke Test Results:"
            cat smoke-results.json | jq '.metrics | keys'
          fi
          
          if [ -f "baseline-results.json" ]; then
            echo "Baseline Test Results:"
            cat baseline-results.json | jq '.metrics | keys'
          fi
          
          if [ -f "peak-results.json" ]; then
            echo "Peak Load Test Results:"
            cat peak-results.json | jq '.metrics | keys'
          fi
          
          if [ -f "stress-results.json" ]; then
            echo "Stress Test Results:"
            cat stress-results.json | jq '.metrics | keys'
          fi

  load-test-production:
    name: Load Test Production
    runs-on: ubuntu-latest
    if: github.event.inputs.environment == 'production'
    environment: production
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install k6
        run: |
          sudo apt-key adv --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A2247B996E3D
          sudo apt-key adv --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys 1C61A2656FB57B7E439C0A1ADBA
          echo "deb https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Get production URL
        id: get-url
        run: |
          PROD_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --format="value(status.url)")
          echo "production_url=$PROD_URL" >> "$GITHUB_OUTPUT"

      - name: Run production smoke test
        if: github.event.inputs.test_type == 'smoke' || github.event.inputs.test_type == ''
        run: |
          echo "🚀 Running production smoke test..."
          
          cat > prod-smoke-test.js << 'EOF'
          import http from 'k6/http';
          import { check, sleep } from 'k6';
          
          export let options = {
            vus: 5,
            duration: '1m',
            thresholds: {
              http_req_duration: ['p(95)<500'],
              http_req_failed: ['rate<0.1'],
            },
          };
          
          export default function () {
            const BASE_URL = '${{ steps.get-url.outputs.production_url }}';
            
            export let setup = {
              headers: {
                'Content-Type': 'application/json',
              },
            };
            
            export default function () {
              let responses = http.get([\`\${BASE_URL}/health`, `\${BASE_URL}/health/database`, `\${BASE_URL}/health/redis`], setup);
              
              check(responses, {
                'health endpoints status': (r) => r.status === 200,
                'response time < 500ms': (r) => r.timings.duration < 500,
              });
              
              sleep(1);
            }
            
            export default function handleSummary(data) {
              console.log('Production Smoke Test Summary:');
              console.log(\`  Requests: \${data.metrics.http_requests_total}\`);
              console.log(\`  Failed: \${data.metrics.http_req_failed}\`);
              console.log(\`  Response Time (p95): \${data.metrics.http_req_duration['p(95)']}ms\`);
            }
          }
          EOF
          
          k6 run prod-smoke-test.js --out json=prod-smoke-results.json

      - name: Upload production results
        uses: actions/upload-artifact@v4
        with:
          name: production-load-test-results
          path: prod-smoke-results.json
          retention-days: 7

      - name: Create performance report
        run: |
          echo "📈 Performance Test Report Generated"
          echo "Test Type: ${{ github.event.inputs.test_type || 'smoke' }}"
          echo "Environment: ${{ github.event.inputs.environment || 'staging' }}"
          echo "Timestamp: $(date)"
          echo "Results uploaded to artifacts"

  performance-comparison:
    name: Compare Performance
    runs-on: ubuntu-latest
    needs: [load-test-staging, load-test-production]
    if: always()
    
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: load-test-results-smoke
          path: ./results
          
      - uses: actions/download-artifact@v4
        with:
          name: production-load-test-results
          path: ./prod-results

      - name: Compare results
        run: |
          echo "📊 Performance Comparison Report:"
          
          if [ -f "./results/smoke-results.json" ]; then
            echo "Staging Performance:"
            cat ./results/smoke-results.json | jq '.metrics | keys'
          fi
          
          if [ -f "./prod-results/prod-smoke-results.json" ]; then
            echo "Production Performance:"
            cat ./prod-results/prod-smoke-results.json | jq '.metrics | keys'
          fi
          
          # Simple comparison logic would go here
          echo "Performance comparison completed"

  notify-results:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [load-test-staging, load-test-production, performance-comparison]
    if: always()
    
    steps:
      - name: Send notification
        run: |
          echo "📢 Load Test Notification:"
          echo "Test Type: ${{ github.event.inputs.test_type || 'smoke' }}"
          echo "Environment: ${{ github.event.inputs.environment || 'staging' }}"
          echo "Status: ${{ needs.load-test-staging.result }}"
          echo "Timestamp: $(date)"
          
          # Would integrate with Slack/email here
          echo "Notification sent to monitoring channels"
