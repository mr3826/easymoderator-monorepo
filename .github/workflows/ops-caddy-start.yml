name: Ops Start Host Caddy (recovery)

on:
  workflow_dispatch:

jobs:
  start-caddy:
    name: Start + verify host Caddy
    runs-on: ubuntu-latest
    steps:
      - name: SSH start caddy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          timeout: 120s
          script: |
            echo "===== before ====="
            systemctl is-active caddy || true
            echo "===== validate Caddyfile ====="
            caddy validate --config /etc/caddy/Caddyfile 2>&1 | tail -5 || true
            echo "===== restart + enable ====="
            systemctl enable caddy 2>&1 | tail -2 || true
            systemctl restart caddy 2>&1 | tail -5 || systemctl start caddy 2>&1 | tail -5 || true
            sleep 3
            echo "===== after ====="
            systemctl is-active caddy || true
            ss -tlnp 2>/dev/null | grep -E ':80 |:443 ' || echo "still nothing on 80/443"
            echo "===== caddy journal (last 25) ====="
            journalctl -u caddy --no-pager -n 25 2>&1 | tail -25 || true
            echo "===== local edge probe ====="
            curl -sk -o /dev/null -w "https://localhost/health/ready -> %{http_code}\n" --max-time 10 https://localhost/health/ready || true
            echo "===== DONE ====="
