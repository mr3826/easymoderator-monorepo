# ──────────────────────────────────────────────────────────────────────────────
# EasyModerator — Production Single-Droplet Stack
#
# Services:
#   caddy     — TLS termination (Let's Encrypt), reverse proxy, SPA routing
#   backend   — Node Express API (port 3000, internal only)
#   worker    — BullMQ background jobs (same image, different command)
#   frontend  — nginx serving built SPA (port 8080, internal only)
#   postgres  — PostgreSQL 15 (internal only)
#   redis     — Redis 7 (internal only)
#   qdrant    — Vector DB for RAG (internal only)
#
# Caddy reaches backend/frontend by service DNS on the `internal` network,
# matching ./Caddyfile (reverse_proxy backend:3000 / frontend:8080).
# ──────────────────────────────────────────────────────────────────────────────

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  caddy_data:
  caddy_config:
  backend_uploads:

services:
  # ── Caddy: TLS + reverse proxy ────────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

  # ── Backend: Express API ──────────────────────────────────────────────────
  backend:
    image: ${GHCR_IMAGE_BACKEND:-ghcr.io/mr3826/easymoderator-backend:latest}
    restart: unless-stopped
    command: ["node", "server.js"]
    env_file:
      - .env.prod
    environment:
      - NODE_ENV=production
      - START_EMBEDDED_WORKERS=false
      - RUN_MIGRATIONS_ON_STARTUP=false
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health/ready', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5

  # ── Worker: BullMQ background jobs ────────────────────────────────────────
  worker:
    image: ${GHCR_IMAGE_BACKEND:-ghcr.io/mr3826/easymoderator-backend:latest}
    restart: unless-stopped
    command: ["node", "src/jobs/worker.js"]
    env_file:
      - .env.prod
    environment:
      - NODE_ENV=production
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Frontend: nginx serving built SPA ─────────────────────────────────────
  frontend:
    image: ${GHCR_IMAGE_FRONTEND:-ghcr.io/mr3826/easymoderator-frontend:latest}
    restart: unless-stopped
    networks:
      - internal
    # Port 8080 is internal only — Caddy proxies to it

  # ── PostgreSQL 15 ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      POSTGRES_USER: ${DB_USER:-easymod_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-easymod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-easymod_user} -d ${DB_NAME:-easymod}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Redis 7 ───────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # noeviction, not allkeys-lru: this Redis backs BullMQ, and the eviction
    # policy is server-wide even though the queues are isolated in db3. Under LRU
    # a burst of session writes in db0 can evict a job key in db3, and the job
    # disappears with no error anywhere — a customer message that is simply never
    # replied to. Failing writes is the safe failure; losing queued work is not.
    #
    # Safe because the memory is bounded: every session key carries a TTL, BullMQ
    # retention is capped (removeOnComplete/removeOnFail counts), and production
    # peaked at 16 MB of the 256 MB cap with evicted_keys=0 — the LRU policy has
    # never once been needed. Headroom and used_memory are reported by
    # GET /health/detailed so the ceiling is visible before it is reached.
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Qdrant: Vector DB for RAG ─────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - internal
    # Internal URL: http://qdrant:6333
