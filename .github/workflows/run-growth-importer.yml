name: Run Growth Prospect Importer

# -----------------------------------------------------------------------------
# Protected production execution of the canonical Phase 3 historical importer
# (crm_lead audit rows + partner_applications -> Growth OS ledger).
#
# Dry-run is the default and writes nothing. `apply` additionally requires the
# literal authorization phrase, executes once, then RE-RUNS in dry-run mode and
# fails the job unless the second pass reports zero would-create rows for the
# same sources — the idempotency proof is enforced, not assumed.
#
# Receipts (source references and outcomes only, no contact PII) are persisted
# on the host under /root/growth-os-receipts for the execution record.
# -----------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Execution mode"
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - apply
      authorization:
        description: "For mode=apply only, type PRODUCTION-IMPORT-APPLY"
        required: false
        default: ""
        type: string
      batch_size:
        description: "Source read batch size (1-1000)"
        required: false
        default: "100"
        type: string

concurrency:
  group: run-growth-importer
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  import:
    name: Execute importer on production
    if: github.ref == 'refs/heads/main' && github.actor == 'mr3826'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Derive pinned SSH host fingerprint
        id: ssh_host
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.DO_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          host_entry=$(ssh-keygen -F "$DEPLOY_HOST" -f "$HOME/.ssh/known_hosts" | awk '!/^#/ { print; exit }')
          key_type=$(printf '%s\n' "$host_entry" | awk '{ print $2 }')
          key_blob=$(printf '%s\n' "$host_entry" | awk '{ print $3 }')
          if [ -z "$key_type" ] || [ -z "$key_blob" ]; then
            echo '::error::pinned host key is missing for DEPLOY_HOST'
            exit 1
          fi
          fingerprint=$(printf '%s %s\n' "$key_type" "$key_blob" | ssh-keygen -lf - -E sha256 | awk '{ print $2 }')
          if [ -z "$fingerprint" ]; then
            echo '::error::could not derive the pinned host fingerprint'
            exit 1
          fi
          printf 'fingerprint=%s\n' "$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Run importer in the live backend container
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DO_SSH_PRIVATE_KEY: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          IMPORT_MODE: ${{ inputs.mode }}
          IMPORT_AUTHORIZATION: ${{ inputs.authorization }}
          IMPORT_BATCH_SIZE: ${{ inputs.batch_size }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/easymod-growth-importer-key"
          umask 077
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$DO_SSH_PRIVATE_KEY" > "$key_file"
          printf '%s\n%s\n%s\n%s\n' \
            "$IMPORT_MODE" \
            "$IMPORT_AUTHORIZATION" \
            "$IMPORT_BATCH_SIZE" \
            "$GITHUB_RUN_ID" \
          | ssh -i "$key_file" \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -o ConnectTimeout=20 \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=20 \
              root@"$DEPLOY_HOST" '
                set -euo pipefail
                IFS= read -r IMPORT_MODE
                IFS= read -r IMPORT_AUTHORIZATION
                IFS= read -r IMPORT_BATCH_SIZE
                IFS= read -r GITHUB_RUN_ID
                cd /opt/easymod
                backend_container=$(docker ps \
                  --filter "label=com.docker.compose.service=backend" \
                  --filter "status=running" \
                  --format "{{.ID}}" | head -n 1)
                if [ -z "$backend_container" ]; then
                  echo "No running Compose backend container was found." >&2
                  exit 1
                fi
                if ! docker exec "$backend_container" test -f scripts/import-growth-prospects.js; then
                  echo "The deployed runtime does not contain the canonical importer." >&2
                  exit 1
                fi
                mkdir -p /root/growth-os-receipts
                # Inputs reach the remote shell; harden before interpolation.
                # The whole program travels inside single quotes to ssh, so
                # nothing here may contain a single quote character.
                case "$IMPORT_BATCH_SIZE" in "" | *[!0-9]*) IMPORT_BATCH_SIZE=100;; esac
                case "$GITHUB_RUN_ID" in "" | *[!0-9]*) echo "Unexpected run id." >&2; exit 1;; esac
                run_id="growth-prospect-import-gha-$GITHUB_RUN_ID"
                if [ "$IMPORT_MODE" = "apply" ]; then
                  if [ "$IMPORT_AUTHORIZATION" != "PRODUCTION-IMPORT-APPLY" ]; then
                    echo "mode=apply requires the literal authorization phrase PRODUCTION-IMPORT-APPLY." >&2
                    exit 1
                  fi
                  # The importer exits 1 when individual rows failed while
                  # still completing every other row. Capture that status
                  # instead of letting set -e abort before the per-row
                  # evidence and the idempotency gate run.
                  apply_rc=0
                  docker exec \
                    "$backend_container" sh -c "mkdir -p /tmp/growth-os-receipts && node scripts/import-growth-prospects.js --apply --batch-size $IMPORT_BATCH_SIZE --run-id ${run_id}-apply --receipt /tmp/growth-os-receipts/apply.json" \
                    | tee /root/growth-os-receipts/${run_id}-apply.stdout.json || apply_rc=${PIPESTATUS[0]}
                  docker cp "$backend_container:/tmp/growth-os-receipts/apply.json" "/root/growth-os-receipts/${run_id}-apply.receipt.json"
                  docker exec "$backend_container" node -e "const r=require(\"/tmp/growth-os-receipts/apply.json\"); for (const row of r.rows) console.log(\"IMPORT_ROW \" + JSON.stringify(row)); console.log(\"IMPORT_SUMMARY \" + JSON.stringify(r.summary));"
                  apply_probe=$(docker exec "$backend_container" node -e "const r=require(\"/tmp/growth-os-receipts/apply.json\"); let failed=0; for (const row of r.rows) { if (row.outcome === \"failed\") failed += 1; } console.log(\"PROBE_TOTAL \" + r.rows.length); console.log(\"PROBE_FAILED \" + failed);") || apply_probe=""
                  apply_total=$(printf "%s\n" "$apply_probe" | awk "/^PROBE_TOTAL / {print \$2}")
                  apply_failed=$(printf "%s\n" "$apply_probe" | awk "/^PROBE_FAILED / {print \$2}")
                  echo "APPLY_DONE run_id=$run_id apply_rc=$apply_rc apply_total=$apply_total apply_failed=$apply_failed"
                  # Idempotency gate: the same ledger must now report zero new
                  # writes. Any would-create row after a completed apply fails
                  # this job loudly instead of hiding drift. A non-zero verify
                  # pass is only meaningful if the scan COMPLETED; a crashed
                  # partial scan could print wouldCreate:0 for its prefix and
                  # must never masquerade as an idempotency proof.
                  verify_rc=0
                  second=$(docker exec \
                    "$backend_container" sh -c "mkdir -p /tmp/growth-os-receipts && node scripts/import-growth-prospects.js --batch-size $IMPORT_BATCH_SIZE --run-id ${run_id}-verify --receipt /tmp/growth-os-receipts/verify.json" \
                    | tee /root/growth-os-receipts/${run_id}-verify.stdout.json) || verify_rc=${PIPESTATUS[0]}
                  echo "VERIFY_PASS_RC=$verify_rc"
                  docker cp "$backend_container:/tmp/growth-os-receipts/verify.json" "/root/growth-os-receipts/${run_id}-verify.receipt.json"
                  verify_probe=$(docker exec "$backend_container" node -e "const r=require(\"/tmp/growth-os-receipts/verify.json\"); let failed=0; let readFailure=false; for (const row of r.rows) { console.error(\"VERIFY_ROW \" + JSON.stringify(row)); if (row.outcome === \"failed\") failed += 1; if (row.error === \"SOURCE_READ_FAILED\") readFailure = true; } console.log(\"PROBE_ROWS \" + r.rows.length); console.log(\"PROBE_FAILED \" + failed); console.log(\"PROBE_READ_FAILURE \" + readFailure);") || verify_probe=""
                  verify_rows=$(printf "%s\n" "$verify_probe" | awk "/^PROBE_ROWS / {print \$2}")
                  verify_failed=$(printf "%s\n" "$verify_probe" | awk "/^PROBE_FAILED / {print \$2}")
                  verify_read_failure=$(printf "%s\n" "$verify_probe" | awk "/^PROBE_READ_FAILURE / {print \$2}")
                  echo "VERIFY_ROWS=$verify_rows VERIFY_FAILED=$verify_failed VERIFY_READ_FAILURE=$verify_read_failure"
                  # Extract counts.wouldCreate from the JSON emitted by the
                  # verification pass, with portable awk only: no single
                  # quotes are allowed in this program, and the host may lack node.
                  would_create=$(printf "%s" "$second" | awk "/wouldCreate/ {gsub(/[^0-9]/, \"\", \$0); print; exit}")
                  echo "SECOND_RUN_WOULD_CREATE=$would_create"
                  if [ -z "$would_create" ]; then
                    echo "::error::could not extract wouldCreate from the verification pass"
                    exit 1
                  fi
                  if [ "$would_create" != "0" ]; then
                    echo "::error::post-apply verification dry-run reports $would_create would-create rows; idempotency is broken"
                    exit 1
                  fi
                  # Completeness proof for the idempotency gate: a crashed or
                  # partially-scanned verification pass can never be honored,
                  # and the row COUNT alone cannot distinguish a completed scan
                  # from a mid-scan read failure (the importer appends a
                  # sentinel row that preserves the count). Require: no source
                  # read failure, every source row accounted for, and the
                  # verification rejecting exactly the same rows apply did
                  # (a different rejection set means the verify pass itself is
                  # unreliable, not that the ledger is non-idempotent).
                  if [ "$verify_read_failure" = "true" ]; then
                    echo "::error::verification pass hit a source read failure; idempotency proof refused"
                    exit 1
                  fi
                  if [ -z "$verify_rows" ] || [ -z "$apply_total" ] || [ "$verify_rows" != "$apply_total" ]; then
                    echo "::error::verification pass incomplete (rows=$verify_rows expected=$apply_total rc=$verify_rc); idempotency proof refused"
                    exit 1
                  fi
                  if [ -z "$verify_failed" ] || [ "$verify_failed" != "$apply_failed" ]; then
                    echo "::error::verification rejected a different row set (verify_failed=$verify_failed apply_failed=$apply_failed); idempotency proof refused"
                    exit 1
                  fi
                  if [ "$verify_rc" -ne 0 ]; then
                    echo "VERIFY_COMPLETED_WITH_KNOWN_ROW_REJECTIONS rows=$verify_rows failed=$verify_failed rc=$verify_rc"
                  fi
                  # Surface per-row failures (exit 1 from the apply pass) after
                  # the idempotency gate has run, so a rejected row is visible
                  # in the same job as its counts.
                  if [ "$apply_rc" -ne 0 ]; then
                    echo "::warning::apply pass exited $apply_rc; see IMPORT_ROW lines for rejected sources"
                    exit "$apply_rc"
                  fi
                else
                  dry_rc=0
                  docker exec \
                    "$backend_container" sh -c "mkdir -p /tmp/growth-os-receipts && node scripts/import-growth-prospects.js --batch-size $IMPORT_BATCH_SIZE --run-id ${run_id}-dry --receipt /tmp/growth-os-receipts/dry.json" \
                    | tee /root/growth-os-receipts/${run_id}-dry.stdout.json || dry_rc=${PIPESTATUS[0]}
                  docker cp "$backend_container:/tmp/growth-os-receipts/dry.json" "/root/growth-os-receipts/${run_id}-dry.receipt.json"
                  # Echo per-row outcomes (source references, outcome, error
                  # codes only; the receipt format carries no contact fields)
                  # so an apply decision is reviewed against evidence, not totals.
                  docker exec "$backend_container" node -e "const r=require(\"/tmp/growth-os-receipts/dry.json\"); for (const row of r.rows) console.log(\"IMPORT_ROW \" + JSON.stringify(row)); console.log(\"IMPORT_SUMMARY \" + JSON.stringify(r.summary));"
                  echo "DRY_RUN_DONE run_id=$run_id dry_rc=$dry_rc"
                  if [ "$dry_rc" -ne 0 ]; then
                    echo "::warning::dry-run pass exited $dry_rc; see IMPORT_ROW lines for rejected sources"
                    exit "$dry_rc"
                  fi
                fi
              '
