name: Mobile CI

# Isolation contract (ADR M-009, amended by ADR M-013 when mobile joined main):
# this workflow carries no secrets, no deployment environment and no
# workflow_dispatch trigger, and it never pushes to a registry or reaches a host
# over SSH. It validates pull requests into main that change the mobile app or
# its dedicated backend modules, and pushes to mobile/** branches; it never
# runs for a push to main (the signed build there is mobile-release.yml). The
# isolation-guard job below fails the run structurally if any of that ever
# changes — do not weaken it to make a future change pass.

on:
  push:
    branches:
      - 'mobile/**'
    paths:
      - 'EasyMod-mobile/**'
      - 'EasyMod-backend/**'
      - 'docs/mobile/**'
      - '.github/workflows/mobile-ci.yml'
      - '.github/workflows/mobile-release.yml'
      - '.github/scripts/verify-mobile-ci-isolation.js'
      - '.github/scripts/verify-mobile-protected-paths.js'
  # Pull requests into main run this gate when they touch the mobile app, its
  # dedicated backend modules or this program's CI. main's own required checks
  # (PR Merge Gate, Security Scan) still run for every PR, including the backend
  # suites that cover the shared auth middleware.
  pull_request:
    branches:
      - main
    paths:
      - 'EasyMod-mobile/**'
      - 'docs/mobile/**'
      - 'EasyMod-backend/src/modules/mobile/**'
      - 'EasyMod-backend/src/modules/auth/native/**'
      - 'EasyMod-backend/src/middleware/mobile-client-context.middleware.js'
      - '.github/workflows/mobile-ci.yml'
      - '.github/workflows/mobile-release.yml'
      - '.github/scripts/verify-mobile-ci-isolation.js'
      - '.github/scripts/verify-mobile-protected-paths.js'
      - '.github/scripts/verify-native-auth-fixture-shape.js'
    types: [opened, synchronize, reopened, labeled]

# Mobile validation has no release or deployment side effect, so a newer run
# for the SAME scope can safely supersede an older one. The group is keyed by
# event type so a push to `mobile/foo` never cancels that branch's PR merge-gate
# (different scopes), and a PR is keyed by its number so concurrent PRs sharing
# a head branch never cancel each other. `persist-credentials` is deliberately
# left at its safe default: the mobile repo is private and both the protected-
# paths diff and the Gitleaks history scan fetch full ref history, which needs
# the persisted token to auth to GitHub.
concurrency:
  group: mobile-ci-${{ github.repository }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  isolation-guard:
    name: Isolation guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Verify mobile-ci holds no secrets and mobile-release keeps its signing boundary
        run: node .github/scripts/verify-mobile-ci-isolation.js

  protected-paths:
    name: Protected paths untouched
    runs-on: ubuntu-latest
    needs: [isolation-guard]
    outputs:
      backend_touched: ${{ steps.diff.outputs.backend_touched }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Diff against origin/main and enforce the mobile-isolation allowlist
        id: diff
        run: node .github/scripts/verify-mobile-protected-paths.js

  gitleaks:
    name: Historical secret scan
    runs-on: ubuntu-latest
    needs: [isolation-guard]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Scan repository history with Gitleaks
        # Same pinned digest as the existing Security Scan workflow (Gitleaks
        # v8.28.0). Keep the block scalar free of inline comments — they
        # become literal Docker arguments.
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/repo"
          zricethezav/gitleaks@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
          git --config=/repo/.gitleaks.toml --redact --verbose --log-opts="--all" /repo

  mobile:
    name: Mobile — typecheck, lint, unit, audit
    runs-on: ubuntu-latest
    needs: [isolation-guard]
    defaults:
      run:
        working-directory: ./EasyMod-mobile
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: EasyMod-mobile/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        # No --forceExit: it was masking leaked QueryClient gcTime timers. jest.setup.ts now
        # clears the app client after every test, so the suite exits on its own.
        run: npm test -- --ci --maxWorkers=2

      - name: Dependency audit
        run: npm audit --audit-level=high

  android-release:
    # Plan M-5/M-6/M-15: the release build every supported ABI ships as (R8 on),
    # built on Linux (the Windows all-ABI path is unreliable, PR #126), verified,
    # hashed and uploaded. This workflow holds no secrets, so the uploaded build
    # keeps Gradle's debug signature and is recorded as NOT_DISTRIBUTABLE; the
    # signed release is built on main by mobile-release.yml (ADR M-013). Before
    # that can happen, this job proves the signing path end to end with a
    # throwaway key, proves a debug-signed build cannot pass the release check,
    # and installs/cold-launches the re-signed APK on the oldest supported API.
    name: Android release build (all ABIs) + install/launch
    runs-on: ubuntu-latest
    needs: [isolation-guard, mobile]
    timeout-minutes: 90
    env:
      APP_VARIANT: preview
      EXPO_PUBLIC_API_BASE_URL: https://api.easymod.tech
      APP_BUILD_NUMBER: ${{ github.run_number }}
      GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EXPO_NO_TELEMETRY: '1'
    defaults:
      run:
        working-directory: ./EasyMod-mobile
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: EasyMod-mobile/package-lock.json

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: EasyMod-mobile/package-lock.json

      - name: Install
        run: npm ci

      - name: Generate the Android project (clean prebuild)
        run: npx expo prebuild --platform android --clean --no-install

      - name: Record the configured ABI matrix
        run: grep -E '^reactNativeArchitectures=' android/gradle.properties | tee android-abis.txt

      - name: Build release APK + AAB (all ABIs)
        run: |
          set -o pipefail
          mkdir -p artifacts
          cd android
          ./gradlew --no-daemon assembleRelease bundleRelease 2>&1 | tee ../artifacts/gradle-release.log

      - name: Verify the artifacts and write the manifest
        run: >-
          node scripts/verify-android-artifact.js
          --apk android/app/build/outputs/apk/release/app-release.apk
          --aab android/app/build/outputs/bundle/release/app-release.aab
          --package tech.easymod.merchant.preview
          --variant preview
          --source-sha "$GIT_SHA"
          --abis armeabi-v7a,arm64-v8a,x86,x86_64
          --mapping android/app/build/outputs/mapping/release/mapping.txt
          --out artifacts

      - name: A debug-signed build cannot pass as the release (negative control)
        run: |
          set -uo pipefail
          if node scripts/verify-android-artifact.js \
            --apk android/app/build/outputs/apk/release/app-release.apk \
            --aab android/app/build/outputs/bundle/release/app-release.aab \
            --package tech.easymod.merchant.preview \
            --abis armeabi-v7a,arm64-v8a,x86,x86_64 \
            --expect-signer "$(node -p "require('./release-signing.json').certificateSha256")" \
            --out "$RUNNER_TEMP/negative-control"; then
            echo '::error::the debug-signed build passed release verification'
            exit 1
          fi
          echo 'The debug-signed build was refused as a release, as required.'

      - name: A preview build cannot pass as the production (Play) build (negative control)
        run: |
          set -uo pipefail
          if node scripts/verify-android-artifact.js \
            --apk android/app/build/outputs/apk/release/app-release.apk \
            --aab android/app/build/outputs/bundle/release/app-release.aab \
            --package tech.easymod.merchant \
            --variant production \
            --abis armeabi-v7a,arm64-v8a,x86,x86_64 \
            --out "$RUNNER_TEMP/variant-negative-control"; then
            echo '::error::the preview build passed verification as the production build'
            exit 1
          fi
          echo 'The preview build was refused as the production build, as required.'

      - name: Prove the signing path with a throwaway key (never a release key)
        run: |
          set -euo pipefail
          ANDROID_UPLOAD_KEYSTORE_PASSWORD="$(openssl rand -hex 24)"
          ANDROID_UPLOAD_KEY_ALIAS=ci-throwaway
          export ANDROID_UPLOAD_KEYSTORE_PASSWORD ANDROID_UPLOAD_KEY_ALIAS
          keystore="$RUNNER_TEMP/ci-throwaway.p12"
          keytool -genkeypair -keystore "$keystore" -storetype PKCS12 -alias ci-throwaway \
            -keyalg RSA -keysize 2048 -validity 2 -dname 'CN=Mobile CI throwaway key' \
            -storepass:env ANDROID_UPLOAD_KEYSTORE_PASSWORD -keypass:env ANDROID_UPLOAD_KEYSTORE_PASSWORD
          ANDROID_UPLOAD_KEYSTORE_BASE64="$(base64 -w0 "$keystore")"
          export ANDROID_UPLOAD_KEYSTORE_BASE64
          throwaway_sha256="$(keytool -list -v -keystore "$keystore" -storetype PKCS12 -alias ci-throwaway \
            -storepass:env ANDROID_UPLOAD_KEYSTORE_PASSWORD | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ':')"
          bash scripts/sign-android-release.sh \
            android/app/build/outputs/apk/release/app-release.apk \
            android/app/build/outputs/bundle/release/app-release.aab \
            signing-path
          node scripts/verify-android-artifact.js \
            --apk signing-path/app-release.apk \
            --aab signing-path/app-release.aab \
            --package tech.easymod.merchant.preview \
            --abis armeabi-v7a,arm64-v8a,x86,x86_64 \
            --mapping android/app/build/outputs/mapping/release/mapping.txt \
            --expect-signer "$throwaway_sha256" \
            --out "$RUNNER_TEMP/signing-path-manifest" | tee artifacts/signing-path-check.txt
          rm -f "$keystore"

      - name: Enable KVM
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and cold-launch the re-signed release APK on API 24 (x86)
        uses: reactivecircus/android-emulator-runner@324029e2f414c084d8b15ba075288885e74aef9c # v2.34.0
        with:
          api-level: 24
          target: google_apis
          arch: x86
          profile: Nexus 5
          ram-size: 2048M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: ./EasyMod-mobile
          script: node scripts/android-install-launch-check.js signing-path/app-release.apk tech.easymod.merchant.preview artifacts

      - name: Upload release artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobile-android-release-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            EasyMod-mobile/artifacts/
            EasyMod-mobile/android-abis.txt
            EasyMod-mobile/android/app/build/outputs/apk/release/app-release.apk
            EasyMod-mobile/android/app/build/outputs/bundle/release/app-release.aab
            EasyMod-mobile/android/app/build/outputs/mapping/release/mapping.txt

  mobile-e2e-scope:
    name: Android E2E path scope (opt-in)
    runs-on: ubuntu-latest
    needs: [isolation-guard, protected-paths]
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'mobile-e2e') &&
      needs.isolation-guard.result == 'success' &&
      needs.protected-paths.result == 'success'
    outputs:
      native_touched: ${{ steps.scope.outputs.native_touched }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Check mobile and backend path scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git rev-parse --verify "$BASE_SHA^{commit}" >/dev/null
          if git diff --name-only "$BASE_SHA" "$GITHUB_SHA" | awk '/^EasyMod-mobile\// || /^EasyMod-backend\// { found=1 } END { exit found ? 0 : 1 }'; then
            echo 'native_touched=true' >> "$GITHUB_OUTPUT"
            echo 'Android E2E scope: mobile/backend paths changed'
          else
            echo 'native_touched=false' >> "$GITHUB_OUTPUT"
            echo 'Android E2E scope: no mobile/backend paths changed; emulator job skipped'
          fi

  mobile-e2e:
    name: Android Maestro E2E (opt-in)
    runs-on: ubuntu-latest
    needs: [isolation-guard, protected-paths, mobile-e2e-scope]
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'mobile-e2e') &&
      needs.isolation-guard.result == 'success' &&
      needs.protected-paths.result == 'success' &&
      needs.mobile-e2e-scope.result == 'success' &&
      needs.mobile-e2e-scope.outputs.native_touched == 'true'
    timeout-minutes: 120
    env:
      # Release-mode build of the development variant: an embedded JS bundle (no
      # Metro), cleartext allowed only for this variant, and the backend reached
      # through the emulator network (10.0.2.2) so airplane mode really cuts it.
      APP_VARIANT: development
      EXPO_PUBLIC_API_BASE_URL: http://10.0.2.2:4000
      APP_BUILD_NUMBER: ${{ github.run_number }}
      GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EXPO_NO_TELEMETRY: '1'
      E2E_API_BASE_URL: http://127.0.0.1:4000
      E2E_DATABASE_URL: postgres://e2e:e2e@127.0.0.1:5432/easymod_mobile_e2e
      E2E_REDIS_URL: redis://127.0.0.1:6379
      E2E_EMAIL: mobile-dev@easymod.test
      E2E_PASSWORD: MobileDev123!
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: easymod_mobile_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U e2e -d easymod_mobile_e2e"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: EasyMod-mobile/package-lock.json

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: EasyMod-mobile/package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Install mobile dependencies
        working-directory: ./EasyMod-mobile
        run: npm ci

      - name: Generate the Android project (clean prebuild)
        working-directory: ./EasyMod-mobile
        run: CI=1 npx expo prebuild --platform android --clean --no-install

      - name: Build the release-mode E2E APK (x86_64, emulator ABI)
        working-directory: ./EasyMod-mobile
        run: |
          set -o pipefail
          mkdir -p e2e/artifacts
          cd android
          ./gradlew --no-daemon assembleRelease -PreactNativeArchitectures=x86_64 2>&1 | tee ../e2e/artifacts/gradle-build.log

      - name: Install Maestro CLI
        run: |
          set -euo pipefail
          export MAESTRO_VERSION='2.6.0'
          export MAESTRO_DIR="$RUNNER_TEMP/maestro"
          export MAESTRO_ZIP="$RUNNER_TEMP/maestro.zip"
          export MAESTRO_UNPACK="$RUNNER_TEMP/maestro-unpack"
          mkdir -p "$MAESTRO_DIR" "$MAESTRO_UNPACK"
          curl -fsSL --retry 3 --retry-all-errors --proto '=https' --tlsv1.2 \
            -o "$MAESTRO_ZIP" \
            "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo '80185105a5d7e227e3b3fbcf225f45b312508ea676a9fc8e1b1aa1cac8b9ff6e  '"$MAESTRO_ZIP" | sha256sum --check --status
          unzip -t "$MAESTRO_ZIP" >/dev/null
          unzip -q "$MAESTRO_ZIP" -d "$MAESTRO_UNPACK"
          cp -R "$MAESTRO_UNPACK/maestro/." "$MAESTRO_DIR/"
          echo "$MAESTRO_DIR/bin" >> "$GITHUB_PATH"
          "$MAESTRO_DIR/bin/maestro" --version

      - name: Enable KVM
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run every Maestro flow on API 34 (x86_64)
        uses: reactivecircus/android-emulator-runner@324029e2f414c084d8b15ba075288885e74aef9c # v2.34.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: ./EasyMod-mobile
          script: |
            mkdir -p e2e/artifacts
            node e2e/run-maestro.js --start-backend --apk android/app/build/outputs/apk/release/app-release.apk

      - name: Upload Maestro artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobile-maestro-e2e
          if-no-files-found: ignore
          path: |
            EasyMod-mobile/e2e/artifacts/
            EasyMod-mobile/android/app/build/outputs/apk/release/app-release.apk

  android-device-apk:
    # Release-mode development build for a USB-attached arm64 phone: the same
    # source and R8 build as the emulator E2E APK, but it reaches the disposable
    # backend through `adb reverse` (http://localhost:4000) instead of the
    # emulator's host alias. Uploaded for the physical-device pass
    # (docs/mobile/DEV_SETUP.md §12); opt-in with the same `mobile-e2e` label.
    name: Android device test APK (arm64, opt-in)
    runs-on: ubuntu-latest
    needs: [isolation-guard, protected-paths, mobile-e2e-scope]
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'mobile-e2e') &&
      needs.isolation-guard.result == 'success' &&
      needs.protected-paths.result == 'success' &&
      needs.mobile-e2e-scope.result == 'success' &&
      needs.mobile-e2e-scope.outputs.native_touched == 'true'
    timeout-minutes: 90
    env:
      APP_VARIANT: development
      EXPO_PUBLIC_API_BASE_URL: http://localhost:4000
      APP_BUILD_NUMBER: ${{ github.run_number }}
      GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EXPO_NO_TELEMETRY: '1'
    defaults:
      run:
        working-directory: ./EasyMod-mobile
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: EasyMod-mobile/package-lock.json

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: EasyMod-mobile/package-lock.json

      - name: Install
        run: npm ci

      - name: Generate the Android project (clean prebuild)
        run: CI=1 npx expo prebuild --platform android --clean --no-install

      - name: Build the release-mode device APK (arm64-v8a)
        run: |
          set -o pipefail
          mkdir -p device-apk
          cd android
          ./gradlew --no-daemon assembleRelease -PreactNativeArchitectures=arm64-v8a 2>&1 | tee ../device-apk/gradle-build.log

      - name: Record the build identity
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/release/app-release.apk device-apk/app-device-arm64.apk
          cp android/app/build/outputs/mapping/release/mapping.txt device-apk/r8-mapping.txt
          {
            echo "SOURCE_SHA=$GIT_SHA"
            echo "APP_VARIANT=$APP_VARIANT API_BASE_URL=$EXPO_PUBLIC_API_BASE_URL"
            unzip -Z1 device-apk/app-device-arm64.apk | awk -F/ '/^lib\// { print $2 }' | sort -u | tr '\n' ' ' | sed 's/^/ABIS=/'
            echo
            (cd device-apk && sha256sum app-device-arm64.apk r8-mapping.txt)
          } | tee device-apk/device-apk.txt

      - name: Upload the device APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobile-device-apk-arm64-${{ github.run_number }}
          if-no-files-found: error
          path: EasyMod-mobile/device-apk/

  backend-regression:
    name: Backend regression (Node 20)
    runs-on: ubuntu-latest
    needs: [protected-paths]
    # Only runs when this branch's diff against origin/main touches
    # EasyMod-backend/ at all — a documentation-only or mobile-app-only branch
    # never spins up Postgres/Redis for this job.
    if: needs.protected-paths.outputs.backend_touched == 'true'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: easymod_integration_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Backend unit + security suite
        working-directory: ./EasyMod-backend
        run: |
          npm run test:security
          npm test

      - name: Migrate the integration database
        working-directory: ./EasyMod-backend
        env:
          DATABASE_URL: postgres://e2e:e2e@127.0.0.1:5432/easymod_integration_test
          DB_SSL: 'false'
          NODE_ENV: test
        run: npm run migrate

      - name: Backend integration suite
        working-directory: ./EasyMod-backend
        env:
          DATABASE_URL: postgres://e2e:e2e@127.0.0.1:5432/easymod_integration_test
          REDIS_URL: redis://127.0.0.1:6379
        run: npm run test:integration

      - name: Every backend test has exactly one execution home
        working-directory: ./EasyMod-backend
        run: npm run test:discovery

      - name: Native auth contract fixture has not drifted from the backend
        run: node .github/scripts/verify-native-auth-fixture-shape.js

  mobile-ci-gate:
    name: Mobile CI
    runs-on: ubuntu-latest
    if: always()
    needs: [isolation-guard, protected-paths, gitleaks, mobile, android-release, backend-regression, mobile-e2e-scope, mobile-e2e, android-device-apk]
    steps:
      - name: Report the mobile CI verdict
        env:
          R_GUARD: ${{ needs.isolation-guard.result }}
          R_PATHS: ${{ needs.protected-paths.result }}
          R_LEAKS: ${{ needs.gitleaks.result }}
          R_MOBILE: ${{ needs.mobile.result }}
          R_RELEASE: ${{ needs.android-release.result }}
          R_BACKEND: ${{ needs.backend-regression.result }}
          BACKEND_TOUCHED: ${{ needs.protected-paths.outputs.backend_touched }}
          R_E2E_SCOPE: ${{ needs.mobile-e2e-scope.result }}
          R_E2E: ${{ needs.mobile-e2e.result }}
          R_DEVICE_APK: ${{ needs.android-device-apk.result }}
        run: |
          set -euo pipefail
          echo "Isolation guard:    $R_GUARD"
          echo "Protected paths:    $R_PATHS"
          echo "Gitleaks:           $R_LEAKS"
          echo "Mobile checks:      $R_MOBILE"
          echo "Android release:    $R_RELEASE"
          echo "Backend regression: $R_BACKEND (backend touched: $BACKEND_TOUCHED)"
          echo "Mobile E2E scope:   $R_E2E_SCOPE"
          echo "Mobile E2E:         $R_E2E"
          echo "Device test APK:    $R_DEVICE_APK"
          fail=0
          for result in "$R_GUARD" "$R_PATHS" "$R_LEAKS" "$R_MOBILE" "$R_RELEASE"; do
            [ "$result" = "success" ] || fail=1
          done
          # Backend regression may only be skipped when the diff never touched the backend.
          if [ "$R_BACKEND" != "success" ] && { [ "$R_BACKEND" != "skipped" ] || [ "$BACKEND_TOUCHED" = "true" ]; }; then
            fail=1
          fi
          # Device E2E is label-gated (ADR M-009 cost policy); when it runs it must pass.
          for result in "$R_E2E_SCOPE" "$R_E2E" "$R_DEVICE_APK"; do
            [ "$result" = "success" ] || [ "$result" = "skipped" ] || fail=1
          done
          if [ "$fail" -ne 0 ]; then
            echo "Mobile CI: FAIL"
            exit 1
          fi
          echo "Mobile CI: PASS"
