appId: tech.easymod.merchant.dev
name: EasyMod Wave 2.5 refresh
tags:
  - mobile-e2e
  - wave25
  - refresh
env:
  E2E_EMAIL: mobile-dev@easymod.test
  E2E_PASSWORD: MobileDev123!
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: login-email-input
    timeout: 30000
- tapOn:
    id: login-email-input
- inputText: ${E2E_EMAIL}
- tapOn:
    id: login-password-input
- inputText: ${E2E_PASSWORD}
- tapOn:
    id: login-submit
- extendedWaitUntil:
    visible:
      id: home-attention-list
    timeout: 30000
- assertVisible:
    id: today-summary
- swipe:
    direction: DOWN
- extendedWaitUntil:
    visible:
      id: today-summary
    timeout: 30000
- assertVisible:
    id: home-attention-list
- takeScreenshot: wave25-refresh-complete
