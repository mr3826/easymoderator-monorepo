name: Database Backup

on:
  schedule:
    # Daily at 02:00 UTC (08:00 Bangladesh time); active merchant/payment data
    # should not accept a seven-day recovery point objective.
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      restore_drill:
        description: Restore the recorded production dump into an isolated throwaway database
        required: false
        default: false
        type: boolean

# ──────────────────────────────────────────────────────────────────────────────
# Required GitHub secrets:
#   DEPLOY_HOST       — Droplet IP or hostname (canonical deployment host)
#   DO_SSH_PRIVATE_KEY — SSH private key with root access to the droplet
#   DO_TOKEN           — DigitalOcean API token; used only for a redacted API probe
#
# Local backups are written to /opt/easymod/backups/ (7-day retention).
#
# OFF-SITE backups (finding F-04) are uploaded to S3-compatible object storage,
# client-side encrypted, when ALL of these secrets are configured:
#   BACKUP_ENCRYPTION_KEY     — passphrase for client-side AES-256 (app-owned)
#   SPACES_ACCESS_KEY_ID      — DO Spaces / S3 access key      (EXTERNAL)
#   SPACES_SECRET_ACCESS_KEY  — DO Spaces / S3 secret key      (EXTERNAL)
#   SPACES_ENDPOINT           — e.g. https://blr1.digitaloceanspaces.com
#   BACKUP_BUCKET             — bucket/space name
# Until the EXTERNAL Spaces credentials exist, this job fails closed with a
# clear message and F-04 remains BLOCKED_EXTERNAL_CREDENTIAL. A backup that sits
# only on the droplet it protects does not satisfy the pilot DR requirement.
# ──────────────────────────────────────────────────────────────────────────────

# This job talks only to the droplet over SSH and never calls the GitHub API,
# so it needs no token scope at all. Declared explicitly rather than inherited:
# the repository default is currently read, but a workflow that states its own
# permissions does not silently widen if that default is ever changed.
permissions:
  contents: read

jobs:
  backup:
    name: Backup PostgreSQL
    runs-on: ubuntu-latest
    steps:
      - name: Run pg_dump + encrypted off-site upload via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          DO_TOKEN: ${{ secrets.DO_TOKEN }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          SPACES_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          SPACES_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
          SPACES_ENDPOINT: ${{ secrets.SPACES_ENDPOINT }}
          BACKUP_BUCKET: ${{ secrets.BACKUP_BUCKET }}
          OFFSITE_RETENTION_DAYS: ${{ vars.OFFSITE_RETENTION_DAYS || '30' }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          timeout: 300s
          envs: DO_TOKEN,BACKUP_ENCRYPTION_KEY,SPACES_ACCESS_KEY_ID,SPACES_SECRET_ACCESS_KEY,SPACES_ENDPOINT,BACKUP_BUCKET,OFFSITE_RETENTION_DAYS
          script: |
            set -euo pipefail

            if [ -z "${DO_TOKEN:-}" ]; then
              echo "::error::DO_TOKEN_MISSING"
              echo "RECOVERY_EXECUTION_PAUSED_FOR_CREDENTIAL"
              exit 1
            fi

            # Verify the DigitalOcean credential without printing the token or
            # response body. The Spaces S3 credentials remain separate.
            DO_API_STATUS=$(curl -fsS -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${DO_TOKEN}" \
              https://api.digitalocean.com/v2/account || true)
            if [ "$DO_API_STATUS" != "200" ]; then
              echo "::error::DO_TOKEN_AUTHENTICATION_FAILED status=$DO_API_STATUS"
              exit 1
            fi

            BACKUP_DIR=/opt/easymod/backups
            mkdir -p "$BACKUP_DIR"

            # The production compose contract requires immutable image
            # references even for read-only commands such as `exec`. Resolve
            # the exact refs already running on the host so backup never
            # falls back to a mutable tag or accidentally targets a different
            # application release.
            RUNNING_BACKEND_IMAGE=$(docker inspect easymod-backend-1 --format '{{.Config.Image}}')
            RUNNING_WORKER_IMAGE=$(docker inspect easymod-worker-1 --format '{{.Config.Image}}')
            RUNNING_FRONTEND_IMAGE=$(docker inspect easymod-frontend-1 --format '{{.Config.Image}}')

            if [ "$RUNNING_BACKEND_IMAGE" != "$RUNNING_WORKER_IMAGE" ]; then
              echo "::error::BACKUP_IMAGE_CONTRACT_FAILED backend-and-worker-images-differ"
              exit 1
            fi

            for IMAGE_REF in "$RUNNING_BACKEND_IMAGE" "$RUNNING_FRONTEND_IMAGE"; do
              if ! printf '%s' "$IMAGE_REF" | grep -Eq '^.+@sha256:[0-9a-f]{64}$'; then
                echo "::error::BACKUP_IMAGE_CONTRACT_FAILED image-is-not-digest-pinned"
                exit 1
              fi
            done

            export GHCR_IMAGE_BACKEND="$RUNNING_BACKEND_IMAGE"
            export GHCR_IMAGE_FRONTEND="$RUNNING_FRONTEND_IMAGE"
            echo "Immutable compose image contract verified for running release"

            TIMESTAMP=$(date +%Y%m%d-%H%M%S)
            BACKUP_FILE="$BACKUP_DIR/easymod-${TIMESTAMP}.dump"
            UPLOADS_BACKUP_FILE="easymod-uploads-${TIMESTAMP}.tar.gz"

            echo "Starting backup: $BACKUP_FILE"

            # Dump in PostgreSQL custom format, matching restore-database.js.
            # --env-file is required: the compose file interpolates DB_PASSWORD
            # into services.postgres.environment, and compose fails the whole
            # command on a missing variable even for `exec`.
            # Dump whatever database the container was actually initialised
            # with, not a hardcoded guess. `pg_dump -U easymod_user easymod`
            # exited 0 against an empty `easymod` database while the app's data
            # lived elsewhere — a backup of nothing that looked like a success.
            docker compose --env-file /opt/easymod/.env.prod -f /opt/easymod/docker-compose.prod.yml exec -T postgres \
              sh -c 'pg_dump --format=custom --compress=9 -U "$POSTGRES_USER" "$POSTGRES_DB"' > "$BACKUP_FILE"

            # A pg_dump that fails mid-stream still leaves a valid gzip of a
            # partial dump, so size-check the result rather than trusting exit 0.
            # pg_restore's custom-format reader needs a seekable file, not a
            # pipe — `pg_restore -l -` fails with "could not open input file
            # "-"" even though it accepts the flag syntactically, so the dump
            # is copied into the container as a real file first.
            BACKUP_BYTES=$(wc -c < "$BACKUP_FILE")
            docker compose --env-file /opt/easymod/.env.prod -f /opt/easymod/docker-compose.prod.yml exec -T postgres \
              sh -c 'cat > /tmp/backup-verify.dump' < "$BACKUP_FILE"
            TABLE_COUNT=$(docker compose --env-file /opt/easymod/.env.prod -f /opt/easymod/docker-compose.prod.yml exec -T postgres \
              sh -c 'pg_restore -l /tmp/backup-verify.dump | grep -c "TABLE "; rm -f /tmp/backup-verify.dump' || true)
            echo "Dump: ${BACKUP_BYTES} bytes custom format, ${TABLE_COUNT} table entries"
            if [ "$BACKUP_BYTES" -lt 10000 ] || [ "$TABLE_COUNT" -lt 5 ]; then
              echo "ERROR: dump looks empty (${BACKUP_BYTES} bytes, ${TABLE_COUNT} tables) — treating as failed"
              exit 1
            fi

            echo "Backup complete: $(du -sh "$BACKUP_FILE" | cut -f1)"

            echo "Starting uploads volume backup: $BACKUP_DIR/$UPLOADS_BACKUP_FILE"
            docker compose --env-file /opt/easymod/.env.prod -f /opt/easymod/docker-compose.prod.yml run \
              --rm --no-deps --user root -v "$BACKUP_DIR":/backup --entrypoint sh backend \
              -c "cd /app/uploads && tar czf /backup/$UPLOADS_BACKUP_FILE ."
            echo "Uploads backup complete: $(du -sh "$BACKUP_DIR/$UPLOADS_BACKUP_FILE" | cut -f1)"

            # Product uploads are quota-bounded at request time. Sweep
            # abandoned files after the backup so a failed product save or
            # abandoned form cannot retain storage indefinitely. Best-effort:
            # the deployed backend image can legitimately lag the repo while
            # production deploys are gated off, so a missing script here must
            # not abort the backup that this whole job exists to produce.
            docker compose --env-file /opt/easymod/.env.prod -f /opt/easymod/docker-compose.prod.yml run \
              --rm --no-deps --user root --entrypoint node backend /app/scripts/cleanup-product-media.js \
              || echo "::warning::cleanup-product-media.js unavailable in the currently deployed backend image — orphan sweep skipped this run"

            # ── Off-site upload (F-04) ────────────────────────────────────────
            # All-or-nothing guard: every off-site secret must be present. A
            # partial config is treated as "not configured" so we never upload
            # UNENCRYPTED (missing BACKUP_ENCRYPTION_KEY) or to an unauthenticated
            # target.
            if [ -n "${BACKUP_ENCRYPTION_KEY:-}" ] && [ -n "${SPACES_ACCESS_KEY_ID:-}" ] \
               && [ -n "${SPACES_SECRET_ACCESS_KEY:-}" ] && [ -n "${SPACES_ENDPOINT:-}" ] \
               && [ -n "${BACKUP_BUCKET:-}" ]; then
              echo "Off-site upload: credentials present — encrypting and uploading."

              upload_one() {
                SRC="$1"; DEST_PREFIX="$2"
                BASE=$(basename "$SRC")
                ENC="$BACKUP_DIR/${BASE}.enc"

                # Client-side AES-256 encryption. The object storage never sees
                # plaintext; losing BACKUP_ENCRYPTION_KEY means the archive is
                # unrecoverable, so that secret must be preserved off-platform.
                openssl enc -aes-256-cbc -pbkdf2 -salt -in "$SRC" -out "$ENC" \
                  -pass env:BACKUP_ENCRYPTION_KEY

                # Integrity checksum uploaded alongside the object.
                sha256sum "$ENC" | awk '{print $1}' > "$ENC.sha256"

                # Use the official aws-cli container so we do not depend on the
                # host having awscli installed. DO Spaces is S3-compatible.
                docker run --rm \
                  -e AWS_ACCESS_KEY_ID="$SPACES_ACCESS_KEY_ID" \
                  -e AWS_SECRET_ACCESS_KEY="$SPACES_SECRET_ACCESS_KEY" \
                  -v "$BACKUP_DIR":/backup \
                  amazon/aws-cli s3 cp "/backup/$(basename "$ENC")" \
                  "s3://$BACKUP_BUCKET/$DEST_PREFIX/$(basename "$ENC")" \
                  --endpoint-url "$SPACES_ENDPOINT"

                docker run --rm \
                  -e AWS_ACCESS_KEY_ID="$SPACES_ACCESS_KEY_ID" \
                  -e AWS_SECRET_ACCESS_KEY="$SPACES_SECRET_ACCESS_KEY" \
                  -v "$BACKUP_DIR":/backup \
                  amazon/aws-cli s3 cp "/backup/$(basename "$ENC").sha256" \
                  "s3://$BACKUP_BUCKET/$DEST_PREFIX/$(basename "$ENC").sha256" \
                  --endpoint-url "$SPACES_ENDPOINT"

                echo "Off-site upload OK: $DEST_PREFIX/$(basename "$ENC")"
                rm -f "$ENC" "$ENC.sha256"
              }

              upload_one "$BACKUP_FILE" "db"
              upload_one "$BACKUP_DIR/$UPLOADS_BACKUP_FILE" "uploads"

              # Verify the intended bucket is private and has an actual
              # lifecycle policy. A configured retention variable alone is not
              # evidence that Spaces will delete expired objects.
              BUCKET_ACL=$(docker run --rm \
                -e AWS_ACCESS_KEY_ID="$SPACES_ACCESS_KEY_ID" \
                -e AWS_SECRET_ACCESS_KEY="$SPACES_SECRET_ACCESS_KEY" \
                amazon/aws-cli s3api get-bucket-acl --bucket "$BACKUP_BUCKET" \
                --endpoint-url "$SPACES_ENDPOINT" --output json)
              if printf '%s' "$BUCKET_ACL" | grep -Eq 'AllUsers|AuthenticatedUsers'; then
                echo "::error::Spaces bucket ACL exposes a public or authenticated-users grant"
                exit 1
              fi
              docker run --rm \
                -e AWS_ACCESS_KEY_ID="$SPACES_ACCESS_KEY_ID" \
                -e AWS_SECRET_ACCESS_KEY="$SPACES_SECRET_ACCESS_KEY" \
                amazon/aws-cli s3api get-bucket-lifecycle-configuration --bucket "$BACKUP_BUCKET" \
                --endpoint-url "$SPACES_ENDPOINT" >/dev/null
              echo "Off-site upload complete."
            else
              echo "::error::Off-site backup upload BLOCKED — object-storage credentials not configured (F-04 BLOCKED_EXTERNAL_CREDENTIAL). Backups exist ONLY on the droplet."
              exit 1
            fi

            # Retain only the last 7 days of LOCAL copies
            find "$BACKUP_DIR" -name "easymod-*.dump" -mtime +7 -delete
            find "$BACKUP_DIR" -name "easymod-uploads-*.tar.gz" -mtime +7 -delete
            find "$BACKUP_DIR" -name "*.enc" -mtime +1 -delete 2>/dev/null || true
            echo "Retention cleanup done. Current backups:"
            ls -lh "$BACKUP_DIR"

  restore-drill:
    name: Isolated PostgreSQL restore drill
    if: github.event_name == 'workflow_dispatch' && inputs.restore_drill == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Restore the recorded production dump into an isolated target
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          RESTORE_DRILL_RUN_ID: ${{ github.run_id }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          timeout: 900s
          envs: RESTORE_DRILL_RUN_ID
          script: |
            set -euo pipefail
            umask 077

            BACKUP_FILE=${BACKUP_FILE:-}
            if [ -z "$BACKUP_FILE" ]; then
              BACKUP_FILE=$(find /opt/easymod/backups -maxdepth 1 -type f -name 'easymod-*.dump' -printf '%T@ %p\n' | sort -nr | sed -n '1s/^[^ ]* //p')
            fi
            test -n "$BACKUP_FILE"
            printf 'RESTORE_BACKUP_FILE=%s\n' "$BACKUP_FILE"
            RESTORE_CONTAINER="easymod-restore-drill-${RESTORE_DRILL_RUN_ID}"
            RESTORE_NETWORK="${RESTORE_CONTAINER}-network"
            RESTORE_VOLUME="${RESTORE_CONTAINER}-data"
            POSTGRES_IMAGE='postgres@sha256:df7bca0066e6f60cc3dd32faa70caddec20e2c22b58932f79498e5704b23854a'

            cleanup() {
              docker rm -f "$RESTORE_CONTAINER" >/dev/null 2>&1 || true
              docker volume rm "$RESTORE_VOLUME" >/dev/null 2>&1 || true
              docker network rm "$RESTORE_NETWORK" >/dev/null 2>&1 || true
            }
            trap cleanup EXIT

            # The target must never be production or attached to its network.
            test "$RESTORE_CONTAINER" != 'easymod-postgres-1'
            test "$RESTORE_NETWORK" != 'easymod_internal'
            test -f "$BACKUP_FILE"
            test -n "$RESTORE_DRILL_RUN_ID"

            if docker ps -a --format '{{.Names}}' | grep -Fxq "$RESTORE_CONTAINER"; then
              echo 'RESTORE_DRILL_REFUSED=existing_container'
              exit 1
            fi
            if docker network ls --format '{{.Name}}' | grep -Fxq "$RESTORE_NETWORK"; then
              echo 'RESTORE_DRILL_REFUSED=existing_network'
              exit 1
            fi
            if docker volume ls --format '{{.Name}}' | grep -Fxq "$RESTORE_VOLUME"; then
              echo 'RESTORE_DRILL_REFUSED=existing_volume'
              exit 1
            fi

            PRODUCTION_POSTGRES_STARTED_AT=$(docker inspect -f '{{.State.StartedAt}}' easymod-postgres-1)
            POSTGRES_ENV=$(docker inspect easymod-postgres-1 --format '{{range .Config.Env}}{{println .}}{{end}}')
            POSTGRES_USER=$(printf '%s\n' "$POSTGRES_ENV" | awk -F= '$1 == "POSTGRES_USER" { print substr($0, index($0, "=") + 1); exit }')
            POSTGRES_PASSWORD=$(printf '%s\n' "$POSTGRES_ENV" | awk -F= '$1 == "POSTGRES_PASSWORD" { print substr($0, index($0, "=") + 1); exit }')
            POSTGRES_DB=$(printf '%s\n' "$POSTGRES_ENV" | awk -F= '$1 == "POSTGRES_DB" { print substr($0, index($0, "=") + 1); exit }')
            test -n "$POSTGRES_USER"
            test -n "$POSTGRES_PASSWORD"
            test -n "$POSTGRES_DB"

            docker network create "$RESTORE_NETWORK" >/dev/null
            docker volume create "$RESTORE_VOLUME" >/dev/null
            docker run --detach --name "$RESTORE_CONTAINER" \
              --network "$RESTORE_NETWORK" \
              --mount "type=volume,src=$RESTORE_VOLUME,dst=/var/lib/postgresql/data" \
              --env "POSTGRES_USER=$POSTGRES_USER" \
              --env "POSTGRES_PASSWORD=$POSTGRES_PASSWORD" \
              --env "POSTGRES_DB=$POSTGRES_DB" \
              "$POSTGRES_IMAGE" >/dev/null

            ready=false
            for attempt in $(seq 1 60); do
              if docker exec "$RESTORE_CONTAINER" pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" >/dev/null 2>&1 \
                && [ "$(docker exec "$RESTORE_CONTAINER" psql -X -At -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c 'SELECT 1' 2>/dev/null)" = 1 ]; then
                ready=true
                break
              fi
              sleep 2
            done
            test "$ready" = true

            docker cp "$BACKUP_FILE" "$RESTORE_CONTAINER:/tmp/restore.dump"
            docker exec "$RESTORE_CONTAINER" pg_restore \
              --clean --if-exists --exit-on-error --no-owner --no-privileges \
              -U "$POSTGRES_USER" -d "$POSTGRES_DB" /tmp/restore.dump

            for table in users shops growth_os_user_roles growth_prospects; do
              table_exists=$(docker exec "$RESTORE_CONTAINER" psql -X -At \
                -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
                -c "SELECT to_regclass('public.' || quote_ident('$table')) IS NOT NULL;")
              if [ "$table_exists" = t ]; then
                row_count=$(docker exec "$RESTORE_CONTAINER" psql -X -At \
                  -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
                  -c "SELECT COUNT(*) FROM \"$table\";")
                printf 'RESTORE_ROW_COUNT_%s=%s\n' "$table" "$row_count"
                if [ "$table" = users ] || [ "$table" = shops ]; then
                  test "$row_count" -gt 0
                fi
              else
                printf 'RESTORE_ROW_COUNT_%s=ABSENT\n' "$table"
              fi
            done

            max_migration=$(docker exec "$RESTORE_CONTAINER" psql -X -At \
              -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
              -c 'SELECT name FROM migrations ORDER BY executed_at DESC LIMIT 1;')
            test -n "$max_migration"
            printf 'RESTORE_MAX_MIGRATION=%s\n' "$max_migration"

            test "$(docker inspect -f '{{.State.StartedAt}}' easymod-postgres-1)" = "$PRODUCTION_POSTGRES_STARTED_AT"
            echo 'RESTORE_PG_RESTORE=PASS'
            echo 'PRODUCTION_POSTGRES_UPTIME_UNCHANGED=PASS'
