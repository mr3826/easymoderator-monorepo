appId: tech.easymod.merchant.dev
# Shared password step. Callers pass LOGIN_EMAIL / LOGIN_PASSWORD. Fields are
# cleared first because the login screen keeps them after a cancelled 2FA step.
---
- extendedWaitUntil:
    visible:
      id: login-email-input
    timeout: 60000
- tapOn:
    id: login-email-input
- eraseText: 80
- inputText: ${LOGIN_EMAIL}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: login-password-input
    direction: DOWN
    timeout: 15000
- tapOn:
    id: login-password-input
- eraseText: 80
- inputText: ${LOGIN_PASSWORD}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: login-submit
    direction: DOWN
    timeout: 15000
- tapOn:
    id: login-submit
