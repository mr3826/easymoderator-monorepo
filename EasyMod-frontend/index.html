
  <!DOCTYPE html>
  <html lang="bn">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
      <title>EasyModerator | Customer support and connected commerce</title>
      <meta name="description" content="Bring Messenger support and order work into one workspace. Compare current plans and explore the wider merchant ecosystem." />
      <meta name="robots" content="index,follow" />
      <link rel="canonical" href="https://easymod.tech/" />
      <meta property="og:type" content="website" />
      <meta property="og:site_name" content="EasyModerator" />
      <meta property="og:title" content="EasyModerator | Customer support and connected commerce" />
      <meta property="og:description" content="Bring Messenger support and order work into one workspace. Compare current plans and explore the wider merchant ecosystem." />
      <meta property="og:url" content="https://easymod.tech/" />
      <meta name="twitter:card" content="summary_large_image" />
      <meta name="twitter:title" content="EasyModerator | Customer support and connected commerce" />
      <meta name="twitter:description" content="Bring Messenger support and order work into one workspace. Compare current plans and explore the wider merchant ecosystem." />
      <!-- Sentry CSP removed -->
      <!-- Approved EasyModerator typography: Hind Siliguri (Bengali-first). Restored from
           production main; the V6 branch had dropped it with no self-hosted replacement. -->
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet" />
      <!-- PWA / installable -->
      <link rel="manifest" href="/manifest.webmanifest" />
      <meta name="theme-color" content="#17223B" />
      <meta name="mobile-web-app-capable" content="yes" />
      <meta name="apple-mobile-web-app-capable" content="yes" />
      <meta name="apple-mobile-web-app-status-bar-style" content="default" />
      <meta name="apple-mobile-web-app-title" content="EasyModerator" />
      <!--
        The ?v= query busts two caches at once: nginx serves *.png with
        max-age=2592000 (nginx.conf), and sw.js is cache-first for png/svg.
        index.html itself is no-cache, so a new ?v= propagates on first load.
        Bump it (and CACHE_VERSION in sw.js) whenever the icons change.
      -->
      <link rel="apple-touch-icon" href="/icon-512.png?v=2" />
      <!-- SVG mark first: stays crisp at 16px where the full logo blurs. PNG is the Safari fallback. -->
      <link rel="icon" type="image/svg+xml" href="/brand/mark.svg?v=2" />
      <link rel="icon" type="image/png" href="/icon-512.png?v=2" />

      <!-- Link previews use the same scoped public funnel description. -->
      <meta property="og:image" content="https://easymod.tech/brand/og-card.png?v=2" />
      <meta property="og:image:width" content="1200" />
      <meta property="og:image:height" content="630" />
      <meta name="twitter:image" content="https://easymod.tech/brand/og-card.png?v=2" />
    </head>

    <body>
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
