name: Seed Initial Growth OS Admin

# -----------------------------------------------------------------------------
# One-time production identity seed for the first Growth OS administrator.
#
# This workflow creates only a shop-less, temporary-password identity. It does
# not grant SUPER_ADMIN; grant-growth-role.yml remains the canonical audited
# role mutation after password rotation and real MFA enrollment.
# -----------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      email:
        description: "Email for the new shop-less initial operator"
        required: true
        default: growth-admin@easymod.tech
        type: string

concurrency:
  group: seed-initial-growth-admin
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  seed:
    name: Seed initial operator on production
    if: github.ref == 'refs/heads/main' && github.actor == 'mr3826'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Derive pinned SSH host fingerprint
        id: ssh_host
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.DO_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          host_entry=$(ssh-keygen -F "$DEPLOY_HOST" -f "$HOME/.ssh/known_hosts" | awk '!/^#/ { print; exit }')
          key_type=$(printf '%s\n' "$host_entry" | awk '{ print $2 }')
          key_blob=$(printf '%s\n' "$host_entry" | awk '{ print $3 }')
          if [ -z "$key_type" ] || [ -z "$key_blob" ]; then
            echo '::error::pinned host key is missing for DEPLOY_HOST'
            exit 1
          fi
          fingerprint=$(printf '%s %s\n' "$key_type" "$key_blob" | ssh-keygen -lf - -E sha256 | awk '{ print $2 }')
          if [ -z "$fingerprint" ]; then
            echo '::error::could not derive the pinned host fingerprint'
            exit 1
          fi
          printf 'fingerprint=%s\n' "$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Run initial-admin seed in the running backend
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DO_SSH_PRIVATE_KEY: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          TARGET_EMAIL: ${{ inputs.email }}
          INITIAL_GROWTH_ADMIN_PASSWORD: ${{ secrets.INITIAL_GROWTH_ADMIN_PASSWORD }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/easymod-growth-bootstrap-key"
          umask 077
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$DO_SSH_PRIVATE_KEY" > "$key_file"
          printf '%s\n%s\n%s\n' \
            "$INITIAL_GROWTH_ADMIN_PASSWORD" \
            "$TARGET_EMAIL" \
            "$GITHUB_ACTOR" \
          | ssh -i "$key_file" \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -o ConnectTimeout=20 \
              root@"$DEPLOY_HOST" '
                set -euo pipefail
                IFS= read -r INITIAL_GROWTH_ADMIN_PASSWORD
                IFS= read -r TARGET_EMAIL
                IFS= read -r GITHUB_ACTOR
                if [ -z "$INITIAL_GROWTH_ADMIN_PASSWORD" ]; then
                  echo "INITIAL_GROWTH_ADMIN_PASSWORD is not configured in the protected environment." >&2
                  exit 1
                fi
                cd /opt/easymod
                backend_container=$(docker ps \
                  --filter "label=com.docker.compose.service=backend" \
                  --filter "status=running" \
                  --format "{{.ID}}" | head -n 1)
                if [ -z "$backend_container" ]; then
                  echo "No running Compose backend container was found." >&2
                  exit 1
                fi
                printf "%s\n" "$INITIAL_GROWTH_ADMIN_PASSWORD" | docker exec -i \
                  -e INITIAL_GROWTH_ADMIN_EMAIL="$TARGET_EMAIL" \
                  -e GITHUB_ACTOR="$GITHUB_ACTOR" \
                  "$backend_container" sh -c "IFS= read -r INITIAL_GROWTH_ADMIN_PASSWORD && export INITIAL_GROWTH_ADMIN_PASSWORD && exec node src/scripts/seed-initial-growth-admin.js"
              '
