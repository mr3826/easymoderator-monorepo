appId: tech.easymod.merchant.dev
name: Order Verification and Confirmation Flow
tags:
  - mobile-e2e
  - orders
  - order-confirm
---
- launchApp
- extendedWaitUntil:
    visible:
      id: home-attention-list
    timeout: 60000
- openLink: easymodmerchantdev://order-detail/${E2E_SHOP_A_ORDER_ID}
- extendedWaitUntil:
    visible:
      id: mobile-order-detail
    timeout: 30000
- assertVisible:
    id: mobile-order-risk-panel
- assertVisible:
    id: mobile-order-confirm-btn
- assertVisible:
    id: mobile-order-cancel-btn
- tapOn:
    id: mobile-order-confirm-btn
- extendedWaitUntil:
    visible:
      id: mobile-order-modal-confirm-submit
    timeout: 10000
- tapOn:
    id: mobile-order-modal-confirm-submit
- extendedWaitUntil:
    visible:
      id: order-status-confirmed
    timeout: 30000
- back
- back
