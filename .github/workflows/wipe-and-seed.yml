name: Wipe Production DB + Seed Admin

on:
  workflow_dispatch:
    inputs:
      admin_email:
        description: "Admin user email"
        required: true
        default: "admin@test.prod"
      admin_password:
        description: "Admin user password"
        required: true

jobs:
  wipe-and-seed:
    name: Wipe DB/Redis and Seed Admin
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DO_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DO_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Wipe DB + Redis + Seed Admin
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DO_HOST }}
          username: root
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          timeout: 120s
          envs: ADMIN_EMAIL,ADMIN_PASSWORD
          script: |
            set -e
            cd /opt/easymod

            echo "=== Wiping PostgreSQL tables + Redis ==="
            echo "YES" | docker compose -f docker-compose.prod.yml exec -T backend bash /app/scripts/wipe-and-fresh.sh

            echo "=== Seeding admin user ==="
            docker compose -f docker-compose.prod.yml exec -T \
              -e SEED_ADMIN_EMAIL="$ADMIN_EMAIL" \
              -e SEED_ADMIN_PASSWORD="$ADMIN_PASSWORD" \
              backend npm run seed:admin

            echo "=== Done ==="
        env:
          ADMIN_EMAIL: ${{ github.event.inputs.admin_email }}
          ADMIN_PASSWORD: ${{ github.event.inputs.admin_password }}
