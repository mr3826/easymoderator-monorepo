appId: tech.easymod.merchant.dev
name: EasyMod server-side session expiry
tags:
  - mobile-e2e
  - wave25
  - session-expiry
---
- launchApp:
    clearState: true
- runFlow:
    file: ../support/sign-in.yaml
    env:
      LOGIN_EMAIL: ${E2E_EMAIL}
      LOGIN_PASSWORD: ${E2E_PASSWORD}
- extendedWaitUntil:
    visible:
      id: home-attention-list
    timeout: 90000
# Expire every session of the seed owner on the server, then make the app talk to it.
- runScript:
    file: ../scripts/fixture-control.js
    env:
      apiBaseUrl: ${E2E_API_BASE_URL}
      controlToken: ${E2E_CONTROL_TOKEN}
      action: expire-sessions
- swipe:
    direction: DOWN
- extendedWaitUntil:
    visible:
      id: login-email-input
    timeout: 60000
- assertNotVisible:
    id: home-attention-list
- assertNotVisible:
    id: attention-card-.*
- takeScreenshot: session-expired
# Protected data must not come back on relaunch either.
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: login-email-input
    timeout: 60000
- assertNotVisible:
    id: home-attention-list
