name: Deploy Backend to Digital Ocean

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/easymod-backend

jobs:
  test:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci
      - run: npm test -- --passWithNoTests --forceExit

  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: meta
        run: |
          SHORT="${GITHUB_SHA::8}"
          echo "image_tag=${{ env.GHCR_IMAGE }}:${SHORT}" >> $GITHUB_OUTPUT

      - name: Build & push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image_tag }}
            ${{ env.GHCR_IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache,mode=max

  deploy:
    name: Deploy to DO Droplet
    runs-on: ubuntu-latest
    needs: build
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DO_HOST }}
          username: root
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          timeout: 300s
          envs: GHCR_IMAGE,IMAGE_TAG,GH_ACTOR,GH_TOKEN
          script: |
            set -e
            echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

            echo "Pulling backend: $IMAGE_TAG"
            docker pull "$IMAGE_TAG"
            docker tag "$IMAGE_TAG" "$GHCR_IMAGE:latest"

            cd /opt/easymod
            # Keep frontend image pointing at whatever is currently running so
            # docker-compose.prod.yml doesn't complain about a missing image ref.
            export GHCR_IMAGE_BACKEND="$GHCR_IMAGE:latest"
            export GHCR_IMAGE_FRONTEND="${GHCR_IMAGE_FRONTEND:-$(docker inspect easymod-frontend --format='{{index .Config.Image}}' 2>/dev/null || echo ghcr.io/mr3826/easymod-frontend:latest)}"
            docker compose -f docker-compose.prod.yml up -d backend queue-worker --no-build --remove-orphans

            echo "Running database migrations..."
            docker compose -f docker-compose.prod.yml exec -T backend npm run migrate

            for i in $(seq 1 20); do
              STATUS=$(curl -sf http://localhost:3000/health/ready -o /dev/null -w "%{http_code}" || echo "000")
              if [ "$STATUS" = "200" ]; then echo "Health check passed (attempt $i)"; break; fi
              echo "Attempt $i: $STATUS — retrying in 5s..."
              sleep 5
              if [ "$i" = "20" ]; then echo "ERROR: Health check failed"; exit 1; fi
            done

            docker image prune -f
        env:
          GHCR_IMAGE: ${{ env.GHCR_IMAGE }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
