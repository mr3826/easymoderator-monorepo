name: Grant Growth OS Role

# -----------------------------------------------------------------------------
# Manually bootstrap the first EasyModerator Growth OS Super Admin on production.
#
# This is the supported bootstrap path only. Ongoing role changes use the
# authenticated Growth OS user-administration screen after the first Super
# Admin exists. The operator identity is a protected environment secret, never
# a workflow-dispatch input.
#
# The target email MUST already exist as the shop-less, MFA-enrolled identity
# created by seed-initial-growth-admin.yml. This workflow changes Growth OS
# access; it does not create or modify user accounts.
# -----------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      email:
        description: 'Email of the seeded, MFA-enrolled initial operator'
        required: true
        default: growth-admin@easymod.tech
        type: string
      role:
        description: 'Growth OS role to set'
        required: true
        default: SUPER_ADMIN
        type: choice
        options:
          - SUPER_ADMIN

# Never run two Growth OS role changes at once.
concurrency:
  group: grant-growth-role
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  grant:
    name: Set Growth OS role on production
    runs-on: ubuntu-latest
    # The protected production environment currently requires reviewer mr3826.
    # Bind dispatch authority to that same reviewed operator identity instead of
    # treating GITHUB_ACTOR as audit-only metadata.
    if: github.ref == 'refs/heads/main' && github.actor == 'mr3826'
    environment: production
    steps:
      - name: Derive pinned SSH host fingerprint
        id: ssh_host
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.DO_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          host_entry=$(ssh-keygen -F "$DEPLOY_HOST" -f "$HOME/.ssh/known_hosts" | awk '!/^#/ { print; exit }')
          key_type=$(printf '%s\n' "$host_entry" | awk '{ print $2 }')
          key_blob=$(printf '%s\n' "$host_entry" | awk '{ print $3 }')
          if [ -z "$key_type" ] || [ -z "$key_blob" ]; then
            echo '::error::pinned host key is missing for DEPLOY_HOST'
            exit 1
          fi
          fingerprint=$(printf '%s %s\n' "$key_type" "$key_blob" | ssh-keygen -lf - -E sha256 | awk '{ print $2 }')
          if [ -z "$fingerprint" ]; then
            echo '::error::could not derive the pinned host fingerprint'
            exit 1
          fi
          printf 'fingerprint=%s\n' "$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Run grant-growth-role on droplet
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          fingerprint: ${{ steps.ssh_host.outputs.fingerprint }}
          timeout: 120s
          # `timeout` covers the SSH connection only; the remote command gets
          # appleboy's 10-minute default. Cap it explicitly so a transport
          # default can never mislabel a committed grant as a failed run.
          command_timeout: 15m
          # Forward inputs as named env vars so they are not interpolated into
          # the remote shell (avoids command injection through the email field).
          envs: TARGET_EMAIL,TARGET_ROLE,BOOTSTRAP_ACTOR_EMAIL,GITHUB_ACTOR
          script: |
            set -euo pipefail
            if [ -z "${BOOTSTRAP_ACTOR_EMAIL}" ]; then
              echo 'GROWTH_BOOTSTRAP_ACTOR_EMAIL is not configured in the protected environment.' >&2
              exit 1
            fi
            cd /opt/easymod
            echo "==> Bootstrapping Growth OS role=${TARGET_ROLE} for ${TARGET_EMAIL} via GitHub actor ${GITHUB_ACTOR}"
            backend_container=$(docker ps \
              --filter 'label=com.docker.compose.service=backend' \
              --filter 'status=running' \
              --format '{{.ID}}' | head -n 1)
            if [ -z "${backend_container}" ]; then
              echo 'No running Compose backend container was found.' >&2
              exit 1
            fi
            # Use the already-running candidate directly. `docker compose exec`
            # interpolates every required image variable before it can exec, but
            # .env.prod intentionally contains runtime secrets/config only; the
            # running container is the authoritative production code target.
            docker exec \
              -e GROWTH_BOOTSTRAP_ACTOR_EMAIL="${BOOTSTRAP_ACTOR_EMAIL}" \
              -e GITHUB_ACTOR="${GITHUB_ACTOR}" \
              "${backend_container}" node src/scripts/grant-growth-role.js "${TARGET_EMAIL}" "${TARGET_ROLE}"
            echo "==> Done."
        env:
          TARGET_EMAIL: ${{ inputs.email }}
          TARGET_ROLE: ${{ inputs.role }}
          BOOTSTRAP_ACTOR_EMAIL: ${{ secrets.GROWTH_BOOTSTRAP_ACTOR_EMAIL }}
          GITHUB_ACTOR: ${{ github.actor }}
