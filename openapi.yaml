openapi: 3.1.0
  /category/:
    parameters:
      - $ref: '#/components/parameters/XShopId'
      - $ref: '#/components/parameters/RateLimitInfo'
    get:
      tags: [Category]
      summary: List categories
      responses:
        '200':
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Category' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Category]
      summary: Create category
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryCreate' }
      responses:
        '201': { description: Created }
        '401': { $ref: '#/components/responses/Unauthorized' }
  disabledInEnvironments:
    - production

components:
  /category/{id}:
    parameters:
      - $ref: '#/components/parameters/XShopId'
      - $ref: '#/components/parameters/RateLimitInfo'
    get:
      tags: [Category]
      summary: Get category by id
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Category }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Category]
      summary: Update category
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryUpdate' }
      responses:
        '200': { description: Updated }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Category]
      summary: Delete category
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }
                properties:
                  code:
                    type: string
                    example: VALIDATION_ERROR
                  message:
                    type: string
                    example: Invalid request payload
    Unauthorized:
      description: Authentication required or invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/responses/Error/content/application~1json/schema'
          examples:
            unauthorized:
              value:
                success: false
                error:
                  code: AUTH_ERROR
                  message: Invalid or missing token
  schemas:
    Shop:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        address:
          type: string
        phone:
          type: string
    Category:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        parent_id:
          type: string
        shop_id:
          type: string
    Product:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        sku:
          type: string
        price:
          type: number
        stock:
          type: integer
        category_id:
          type: string
    Customer:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
    Order:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
        total:
          type: number
        customer_id:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
    OrderItem:
      type: object
      properties:
        product_id:
          type: string
        quantity:
          type: integer
        price:
          type: number
    PaymentConfig:
      type: object
      properties:
        gateway:
          type: string
          enum: [aamarpay, sslcommerz, cod]
        active:
          type: boolean
        credentials:
          type: object
    Subscription:
      type: object
      properties:
        id:
          type: string
        plan_name:
          type: string
        status:
          type: string
        conversations_used:
          type: integer
        orders_used:
          type: integer
        products_used:
          type: integer
        next_billing_date:
          type: string
          format: date-time
    Invoice:
      type: object
      properties:
        id:
          type: string
        invoice_number:
          type: string
        billing_period:
          type: string
        amount:
          type: number
        status:
          type: string
        due_date:
          type: string
          format: date-time
    Channel:
      type: object
      properties:
        id:
          type: string
        platform:
          type: string
        status:
          type: string
        metadata:
          type: object
    Conversation:
      type: object
      properties:
        id:
          type: string
        subject:
          type: string
        status:
          type: string
        channel:
          type: string
    Message:
      type: object
      properties:
        id:
          type: string
        conversation_id:
          type: string
        sender:
          type: string
        content:
          type: string
        sent_at:
          type: string
          format: date-time

security:
  - bearerAuth: []

tags:
  - name: Health
  - name: Auth
  - name: Shop
  - name: Category
  - name: Product
  - name: Customer
  - name: Order
  - name: Payment
  - name: Channel
  - name: Dashboard
  - name: Conversation
  - name: RAG
  - name: Audit
  - name: Integration:Meta
  - name: Delivery
  - name: Subscription
  - name: Webhooks

paths:
  /health/live:
    get:
      tags: [Health]
      summary: Liveness probe
      security: []
      parameters:
        - $ref: '#/components/parameters/RateLimitInfo'
      responses:
        '200':
          description: Service is alive
        '503':
          description: Service unavailable
  /health/ready:
    get:
      tags: [Health]
      summary: Readiness probe with DB check
      security: []
      parameters:
        - $ref: '#/components/parameters/RateLimitInfo'
      responses:
        '200':
          description: Ready
        '503':
          description: Not ready
  /health/health:
    get:
      tags: [Health]
      summary: Full health details
      security: []
      responses:
        '200':
          description: Health info
        '503':
          description: Degraded

  /auth/signup:
    post:
      tags: [Auth]
      summary: User registration
      security: []
      requestBody:
        required: true
        content:
          application/json:
            example:
              email: user@example.com
              password: StrongPassw0rd!
              name: Jane Doe
            schema:
              type: object
      responses:
        '201': { description: User created }
        '400': { $ref: '#/components/responses/Error' }
  /auth/signin:
    post:
      tags: [Auth]
      summary: User login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            example:
              email: user@example.com
              password: StrongPassw0rd!
            schema:
              type: object
      responses:
        '200':
          description: JWT tokens
          content:
            application/json:
              example:
                accessToken: eyJhbGciOi...
                refreshToken: eyJhbGciOi...
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            example:
              refreshToken: eyJhbGciOi...
            schema:
              type: object
      responses:
        '200': { description: New access token }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /shop/list:
    parameters:
      - $ref: '#/components/parameters/XShopId'
      - $ref: '#/components/parameters/RateLimitInfo'
    get:
      tags: [Shop]
      summary: List shops for current user
      responses:
        '200':
          description: List of shops
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Shop' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /shop/me:
    parameters:
      - $ref: '#/components/parameters/XShopId'
      - $ref: '#/components/parameters/RateLimitInfo'
    get:
      tags: [Shop]
      summary: Get current shop context
      responses:
        '200': { description: Shop }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /shop/create:
    parameters:
      - $ref: '#/components/parameters/XShopId'
      - $ref: '#/components/parameters/RateLimitInfo'
    post:
      tags: [Shop]
      summary: Create shop
      requestBody:
        required: true
        content:
          application/json:
            example:
              name: Demo Shop
              address: 123 Main St
              phone: "+1-555-0100"
            schema:
              type: object
      responses:
        '201': { description: Shop created }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /shop/update:
    parameters:
      - $ref: '#/components/parameters/XShopId'
      - $ref: '#/components/parameters/RateLimitInfo'
    post:
      tags: [Shop]
      summary: Update shop
      requestBody:
        required: true
        content:
          application/json:
            example:
              shop_id: shop_123
              name: Demo Shop v2
            schema:
              type: object
      responses:
        '200': { description: Updated }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /shop/delete:
    parameters:
      - $ref: '#/components/parameters/XShopId'
      - $ref: '#/components/parameters/RateLimitInfo'
    post:
      tags: [Shop]
      summary: Delete shop
      requestBody:
        required: true
        content:
          application/json:
            example:
              shop_id: shop_123
            schema:
              type: object
      responses:
        '200': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /shop/add-user:
    parameters:
      - $ref: '#/components/parameters/XShopId'
      - $ref: '#/components/parameters/RateLimitInfo'
    post:
      tags: [Shop]
      summary: Add user to shop
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            example:
              shop_id: shop_123
              user_email: invitee@example.com
              role: manager
            schema:
              type: object
      responses:
        '200': { description: Added }
  /shop/remove-user:
    parameters:
      - $ref: '#/components/parameters/XShopId'
      - $ref: '#/components/parameters/RateLimitInfo'
    post:
      tags: [Shop]
      summary: Remove user from shop
