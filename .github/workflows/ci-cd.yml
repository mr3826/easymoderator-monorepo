name: CI / CD

# ──────────────────────────────────────────────────────────────────────────────
# Required GitHub secrets (Settings → Secrets → Actions):
#   DEPLOY_HOST          — Droplet IP or hostname (update after each droplet swap)
#   DO_SSH_PRIVATE_KEY   — SSH private key with root access to the droplet
#   DO_SSH_KNOWN_HOSTS   — pinned SSH host keys for DEPLOY_HOST
# Public origin settings are repository variables, not secrets:
#   VITE_API_BASE_URL    — https://api.easymod.tech
#   VITE_APP_URL         — https://app.easymod.tech
#   VITE_MARKETING_URL   — https://easymod.tech
#   VITE_META_APP_ID     — Meta App ID (public, used for OAuth popup)
#   VITE_SENTRY_DSN      — Sentry DSN (optional)
#   TELEGRAM_BOT_TOKEN   — optional; required only when TELEGRAM_ENABLED=true
#   TELEGRAM_BOT_USERNAME — optional; bot username without @
#   TELEGRAM_WEBHOOK_SECRET — optional; required only when Telegram is enabled
#   API_URL / BASE_URL   — https://api.easymod.tech (API + public uploads)
#   BODY_SIZE_LIMIT      — 35mb (Messenger attachment upload payloads)
#   PRODUCT_IMAGE_QUOTA_BYTES — 104857600 (per-shop product-image cap)
#
# The droplet must have:
#   /opt/easymod/docker-compose.prod.yml  (committed to repo, synced by deploy)
#   /opt/easymod/Caddyfile                (committed to repo, synced by deploy)
#   /opt/easymod/.env.prod                (manually placed, never committed)
# ──────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  # Run the test gate on PRs into main so breakage is caught BEFORE it lands.
  # build/deploy are guarded to never run on pull_request (see those jobs).
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 'Which service to deploy'
        required: false
        default: 'all'
        type: choice
        options: [all, backend, frontend, probe]
      wipe_db_first:
        description: 'DESTRUCTIVE — wipe easymod DB before deploy. Type WIPE to confirm (anything else = no-op).'
        required: false
        default: ''
        type: string
      seed_admin:
        description: 'Seed/update the SEED_ADMIN_* production review account. Type SEED to confirm.'
        required: false
        default: ''
        type: string

concurrency:
  group: ci-cd-${{ github.ref }}
  # A cancelled main run can contain cumulative changes that a later one-commit
  # path diff cannot see. Serialize production deploys so no image is skipped.
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  # Required by the dorny/paths-filter step in the `changes` job: on
  # pull_request events it reads the PR's changed files via the GitHub API.
  # Without this the `changes` job fails and the whole PR gate skips.
  pull-requests: read

env:
  GHCR_BACKEND: ghcr.io/${{ github.repository_owner }}/easymoderator-backend
  GHCR_FRONTEND: ghcr.io/${{ github.repository_owner }}/easymoderator-frontend

jobs:
  # ── 1. Detect which services changed ────────────────────────────────────────
  changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend == 'true' }}
      frontend: ${{ steps.filter.outputs.frontend == 'true' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Detect changed service paths locally
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET: ${{ github.event.inputs.target || '' }}
          BEFORE_SHA: ${{ github.event.before || '' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          backend=false
          frontend=false

          if [[ "$EVENT_NAME" == "push" ]]; then
            backend=true
            frontend=true
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$TARGET" == "all" || "$TARGET" == "backend" ]] && backend=true
            [[ "$TARGET" == "all" || "$TARGET" == "frontend" ]] && frontend=true
          else
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              changed_paths="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
            elif [[ -n "$BEFORE_SHA" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
              changed_paths="$(git diff --name-only "$BEFORE_SHA" "$HEAD_SHA")"
            else
              changed_paths="$(git diff-tree --no-commit-id --name-only -r "$HEAD_SHA")"
            fi

            while IFS= read -r path; do
              case "$path" in
                EasyMod-backend/*|docker-compose.prod.yml|docker-compose.test.yml|scripts/run-backend-integration.js|package.json|package-lock.json|.github/workflows/*)
                  backend=true
                  ;;
              esac
              case "$path" in
                EasyMod-frontend/*|Caddyfile|package.json|package-lock.json|.github/workflows/*)
                  frontend=true
                  ;;
              esac
            done <<< "$changed_paths"
          fi

          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"

  # ── 2. Test gate — must pass before any image is built or deployed ──────────
  # This is the gate that makes the silent-failure bug class (job-not-enqueued /
  # sent:false) impossible to ship "green": backend unit tests run here, and the
  # build/deploy jobs below are blocked unless this job succeeds.
  test:
    name: Test & Build Gate
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'

      # Backend unit tests (Jest). The curated suite in jest.config.js is green;
      # a failing unit test fails this job and blocks the deploy.
      - name: Backend — install & test
        if: needs.changes.outputs.backend == 'true'
        working-directory: ./EasyMod-backend
        run: |
          npm ci
          npm run test:security
          npm test

      # Proof/calibration helpers live at the monorepo root because they are
      # copied into isolated proof containers and must not bootstrap the app.
      - name: Qdrant proof and semantic calibration helper tests
        if: needs.changes.outputs.backend == 'true'
        working-directory: ./EasyMod-backend
        run: >-
          npx jest --config jest.config.js --rootDir .. --roots scripts
          --runTestsByPath ../scripts/__tests__/qdrant-migration-proof.test.js
          ../scripts/__tests__/semantic-calibration.test.js
          ../scripts/__tests__/semantic-acceptance-contract.test.js --runInBand

      # Frontend production build — TypeScript/import errors fail here, before a
      # broken bundle can be shipped.
      - name: Frontend — install & build
        if: needs.changes.outputs.frontend == 'true'
        working-directory: ./EasyMod-frontend
        run: |
          npm ci
          npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://api.easymod.tech' }}
          VITE_APP_URL: ${{ vars.VITE_APP_URL || 'https://app.easymod.tech' }}
          VITE_MARKETING_URL: ${{ vars.VITE_MARKETING_URL || 'https://easymod.tech' }}
          VITE_META_APP_ID: ${{ secrets.VITE_META_APP_ID }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_ENV: production

      # Frontend unit tests (Vitest) are a blocking launch gate.
      - name: Frontend — unit tests
        if: needs.changes.outputs.frontend == 'true'
        working-directory: ./EasyMod-frontend
        run: npm run test:unit

  # ── 2b. Meta-shaped E2E — the AI trust boundary, asserted at the send ───────
  # Enters through the REAL signed Meta webhook route and runs the real queue,
  # worker, retrieval, grounding gate and Meta provider; only the Graph API
  # transport and the LLM transport are captured (tests/meta-e2e/transport.js).
  # No Meta credential is involved: the suite signs its payloads with an
  # isolated test App Secret. The REAL-Meta smoke test is deliberately NOT here
  # — it needs a human to send the first Messenger message and access to the
  # deployed stores. See docs/testing/META_E2E_TEST_SETUP.md §11.
  meta-e2e:
    name: Meta-shaped E2E (AI trust boundary)
    runs-on: ubuntu-latest
    needs: [changes]
    # Same condition as `test` so the deploy graph stays simple; the heavy steps
    # below are skipped when only the frontend changed.
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: easymod_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: needs.changes.outputs.backend == 'true'
        with:
          node-version: '20'

      - name: Backend — install
        if: needs.changes.outputs.backend == 'true'
        working-directory: ./EasyMod-backend
        run: npm ci

      - name: Meta-shaped E2E suite
        if: needs.changes.outputs.backend == 'true'
        working-directory: ./EasyMod-backend
        env:
          DATABASE_URL: postgres://e2e:e2e@127.0.0.1:5432/easymod_e2e
          REDIS_URL: redis://127.0.0.1:6379
        run: npm run test:integration

  # ── 2c. Non-deploy deployment contract dry run ─────────────────────────────
  # This job validates Compose interpolation plus the repository's production
  # secret-backed renderer. It never opens SSH or changes the droplet.
  deployment-config:
    name: Deployment configuration dry run
    runs-on: ubuntu-latest
    needs: [changes, test, meta-e2e]
    if: |
      always() &&
      (
        (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'probe') ||
        (
          needs.changes.result == 'success' &&
          needs.test.result == 'success' &&
          needs.meta-e2e.result == 'success' &&
          (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true')
        )
      )
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'

      - name: Validate renderer syntax and production contract tests
        working-directory: ./EasyMod-backend
        run: |
          npm ci
          node --check scripts/render-production-env.js
          node --check scripts/validate-rollback-contract.js
          npx jest scripts/__tests__/render-production-env.test.js --runInBand
          node scripts/validate-rollback-contract.js

      - name: Validate production Compose without SSH or production values
        env:
          GHCR_IMAGE_BACKEND: ghcr.io/mr3826/easymoderator-backend:dry-run
          GHCR_IMAGE_FRONTEND: ghcr.io/mr3826/easymoderator-frontend:dry-run
        run: |
          mkdir -p _tmp
          cat > _tmp/.env.prod <<'EOF'
          DB_USER=e2e
          DB_PASSWORD=synthetic-dry-run-password
          DB_NAME=easymod_dry_run
          EOF
          cp _tmp/.env.prod .env.prod
          trap 'rm -f .env.prod' EXIT
          docker compose --env-file _tmp/.env.prod -f docker-compose.prod.yml config --quiet

      - name: Validate production secret and deployment contracts without SSH
        # Never expose repository secrets to forked pull requests; the
        # synthetic contract step above remains the PR-safe validation.
        if: github.event_name != 'pull_request'
        env:
          DB_USER: ${{ secrets.POSTGRES_USER }}
          DB_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DB_NAME: ${{ secrets.POSTGRES_DB }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          JWT_ACCESS_EXPIRES_IN: ${{ secrets.JWT_ACCESS_EXPIRES_IN }}
          JWT_REFRESH_EXPIRES_IN: ${{ secrets.JWT_REFRESH_EXPIRES_IN }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          CSRF_SECRET: ${{ secrets.CSRF_SECRET }}
          PAYMENT_ENCRYPTION_KEY: ${{ secrets.PAYMENT_ENCRYPTION_KEY }}
          DELIVERY_ENCRYPTION_KEY: ${{ secrets.DELIVERY_ENCRYPTION_KEY }}
          CHANNEL_ENCRYPTION_KEY: ${{ secrets.CHANNEL_ENCRYPTION_KEY }}
          PAYMENT_CALLBACK_HMAC_SECRET: ${{ secrets.PAYMENT_CALLBACK_HMAC_SECRET }}
          MARKETING_URL: ${{ vars.MARKETING_URL || 'https://easymod.tech' }}
          APP_URL: ${{ vars.APP_URL || 'https://app.easymod.tech' }}
          API_URL: ${{ vars.API_URL || 'https://api.easymod.tech' }}
          PUBLIC_ASSET_URL: ${{ vars.PUBLIC_ASSET_URL || 'https://api.easymod.tech' }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS || 'https://app.easymod.tech' }}
          FRONTEND_URL: ${{ vars.APP_URL || 'https://app.easymod.tech' }}
          BASE_URL: ${{ vars.API_URL || 'https://api.easymod.tech' }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_ASSET_URL || 'https://api.easymod.tech' }}
          LEGACY_COOKIE_DOMAIN: ${{ vars.LEGACY_COOKIE_DOMAIN || 'easymod.tech' }}
          META_OAUTH_REDIRECT_URI: ${{ vars.META_OAUTH_REDIRECT_URI || 'https://app.easymod.tech/channels/oauth-callback' }}
          META_APP_ID: ${{ secrets.VITE_META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_WEBHOOK_VERIFY_TOKEN: ${{ secrets.META_WEBHOOK_VERIFY_TOKEN }}
          BKASH_ENABLED: ${{ vars.BKASH_ENABLED || 'false' }}
          BKASH_BASE_URL: ${{ secrets.BKASH_BASE_URL }}
          BKASH_USERNAME: ${{ secrets.BKASH_USERNAME }}
          BKASH_PASSWORD: ${{ secrets.BKASH_PASSWORD }}
          BKASH_APP_KEY: ${{ secrets.BKASH_APP_KEY }}
          BKASH_APP_SECRET: ${{ secrets.BKASH_APP_SECRET }}
          BKASH_WEBHOOK_SECRET: ${{ secrets.BKASH_WEBHOOK_SECRET }}
          BKASH_SANDBOX: "false"
          TELEGRAM_ENABLED: ${{ vars.TELEGRAM_ENABLED || 'false' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_USERNAME: ${{ secrets.TELEGRAM_BOT_USERNAME }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
          GEMINI_EMBEDDING_MODEL: ${{ secrets.GEMINI_EMBEDDING_MODEL }}
          EMBEDDING_PROVIDER: ${{ secrets.EMBEDDING_PROVIDER }}
          EMBEDDING_MODEL: ${{ secrets.EMBEDDING_MODEL }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          QDRANT_COLLECTION: ${{ secrets.QDRANT_COLLECTION }}
          QDRANT_VECTOR_SIZE: ${{ vars.QDRANT_VECTOR_SIZE || '384' }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN || secrets.VITE_SENTRY_DSN }}
          SLACK_ALERT_WEBHOOK_URL: ${{ secrets.SLACK_ALERT_WEBHOOK_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
          ALLOW_SELF_SIGNED_TLS: ${{ secrets.ALLOW_SELF_SIGNED_TLS }}
          BODY_SIZE_LIMIT: ${{ secrets.BODY_SIZE_LIMIT || '35mb' }}
          PRODUCT_IMAGE_QUOTA_BYTES: ${{ vars.PRODUCT_IMAGE_QUOTA_BYTES || '104857600' }}
          MEDIA_FETCH_ALLOWED_HOSTS: ${{ secrets.MEDIA_FETCH_ALLOWED_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DO_SSH_PRIVATE_KEY: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          DO_SSH_KNOWN_HOSTS: ${{ secrets.DO_SSH_KNOWN_HOSTS }}
          PROBE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'probe' }}
        run: |
          set -euo pipefail
          mkdir -p _tmp
          trap 'rm -f _tmp/.env.prod.real' EXIT
          test -n "$DEPLOY_HOST"
          test -n "$DO_SSH_PRIVATE_KEY"
          test -n "$DO_SSH_KNOWN_HOSTS"
          node EasyMod-backend/scripts/render-production-env.js _tmp/.env.prod.real
          test -s _tmp/.env.prod.real
          grep -q '^CSRF_SECRET=' _tmp/.env.prod.real
          grep -q '^PAYMENT_CALLBACK_HMAC_SECRET=' _tmp/.env.prod.real
          grep -q '^QDRANT_URL=' _tmp/.env.prod.real
          grep -q '^QDRANT_COLLECTION=' _tmp/.env.prod.real
          grep -q '^QDRANT_API_KEY=' _tmp/.env.prod.real
          grep -q '^SLACK_ALERT_WEBHOOK_URL=' _tmp/.env.prod.real
          echo 'secret-backed-render=PASS'
          if [ "$PROBE_MODE" = "true" ]; then
            mkdir -p ~/.ssh
            printf '%s\n' "$DO_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
            printf '%s\n' "$DO_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
            ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null

            probe_env_path="/opt/easymod/.env.prod.candidate.${GITHUB_RUN_ID}"
            probe_script_path="/opt/easymod/production-db-auth-probe.${GITHUB_RUN_ID}.js"
            cleanup_probe() {
              ssh -i ~/.ssh/deploy_key root@"$DEPLOY_HOST" \
                "rm -f -- '$probe_env_path' '$probe_script_path'" >/dev/null 2>&1 || true
              rm -f _tmp/.env.prod.real
            }
            trap cleanup_probe EXIT

            scp -i ~/.ssh/deploy_key _tmp/.env.prod.real \
              root@"$DEPLOY_HOST":"$probe_env_path"
            scp -i ~/.ssh/deploy_key EasyMod-backend/scripts/production-db-auth-probe.js \
              root@"$DEPLOY_HOST":"$probe_script_path"
            ssh -i ~/.ssh/deploy_key root@"$DEPLOY_HOST" \
              'set -e
               echo PRODUCTION_POSTGRES_ENV
               docker exec easymod-postgres-1 printenv | awk -F= '\''$1=="POSTGRES_DB" || $1=="POSTGRES_USER" {print $1"="$2}'\''
               echo PRODUCTION_POSTGRES_DATABASES
               if ! docker exec easymod-postgres-1 psql -U postgres -Atc "\l" 2>/dev/null; then
                 docker exec easymod-postgres-1 sh -c "PGPASSWORD=\"\$POSTGRES_PASSWORD\" psql -U \"\$POSTGRES_USER\" -d \"\$POSTGRES_DB\" -Atc \"\\l\""
               fi'
            ssh -i ~/.ssh/deploy_key root@"$DEPLOY_HOST" \
              "set -e; chmod 600 '$probe_env_path'; chmod 644 '$probe_script_path'; image_id=\$(docker inspect -f '{{.Image}}' easymod-backend-1); test -n \"\$image_id\"; docker run --rm --network easymod_internal --env-file '$probe_env_path' -e EXPECTED_DB_NAME=easymod_prod -v '$probe_script_path:/app/production-db-auth-probe.js:ro' \"\$image_id\" node /app/production-db-auth-probe.js"
          fi

  # ── 2d. Non-publishing Docker build validation ────────────────────────────
  # Build the exact current source on every branch, including pull requests,
  # without logging in to GHCR or pushing an image. The production build job
  # remains main-only, but a feature branch must still prove its Dockerfiles
  # and build contexts before it can be considered cutover-ready.
  docker-build-validation:
    name: Docker build validation (no push)
    runs-on: ubuntu-latest
    needs: [changes, test, meta-e2e, deployment-config]
    # Feature branches and pull requests get a non-publishing Docker build.
    # The main-branch production path builds and pushes each image exactly once
    # in the `build` job, so validation cannot create a second candidate build.
    if: |
      github.ref != 'refs/heads/main' &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true')
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build backend image without publishing
        if: needs.changes.outputs.backend == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./EasyMod-backend
          file: ./EasyMod-backend/Dockerfile
          push: false
          load: true
          tags: easymod-backend:validation-${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ github.run_id }}

      - name: Build frontend image without publishing
        if: needs.changes.outputs.frontend == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./EasyMod-frontend
          file: ./EasyMod-frontend/Dockerfile
          push: false
          load: true
          tags: easymod-frontend:validation-${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || 'https://api.easymod.tech' }}
            VITE_APP_URL=${{ vars.VITE_APP_URL || 'https://app.easymod.tech' }}
            VITE_MARKETING_URL=${{ vars.VITE_MARKETING_URL || 'https://easymod.tech' }}
            VITE_META_APP_ID=${{ secrets.VITE_META_APP_ID }}
            VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}
            VITE_ENV=production
            VITE_BKASH_ENABLED=${{ vars.BKASH_ENABLED || 'false' }}

  # ── 3. Build & push Docker images ──────────────────────────────────────────
  build:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [changes, test, meta-e2e, deployment-config]
    if: |
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true')
    outputs:
      backend_tag: ${{ steps.meta.outputs.backend_tag }}
      frontend_tag: ${{ steps.meta.outputs.frontend_tag }}
      backend_digest: ${{ steps.backend_image.outputs.digest }}
      frontend_digest: ${{ steps.frontend_image.outputs.digest }}
      build_time: ${{ steps.meta.outputs.build_time }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: meta
        run: |
          SHA="${{ github.sha }}"
          # BUILD_TIME used to come from the repository's last-metadata-change
          # stamp rather than this build. It ran *behind* the commit it labelled
          # (bc9c8ca reported builtAt 03:53:04Z for code authored 04:09:23Z) and
          # two pushes could share one value, collapsing two releases onto a
          # single Sentry `dist` marker. Stamp the build itself.
          # A guard test pins this line — see workflow-deploy-guard.test.js.
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT
          if [ "${{ needs.changes.outputs.backend }}" = "true" ]; then
            echo "backend_tag=${{ env.GHCR_BACKEND }}:${SHA}" >> $GITHUB_OUTPUT
          else
            echo "backend_tag=" >> $GITHUB_OUTPUT
          fi
          if [ "${{ needs.changes.outputs.frontend }}" = "true" ]; then
            echo "frontend_tag=${{ env.GHCR_FRONTEND }}:${SHA}" >> $GITHUB_OUTPUT
          else
            echo "frontend_tag=" >> $GITHUB_OUTPUT
          fi

      - name: Build & push backend image
        id: backend_image
        if: needs.changes.outputs.backend == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./EasyMod-backend
          file: ./EasyMod-backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.backend_tag }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
          cache-from: type=registry,ref=${{ env.GHCR_BACKEND }}:buildcache
          cache-to: type=registry,ref=${{ env.GHCR_BACKEND }}:buildcache,mode=max

      - name: Build & push frontend image
        id: frontend_image
        if: needs.changes.outputs.frontend == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./EasyMod-frontend
          file: ./EasyMod-frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.frontend_tag }}
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || 'https://api.easymod.tech' }}
            VITE_APP_URL=${{ vars.VITE_APP_URL || 'https://app.easymod.tech' }}
            VITE_MARKETING_URL=${{ vars.VITE_MARKETING_URL || 'https://easymod.tech' }}
            VITE_META_APP_ID=${{ secrets.VITE_META_APP_ID }}
            VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}
            VITE_ENV=production
            VITE_BKASH_ENABLED=${{ vars.BKASH_ENABLED || 'false' }}
          cache-from: type=registry,ref=${{ env.GHCR_FRONTEND }}:buildcache
          cache-to: type=registry,ref=${{ env.GHCR_FRONTEND }}:buildcache,mode=max

  # ── 4. Deploy to DO droplet ──────────────────────────────────────────────────
  deploy:
    name: Deploy to DO Droplet
    runs-on: ubuntu-latest
    needs: [changes, build]
    # A new monorepo must not switch the live droplet merely because its
    # default branch was populated. Enable this repository variable only after
    # deploy secrets, the production environment, and a rollback rehearsal are
    # explicitly verified.
    if: github.ref == 'refs/heads/main' && vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    environment: production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Render and validate .env.prod without shell interpolation
        run: node EasyMod-backend/scripts/render-production-env.js _tmp/.env.prod
        env:
          DB_USER: ${{ secrets.POSTGRES_USER }}
          DB_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DB_NAME: ${{ secrets.POSTGRES_DB }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          JWT_ACCESS_EXPIRES_IN: ${{ secrets.JWT_ACCESS_EXPIRES_IN }}
          JWT_REFRESH_EXPIRES_IN: ${{ secrets.JWT_REFRESH_EXPIRES_IN }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          CSRF_SECRET: ${{ secrets.CSRF_SECRET }}
          PAYMENT_ENCRYPTION_KEY: ${{ secrets.PAYMENT_ENCRYPTION_KEY }}
          DELIVERY_ENCRYPTION_KEY: ${{ secrets.DELIVERY_ENCRYPTION_KEY }}
          CHANNEL_ENCRYPTION_KEY: ${{ secrets.CHANNEL_ENCRYPTION_KEY }}
          PAYMENT_CALLBACK_HMAC_SECRET: ${{ secrets.PAYMENT_CALLBACK_HMAC_SECRET }}
          MARKETING_URL: ${{ vars.MARKETING_URL || 'https://easymod.tech' }}
          APP_URL: ${{ vars.APP_URL || 'https://app.easymod.tech' }}
          API_URL: ${{ vars.API_URL || 'https://api.easymod.tech' }}
          PUBLIC_ASSET_URL: ${{ vars.PUBLIC_ASSET_URL || 'https://api.easymod.tech' }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS || 'https://app.easymod.tech' }}
          FRONTEND_URL: ${{ vars.APP_URL || 'https://app.easymod.tech' }}
          BASE_URL: ${{ vars.API_URL || 'https://api.easymod.tech' }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_ASSET_URL || 'https://api.easymod.tech' }}
          # Deliberately unset by default: host-only API cookies minimize the
          # blast radius of an XSS on another easymod.tech subdomain.
          COOKIE_DOMAIN: ${{ vars.COOKIE_DOMAIN }}
          LEGACY_COOKIE_DOMAIN: ${{ vars.LEGACY_COOKIE_DOMAIN || 'easymod.tech' }}
          META_OAUTH_REDIRECT_URI: ${{ vars.META_OAUTH_REDIRECT_URI || 'https://app.easymod.tech/channels/oauth-callback' }}
          META_APP_ID: ${{ secrets.VITE_META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_WEBHOOK_VERIFY_TOKEN: ${{ secrets.META_WEBHOOK_VERIFY_TOKEN }}
          # bKash is a LIVE-money gateway. It stays OFF for the controlled pilot
          # (finding F-14/§6). Flip the `BKASH_ENABLED` Actions *variable* to
          # "true" only once every BKASH_* secret is set AND a real-money test
          # has been signed off. While the variable is unset the render skips
          # every bKash credential, so a partial config cannot deploy live.
          BKASH_ENABLED: ${{ vars.BKASH_ENABLED || 'false' }}
          BKASH_BASE_URL: ${{ secrets.BKASH_BASE_URL }}
          BKASH_USERNAME: ${{ secrets.BKASH_USERNAME }}
          BKASH_PASSWORD: ${{ secrets.BKASH_PASSWORD }}
          BKASH_APP_KEY: ${{ secrets.BKASH_APP_KEY }}
          BKASH_APP_SECRET: ${{ secrets.BKASH_APP_SECRET }}
          BKASH_WEBHOOK_SECRET: ${{ secrets.BKASH_WEBHOOK_SECRET }}
          BKASH_SANDBOX: "false"
          # Facebook/Messenger is the cutover scope. Telegram is opt-in via a
          # repository variable and is disabled when the variable is absent.
          TELEGRAM_ENABLED: ${{ vars.TELEGRAM_ENABLED || 'false' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_USERNAME: ${{ secrets.TELEGRAM_BOT_USERNAME }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
          GEMINI_EMBEDDING_MODEL: ${{ secrets.GEMINI_EMBEDDING_MODEL }}
          EMBEDDING_PROVIDER: ${{ secrets.EMBEDDING_PROVIDER }}
          EMBEDDING_MODEL: ${{ secrets.EMBEDDING_MODEL }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          QDRANT_COLLECTION: ${{ secrets.QDRANT_COLLECTION }}
          QDRANT_VECTOR_SIZE: ${{ vars.QDRANT_VECTOR_SIZE || '384' }}
          # Backend alerting (finding F-06). The backend reads SENTRY_DSN, a
          # separate name from the frontend's VITE_SENTRY_DSN. Fall back to the
          # frontend DSN so ops alerts have a sink even before a dedicated
          # backend project exists — both currently share one Sentry project.
          SENTRY_DSN: ${{ secrets.SENTRY_DSN || secrets.VITE_SENTRY_DSN }}
          SLACK_ALERT_WEBHOOK_URL: ${{ secrets.SLACK_ALERT_WEBHOOK_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
          ALLOW_SELF_SIGNED_TLS: ${{ secrets.ALLOW_SELF_SIGNED_TLS }}
          BODY_SIZE_LIMIT: ${{ secrets.BODY_SIZE_LIMIT || '35mb' }}
          PRODUCT_IMAGE_QUOTA_BYTES: ${{ vars.PRODUCT_IMAGE_QUOTA_BYTES || '104857600' }}
          MEDIA_FETCH_ALLOWED_HOSTS: ${{ secrets.MEDIA_FETCH_ALLOWED_HOSTS }}

      - name: Independent DB authentication probe against candidate environment
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DO_SSH_PRIVATE_KEY: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          DO_SSH_KNOWN_HOSTS: ${{ secrets.DO_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DO_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DO_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null
          probe_env_path="/opt/easymod/.env.prod.candidate.${GITHUB_RUN_ID}"
          probe_script_path="/opt/easymod/production-db-auth-probe.${GITHUB_RUN_ID}.js"
          cleanup_probe() {
            ssh -i ~/.ssh/deploy_key root@"$DEPLOY_HOST" \
              "rm -f -- '$probe_env_path' '$probe_script_path'" >/dev/null 2>&1 || true
          }
          trap cleanup_probe EXIT
          scp -i ~/.ssh/deploy_key _tmp/.env.prod \
            root@"$DEPLOY_HOST":"$probe_env_path"
          scp -i ~/.ssh/deploy_key EasyMod-backend/scripts/production-db-auth-probe.js \
            root@"$DEPLOY_HOST":"$probe_script_path"
          ssh -i ~/.ssh/deploy_key root@"$DEPLOY_HOST" \
            "set -e; chmod 600 '$probe_env_path'; chmod 644 '$probe_script_path'; image_id=\$(docker inspect -f '{{.Image}}' easymod-backend-1); test -n \"\$image_id\"; docker run --rm --network easymod_internal --env-file '$probe_env_path' -e EXPECTED_DB_NAME=easymod_prod -v '$probe_script_path:/app/production-db-auth-probe.js:ro' \"\$image_id\" node /app/production-db-auth-probe.js"

      - name: Copy .env.prod and deploy config to droplet
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DO_SSH_PRIVATE_KEY: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          DO_SSH_KNOWN_HOSTS: ${{ secrets.DO_SSH_KNOWN_HOSTS }}
          ROLLBACK_STATE_DIR: /opt/easymod/.cutover-rollback/${{ github.run_id }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DO_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DO_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null
          ssh -i ~/.ssh/deploy_key root@"$DEPLOY_HOST" "set -e
            mkdir -p /opt/easymod '$ROLLBACK_STATE_DIR'
            chmod 700 /opt/easymod '$ROLLBACK_STATE_DIR'
            test -f /opt/easymod/.env.prod
            test -f /opt/easymod/docker-compose.prod.yml
            test -f /opt/easymod/Caddyfile
            cp -p /opt/easymod/.env.prod '$ROLLBACK_STATE_DIR/.env.prod'
            cp -p /opt/easymod/docker-compose.prod.yml '$ROLLBACK_STATE_DIR/docker-compose.prod.yml'
            cp -p /opt/easymod/Caddyfile '$ROLLBACK_STATE_DIR/Caddyfile'
            sha256sum '$ROLLBACK_STATE_DIR/.env.prod' '$ROLLBACK_STATE_DIR/docker-compose.prod.yml' '$ROLLBACK_STATE_DIR/Caddyfile' > '$ROLLBACK_STATE_DIR/manifest.sha256'
            chmod 600 '$ROLLBACK_STATE_DIR/.env.prod' '$ROLLBACK_STATE_DIR/manifest.sha256'"
          scp -i ~/.ssh/deploy_key _tmp/.env.prod root@"$DEPLOY_HOST":/opt/easymod/.env.prod
          # Sync compose + Caddy config straight from the runner's checkout. The
          # droplet has no GitHub auth, so its `git fetch` (in the deploy script)
          # silently failed and left STALE config on disk — which is why the F-05
          # `/health* -> backend` routing never reached production. scp makes the
          # runner the single source of truth for these two files.
          scp -i ~/.ssh/deploy_key docker-compose.prod.yml root@"$DEPLOY_HOST":/opt/easymod/docker-compose.prod.yml
          scp -i ~/.ssh/deploy_key Caddyfile root@"$DEPLOY_HOST":/opt/easymod/Caddyfile
          ssh -i ~/.ssh/deploy_key root@"$DEPLOY_HOST" 'chmod 600 /opt/easymod/.env.prod && wc -l /opt/easymod/.env.prod && sha256sum /opt/easymod/Caddyfile /opt/easymod/docker-compose.prod.yml'

      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          timeout: 600s
          envs: GHCR_BACKEND,GHCR_FRONTEND,BACKEND_TAG,FRONTEND_TAG,BACKEND_DIGEST,FRONTEND_DIGEST,DEPLOYED_COMMIT,WORKFLOW_RUN_ID,DEPLOYED_AT,GH_ACTOR,GH_TOKEN,WIPE_DB,SEED_ADMIN,ROLLBACK_STATE_DIR
          script: |
            set -e

            # Capture the running content-addressed images before any
            # replacement. A no-change service keeps its current digest; a
            # changed service consumes the digest emitted by the build job.
            resolve_container_digest() {
              local container="$1"
              local image_ref
              local digest
              image_ref=$(docker inspect -f '{{.Config.Image}}' "$container" 2>/dev/null || true)
              digest=$(docker image inspect -f '{{index .RepoDigests 0}}' "$image_ref" 2>/dev/null || true)
              case "$digest" in
                *@sha256:*) printf '%s' "$digest" ;;
                *) return 1 ;;
              esac
            }

            previous_backend_image=$(resolve_container_digest easymod-backend-1 2>/dev/null || true)
            previous_frontend_image=$(resolve_container_digest easymod-frontend-1 2>/dev/null || true)

            if [ -z "$previous_backend_image" ] || [ -z "$previous_frontend_image" ]; then
              echo "ERROR: running services are not backed by content-addressed images; manual digest pinning is required before cutover"
              exit 1
            fi

            assert_immutable_ref() {
              if printf '%s' "$1" | grep -Eq '@sha256:[0-9a-fA-F]{64}$'; then
                return 0
              fi
              echo "ERROR: production image reference is not digest-pinned: $1" >&2
              return 1
            }

            candidate_backend_image="$previous_backend_image"
            candidate_frontend_image="$previous_frontend_image"
            if [ -n "$BACKEND_DIGEST" ]; then
              candidate_backend_image="${GHCR_BACKEND}@${BACKEND_DIGEST}"
            fi
            if [ -n "$FRONTEND_DIGEST" ]; then
              candidate_frontend_image="${GHCR_FRONTEND}@${FRONTEND_DIGEST}"
            fi
            assert_immutable_ref "$candidate_backend_image"
            assert_immutable_ref "$candidate_frontend_image"
            export GHCR_IMAGE_BACKEND="$candidate_backend_image"
            export GHCR_IMAGE_FRONTEND="$candidate_frontend_image"

            cd /opt/easymod

            # The snapshot is created before this job overwrites any production
            # environment or routing/configuration file. Missing state fails
            # closed: image-only rollback is not a safe production rollback.
            if [ -z "${ROLLBACK_STATE_DIR:-}" ] \
              || [ ! -f "$ROLLBACK_STATE_DIR/.env.prod" ] \
              || [ ! -f "$ROLLBACK_STATE_DIR/docker-compose.prod.yml" ] \
              || [ ! -f "$ROLLBACK_STATE_DIR/Caddyfile" ] \
              || [ ! -f "$ROLLBACK_STATE_DIR/manifest.sha256" ]; then
              echo "ERROR: rollback environment/configuration snapshot is missing"
              exit 1
            fi

            # Validate every image in the interpolated production stack before
            # any pull, prune, restart, or destructive WIPE path. This is the
            # final fail-closed guard against a mutable reference entering the
            # deployed Compose configuration.
            production_images=$(docker compose --env-file .env.prod -f docker-compose.prod.yml config --images)
            while IFS= read -r production_image; do
              [ -z "$production_image" ] && continue
              assert_immutable_ref "$production_image"
            done <<< "$production_images"

            # docker-compose.prod.yml and Caddyfile are synced from the runner via
            # scp in the previous step (the droplet has no GitHub auth), so no git
            # pull is attempted here — that call always failed and left stale config.

            # ── Reclaim disk BEFORE pulling images ───────────────────────────────
            # The droplet ran out of space (accumulated deploy images + local DB
            # backups). That both failed `docker pull` and blocked Redis
            # persistence (stop-writes-on-bgsave-error -> API 500s). Free space
            # first so the pull and the running services can recover.
            echo "==> Disk usage before reclaim:"
            df -h / || true
            docker image prune -af || true
            docker builder prune -af || true
            docker container prune -f || true
            # Keep only the 3 newest local backups; the durable copy is off-site.
            if [ -d /opt/easymod/backups ]; then
              ls -1t /opt/easymod/backups/* 2>/dev/null | tail -n +4 | xargs -r rm -f || true
            fi
            echo "==> Disk usage after reclaim:"
            df -h / || true
            # A disk-full crash can corrupt Redis's append-only file, so the
            # container crash-loops and never passes its `redis-cli ping`
            # healthcheck. Because backend/worker/db:sync all wait on
            # `redis: condition: service_healthy`, that silently aborts the whole
            # deploy. Recover by resetting the persistence volume so Redis starts
            # clean. On a WIPE run this is always correct (clean first-run state);
            # otherwise only reset when Redis is genuinely unhealthy.
            reset_redis_volume() {
              docker compose --env-file .env.prod -f docker-compose.prod.yml rm -sf redis 2>/dev/null || true
              RVOL=$(docker volume ls -q | grep -E 'redis_data$' | head -1 || true)
              if [ -n "$RVOL" ]; then docker volume rm "$RVOL" 2>/dev/null || true; fi
            }
            if [ "$WIPE_DB" = "WIPE" ]; then
              echo "==> WIPE run: resetting Redis persistence volume for a clean start"
              reset_redis_volume
            else
              docker compose --env-file .env.prod -f docker-compose.prod.yml restart redis 2>/dev/null || true
              RSTATE=starting
              for k in $(seq 1 8); do
                RSTATE=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' easymod-redis-1 2>/dev/null || echo missing)
                [ "$RSTATE" = "healthy" ] && break
                [ "$RSTATE" = "unhealthy" ] && break
                sleep 5
              done
              if [ "$RSTATE" != "healthy" ]; then
                echo "==> Redis $RSTATE — resetting its persistence volume to recover"
                reset_redis_volume
              fi
            fi

            # Authenticate to ghcr.io on the droplet
            echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

            # Pull the exact registry digests emitted by the build job. Tags are
            # retained only as human-readable publication labels and are never
            # used as a production deployment or rollback reference.
            if [ -n "$BACKEND_DIGEST" ]; then
              echo "Pulling backend digest: $GHCR_IMAGE_BACKEND"
              docker pull "$GHCR_IMAGE_BACKEND"
            fi

            if [ -n "$FRONTEND_DIGEST" ]; then
              echo "Pulling frontend digest: $GHCR_IMAGE_FRONTEND"
              docker pull "$GHCR_IMAGE_FRONTEND"
            fi

            # Validate the rendered environment with the candidate backend image
            # before replacing any running container.
            docker run --rm --env-file .env.prod "$GHCR_IMAGE_BACKEND" \
              node -e "require('./src/config/production-config.validator').assertProductionConfig(process.env)"

            verify_rollback() {
              local restored_backend restored_frontend saved_hash current_hash
              restored_backend=$(docker inspect -f '{{.Config.Image}}' easymod-backend-1 2>/dev/null || true)
              restored_frontend=$(docker inspect -f '{{.Config.Image}}' easymod-frontend-1 2>/dev/null || true)
              if [ "$restored_backend" != "$previous_backend_image" ] || [ "$restored_frontend" != "$previous_frontend_image" ]; then
                echo "ERROR: rollback image references were not restored"
                return 1
              fi
              saved_hash=$(sha256sum "$ROLLBACK_STATE_DIR/.env.prod" | awk '{print $1}')
              current_hash=$(sha256sum /opt/easymod/.env.prod | awk '{print $1}')
              if [ "$saved_hash" != "$current_hash" ]; then
                echo "ERROR: rollback environment was not restored"
                return 1
              fi
              if ! cmp -s "$ROLLBACK_STATE_DIR/docker-compose.prod.yml" /opt/easymod/docker-compose.prod.yml \
                || ! cmp -s "$ROLLBACK_STATE_DIR/Caddyfile" /opt/easymod/Caddyfile; then
                echo "ERROR: rollback production configuration was not restored"
                return 1
              fi
              for i in $(seq 1 20); do
                local status
                status=$(docker exec easymod-backend-1 node -e "require('http').get('http://127.0.0.1:3000/health/ready', r => { process.stdout.write(String(r.statusCode)); process.exit(0); }).on('error', () => { process.stdout.write('000'); process.exit(0); })" 2>/dev/null || echo "000")
                if [ "$status" = "200" ]; then
                  echo "Rollback health check passed on attempt $i"
                  return 0
                fi
                sleep 5
              done
              echo "ERROR: rollback health check failed after 100s"
              return 1
            }

            rollback() {
              echo "ERROR: candidate deployment failed; restoring previous images and production configuration"
              if [ -z "$previous_backend_image" ] || [ -z "$previous_frontend_image" ]; then
                echo "ERROR: previous image references were unavailable; manual recovery is required"
                return 1
              fi
              if ! cp -p "$ROLLBACK_STATE_DIR/.env.prod" /opt/easymod/.env.prod \
                || ! cp -p "$ROLLBACK_STATE_DIR/docker-compose.prod.yml" /opt/easymod/docker-compose.prod.yml \
                || ! cp -p "$ROLLBACK_STATE_DIR/Caddyfile" /opt/easymod/Caddyfile; then
                echo "ERROR: rollback environment/configuration restore failed"
                return 1
              fi
              chmod 600 /opt/easymod/.env.prod
              export GHCR_IMAGE_BACKEND="$previous_backend_image"
              export GHCR_IMAGE_FRONTEND="$previous_frontend_image"
              if ! docker compose --env-file .env.prod -f docker-compose.prod.yml up --detach --no-build --remove-orphans; then
                echo "ERROR: rollback compose restore failed"
                return 1
              fi
              verify_rollback
            }
            deploy_succeeded=false
            trap 'rc=$?; if [ "$rc" -ne 0 ] && [ "$deploy_succeeded" != "true" ]; then rollback || rc=70; fi; exit "$rc"' EXIT

            # ── DESTRUCTIVE WIPE (only when manually triggered with WIPE_DB=WIPE) ──
            if [ "$WIPE_DB" = "WIPE" ]; then
              echo "==> WIPE_DB=WIPE detected — dropping runtime DATABASE_URL database"
              docker compose --env-file .env.prod -f docker-compose.prod.yml stop backend worker 2>/dev/null || true
              docker compose --env-file .env.prod -f docker-compose.prod.yml run --rm --no-deps -T -e RUN_MIGRATIONS_ON_STARTUP=false backend node <<'NODE'
              const { Client } = require('pg');

              function quoteIdent(value) {
                return `"${String(value).replace(/"/g, '""')}"`;
              }

              function sslConfig() {
                const dbSsl = String(process.env.DB_SSL || '').toLowerCase();
                if (dbSsl !== 'true' && dbSsl !== '1') return false;
                return { rejectUnauthorized: String(process.env.ALLOW_SELF_SIGNED_TLS || '').toLowerCase() !== 'true' };
              }

              async function main() {
                if (!process.env.DATABASE_URL) {
                  throw new Error('DATABASE_URL is required for production wipe');
                }

                const appUrl = new URL(process.env.DATABASE_URL);
                const dbName = decodeURIComponent(appUrl.pathname.replace(/^\//, ''));
                const dbOwner = decodeURIComponent(appUrl.username || '');
                if (!dbName || ['postgres', 'template0', 'template1'].includes(dbName)) {
                  throw new Error(`Refusing to wipe reserved database: ${dbName || '(empty)'}`);
                }
                if (!dbOwner) {
                  throw new Error('DATABASE_URL username is required to recreate the database owner');
                }

                const adminUrl = new URL(process.env.DATABASE_URL);
                adminUrl.pathname = '/postgres';
                const ssl = sslConfig();
                const adminClient = new Client({ connectionString: adminUrl.toString(), ssl });
                await adminClient.connect();
                await adminClient.query(
                  'SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = $1 AND pid <> pg_backend_pid();',
                  [dbName]
                );
                await adminClient.query(`DROP DATABASE IF EXISTS ${quoteIdent(dbName)};`);
                await adminClient.query(`CREATE DATABASE ${quoteIdent(dbName)} OWNER ${quoteIdent(dbOwner)};`);
                await adminClient.end();

                const appClient = new Client({ connectionString: process.env.DATABASE_URL, ssl });
                await appClient.connect();
                await appClient.query('CREATE EXTENSION IF NOT EXISTS "uuid-ossp";');
                await appClient.end();

                console.log(`==> Runtime database wiped: ${dbName}`);
              }

              main().catch((error) => {
                console.error(error);
                process.exit(1);
              });
            NODE
              echo "==> Bootstrapping entity tables via npm run db:sync"
              docker compose --env-file .env.prod -f docker-compose.prod.yml run --rm -e RUN_MIGRATIONS_ON_STARTUP=false backend npm run db:sync
              echo "==> Seeding migrations table so the runner skips already-applied DDL"
              docker compose --env-file .env.prod -f docker-compose.prod.yml run --rm -e RUN_MIGRATIONS_ON_STARTUP=false backend npm run migrate:seed-executed
              echo "==> DB wiped, synced, and migration history primed"

              # Full reset: a true first-time state must also clear the other
              # stateful stores, otherwise stale dedup keys can suppress new
              # messages, orphaned RAG vectors can bleed into AI replies, and
              # old attachment URLs can expose previous merchant media.
              echo "==> Flushing Redis (BullMQ jobs, dedup keys, rate buckets, SSE replay, sessions)"
              docker compose --env-file .env.prod -f docker-compose.prod.yml exec -T redis redis-cli FLUSHALL || true
              echo "==> Clearing backend uploads volume"
              docker compose --env-file .env.prod -f docker-compose.prod.yml run --rm --no-deps backend sh -lc 'find /app/uploads -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +'
              echo "==> Resetting Qdrant vector store (RAG embeddings)"
              QDRANT_VOLUME=$(docker inspect easymod-qdrant-1 --format '{{range .Mounts}}{{if eq .Destination "/qdrant/storage"}}{{.Name}}{{end}}{{end}}' 2>/dev/null || true)
              docker compose --env-file .env.prod -f docker-compose.prod.yml stop qdrant 2>/dev/null || true
              docker compose --env-file .env.prod -f docker-compose.prod.yml rm -f qdrant 2>/dev/null || true
              if [ -n "$QDRANT_VOLUME" ]; then
                docker volume rm "$QDRANT_VOLUME" 2>/dev/null || true
              fi
              echo "==> Redis flushed, uploads cleared, and Qdrant volume reset"
            fi

            # Run additive migrations from the candidate backend image before
            # replacing the currently running API and worker. This prevents new
            # application code from starting against an old schema.
            if [ -n "$BACKEND_TAG" ] && [ "$WIPE_DB" != "WIPE" ]; then
              echo "Running database migrations before service replacement..."
              docker compose --env-file .env.prod -f docker-compose.prod.yml run --rm --no-deps -T \
                -e RUN_MIGRATIONS_ON_STARTUP=false backend npm run migrate
            fi

            # Restart services with immutable image references
            docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --no-build --remove-orphans

            # The Caddyfile is bind-mounted read-only, so `up -d` will NOT restart
            # Caddy just because the file's contents changed. Reload it explicitly
            # so the F-05 `/health* -> backend` routing actually takes effect.
            echo "==> Reloading Caddy with synced config"
            docker compose --env-file .env.prod -f docker-compose.prod.yml exec -T caddy \
              caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile 2>/dev/null \
              || docker compose --env-file .env.prod -f docker-compose.prod.yml restart caddy \
              || true

            # Idempotent production review account seed. Requires exact SEED input
            # so normal deploys do not reset credentials or grant admin access.
            if [ "$SEED_ADMIN" = "SEED" ]; then
              echo "==> Seeding production admin review account"
              docker compose --env-file .env.prod -f docker-compose.prod.yml exec -T backend npm run seed:admin
            fi

            # Health check
            for i in $(seq 1 20); do
              STATUS=$(docker exec easymod-backend-1 node -e "require('http').get('http://127.0.0.1:3000/health/ready', r => { process.stdout.write(String(r.statusCode)); process.exit(0); }).on('error', () => { process.stdout.write('000'); process.exit(0); })" 2>/dev/null || echo "000")
              if [ "$STATUS" = "200" ]; then
                echo "Health check passed on attempt $i"
                break
              fi
              echo "Attempt $i: status=$STATUS — retrying in 5s..."
              sleep 5
              if [ "$i" = "20" ]; then
                echo "ERROR: Health check failed after 100s"
                exit 1
              fi
            done

            # Clean up dangling images
            docker image prune -f

            cat > /opt/easymod/deployment-metadata.json <<EOF
            {
              "DEPLOYED_COMMIT": "${DEPLOYED_COMMIT}",
              "BACKEND_IMAGE_DIGEST": "${GHCR_IMAGE_BACKEND}",
              "FRONTEND_IMAGE_DIGEST": "${GHCR_IMAGE_FRONTEND}",
              "PREVIOUS_BACKEND_IMAGE_DIGEST": "${previous_backend_image}",
              "PREVIOUS_FRONTEND_IMAGE_DIGEST": "${previous_frontend_image}",
              "WORKFLOW_RUN_ID": "${WORKFLOW_RUN_ID}",
              "DEPLOYED_AT": "${DEPLOYED_AT}"
            }
            EOF
            chmod 600 /opt/easymod/deployment-metadata.json
            deploy_succeeded=true

        env:
          GHCR_BACKEND: ${{ env.GHCR_BACKEND }}
          GHCR_FRONTEND: ${{ env.GHCR_FRONTEND }}
          BACKEND_TAG: ${{ needs.build.outputs.backend_tag }}
          FRONTEND_TAG: ${{ needs.build.outputs.frontend_tag }}
          BACKEND_DIGEST: ${{ needs.build.outputs.backend_digest }}
          FRONTEND_DIGEST: ${{ needs.build.outputs.frontend_digest }}
          DEPLOYED_COMMIT: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          DEPLOYED_AT: ${{ needs.build.outputs.build_time }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIPE_DB: ${{ github.event.inputs.wipe_db_first }}
          SEED_ADMIN: ${{ github.event.inputs.seed_admin }}
          ROLLBACK_STATE_DIR: /opt/easymod/.cutover-rollback/${{ github.run_id }}
