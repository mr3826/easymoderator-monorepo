appId: tech.easymod.merchant.preview
name: Production deep link - a real order from Home, app running
---
- launchApp
- extendedWaitUntil:
    visible:
      id: home-attention-list
    timeout: 90000
- openLink:
    link: easymodmerchantpreview://order/${MAESTRO_PROOF_ORDER_ID}
- extendedWaitUntil:
    visible:
      id: deeplink-found
    timeout: 60000
- takeScreenshot: order-deeplink-warm
- back
- extendedWaitUntil:
    visible:
      id: home-attention-list
    timeout: 30000
