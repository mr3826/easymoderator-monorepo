name: Blue-Green Deployment

on:
  workflow_dispatch:
    inputs:
      traffic_percentage:
        description: 'Traffic percentage for new version (0-100)'
        required: true
        default: '10'
        type: string
      rollback:
        description: 'Rollback to previous version'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: gen-lang-client-0405487706
  REGION: us-central1
  REGISTRY: us-central1-docker.pkg.dev
  REPOSITORY: easymod-frontend
  SERVICE_NAME: easymod-frontend
  SERVICE_ACCOUNT: easymod-frontend-sa@gen-lang-client-0405487706.iam.gserviceaccount.com

jobs:
  validate-input:
    name: Validate Deployment Parameters
    runs-on: ubuntu-latest
    outputs:
      traffic_percentage: ${{ steps.validate.outputs.traffic_percentage }}
      is_rollback: ${{ steps.validate.outputs.is_rollback }}
      
    steps:
      - name: Validate inputs
        id: validate
        run: |
          TRAFFIC="${{ github.event.inputs.traffic_percentage || '10' }}"
          ROLLBACK="${{ github.event.inputs.rollback || 'false' }}"
          
          # Validate traffic percentage
          if ! [[ "$TRAFFIC" =~ ^[0-9]+$ ]] || [ "$TRAFFIC" -lt 0 ] || [ "$TRAFFIC" -gt 100 ]; then
            echo "❌ Invalid traffic percentage: $TRAFFIC (must be 0-100)"
            exit 1
          fi
          
          echo "traffic_percentage=$TRAFFIC" >> "$GITHUB_OUTPUT"
          echo "is_rollback=$ROLLBACK" >> "$GITHUB_OUTPUT"
          
          echo "✅ Deployment parameters validated:"
          echo "   - Traffic percentage: $TRAFFIC%"
          echo "   - Rollback mode: $ROLLBACK"

  deploy-new-version:
    name: Deploy New Version
    runs-on: ubuntu-latest
    needs: validate-input
    if: needs.validate-input.outputs.is_rollback == 'false'
    
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run critical tests
        run: |
          echo "🧪 Running critical tests for blue-green deployment..."
          npm test -- --run src/test/UnifiedInbox.test.tsx --passWithNoTests --maxWorkers=2 || {
            echo "❌ Tests failed - aborting deployment"
            exit 1
          }

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: github-actions-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push new version
        id: build
        run: |
          echo "🏗️ Building new version for blue-green deployment..."
          IMAGE="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/app"
          VERSION_TAG="${IMAGE}:bluegreen-${{ github.run_id }}"
          
          echo "📋 Build configuration:"
          echo "   - Image: $IMAGE"
          echo "   - Version Tag: $VERSION_TAG"
          echo "   - Platform: linux/amd64"
          
          docker buildx build \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --build-arg VITE_API_BASE_URL=https://api.easymod.tech \
            --build-arg VITE_META_APP_ID=${{ secrets.VITE_META_APP_ID }} \
            --build-arg VITE_ENV=production \
            --build-arg VITE_SENTRY_DSN=https://06e7791947790be93a0e1bcc800395af@o4511271250624512.ingest.us.sentry.io/4511335854833664 \
            --platform linux/amd64 \
            -t "$VERSION_TAG" \
            --push \
            . || {
            echo "❌ Build failed"
            exit 1
          }
          
          echo "version_tag=$VERSION_TAG" >> "$GITHUB_OUTPUT"
          echo "✅ New version built and pushed: $VERSION_TAG"

  traffic-management:
    name: Manage Traffic Splitting
    runs-on: ubuntu-latest
    needs: [validate-input, deploy-new-version]
    if: needs.validate-input.outputs.is_rollback == 'false'
    
    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: github-actions-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Get current service details
        id: current
        run: |
          echo "🔍 Getting current service details..."
          SERVICE_DETAILS=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --format="value(status.latestReadyRevisionName)" 2>/dev/null || echo "")
          
          echo "current_revision=$SERVICE_DETAILS" >> "$GITHUB_OUTPUT"
          echo "Current revision: $SERVICE_DETAILS"

      - name: Deploy new revision with traffic split
        run: |
          echo "🚀 Deploying new revision with traffic splitting..."
          
          NEW_REVISION="${{ env.SERVICE_NAME }}-bluegreen-${{ github.run_id }}"
          TRAFFIC_PERCENTAGE="${{ needs.validate-input.outputs.traffic_percentage }}"
          CURRENT_REVISION="${{ steps.current.outputs.current_revision }}"
          VERSION_TAG="${{ needs.deploy-new-version.outputs.build.outputs.version_tag }}"
          
          echo "📋 Deployment parameters:"
          echo "   - Service: ${{ env.SERVICE_NAME }}"
          echo "   - Image: $VERSION_TAG"
          echo "   - Region: ${{ env.REGION }}"
          echo "   - Traffic: $TRAFFIC_PERCENTAGE%"
          
          # Deploy new revision
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image="$VERSION_TAG" \
            --region=${{ env.REGION }} \
            --service-account=${{ env.SERVICE_ACCOUNT }} \
            --no-traffic \
            --tag=bluegreen-${{ github.run_id }} \
            --revision-suffix=bluegreen-${{ github.run_id }} || {
            echo "❌ Failed to deploy new revision"
            exit 1
          }
          
          # Get the new revision name
          NEW_REVISION_NAME=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --format="value(status.latestReadyRevisionName)" | grep "bluegreen-${{ github.run_id }}" || echo "")
          
          if [ -z "$NEW_REVISION_NAME" ]; then
            echo "❌ Could not find new revision"
            exit 1
          fi
          
          echo "📊 Setting up traffic split..."
          
          if [ -n "$CURRENT_REVISION" ] && [ "$TRAFFIC_PERCENTAGE" -lt 100 ]; then
            # Split traffic between old and new versions
            gcloud run services update-traffic ${{ env.SERVICE_NAME }} \
              --region=${{ env.REGION }} \
              --to-revisions=$CURRENT_REVISION=$((100 - TRAFFIC_PERCENTAGE)),$NEW_REVISION_NAME=$TRAFFIC_PERCENTAGE || {
              echo "❌ Failed to set up traffic split"
              exit 1
            }
            
            echo "✅ Traffic split configured:"
            echo "   - Current version ($CURRENT_REVISION): $((100 - TRAFFIC_PERCENTAGE))%"
            echo "   - New version ($NEW_REVISION_NAME): $TRAFFIC_PERCENTAGE%"
          else
            # Send 100% traffic to new version
            gcloud run services update-traffic ${{ env.SERVICE_NAME }} \
              --region=${{ env.REGION }} \
              --to-revisions=$NEW_REVISION_NAME=100 || {
              echo "❌ Failed to set traffic to new version"
              exit 1
            }
            
            echo "✅ All traffic routed to new version ($NEW_REVISION_NAME)"
          fi

      - name: Health check new version
        run: |
          echo "🏥 Health checking new version..."
          
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --format="value(status.url)" 2>/dev/null || echo "")
          
          if [ -z "$SERVICE_URL" ]; then
            echo "❌ Failed to get service URL"
            exit 1
          fi
          
          # Test health endpoint multiple times
          for i in {1..3}; do
            STATUS=$(curl -sf "${SERVICE_URL}/health" -o /dev/null -w "%{http_code}" 2>/dev/null || echo "000")
            echo "🔍 Health check $i: HTTP $STATUS"
            
            if [ "$STATUS" = "200" ]; then
              echo "✅ New version is healthy"
              break
            elif [ $i -eq 3 ]; then
              echo "❌ New version health checks failed"
              echo "🔄 Consider rolling back"
              exit 1
            else
              sleep 5
            fi
          done

  rollback-deployment:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    needs: validate-input
    if: needs.validate-input.outputs.is_rollback == 'true'
    
    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: github-actions-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Get previous revision
        id: previous
        run: |
          echo "🔄 Getting previous revision for rollback..."
          
          # Get all revisions and find the previous one
          REVISIONS=$(gcloud run revisions list --service=${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --format="value(metadata.name)" --sort-by=~metadata.creationTimestamp)
          
          # Skip the latest revision and get the previous one
          PREVIOUS_REVISION=$(echo "$REVISIONS" | sed -n '2p')
          
          if [ -z "$PREVIOUS_REVISION" ]; then
            echo "❌ No previous revision found for rollback"
            exit 1
          fi
          
          echo "previous_revision=$PREVIOUS_REVISION" >> "$GITHUB_OUTPUT"
          echo "Previous revision: $PREVIOUS_REVISION"

      - name: Execute rollback
        run: |
          echo "🔄 Executing rollback to ${{ steps.previous.outputs.previous_revision }}..."
          
          gcloud run services update-traffic ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --to-revisions=${{ steps.previous.outputs.previous_revision }}=100 || {
            echo "❌ Rollback failed"
            exit 1
          }
          
          echo "✅ Rollback completed successfully"
          echo "🌐 All traffic routed to previous version"

  deployment-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [validate-input, traffic-management, rollback-deployment]
    if: always()
    
    steps:
      - name: Generate deployment summary
        run: |
          echo "📊 Blue-Green Deployment Summary"
          echo "================================"
          echo "Deployment ID: ${{ github.run_id }}"
          echo "Traffic Percentage: ${{ needs.validate-input.outputs.traffic_percentage }}%"
          echo "Rollback Mode: ${{ needs.validate-input.outputs.is_rollback }}"
          echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Actor: ${{ github.actor }}"
          
          if [ "${{ needs.validate-input.outputs.is_rollback }}" == "false" ]; then
            echo "Deployment Status: ${{ needs.traffic-management.result }}"
            echo "Next Steps: Monitor performance and gradually increase traffic if healthy"
          else
            echo "Rollback Status: ${{ needs.rollback-deployment.result }}"
            echo "Next Steps: Investigate issues with the previous deployment"
          fi
