name: Meta Test Pipeline

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "EasyMod-backend/src/modules/integration/**"
      - "EasyMod-backend/src/modules/channel/**"
      - "EasyMod-backend/tests/webhooks/**"
      - "EasyMod-backend/tests/channel/**"
      - "EasyMod-frontend/src/app/components/Channels.tsx"
      - "EasyMod-frontend/src/app/components/OAuthCallbackPage.tsx"
      - "EasyMod-frontend/src/app/components/UnifiedInbox.tsx"
      - "EasyMod-frontend/src/test/Channels.test.tsx"
      - "EasyMod-frontend/src/test/OAuthCallbackPage.test.tsx"
      - "EasyMod-frontend/src/test/UnifiedInbox.test.tsx"
      - "EasyMod-frontend/tests/e2e/meta-platform.spec.ts"
      - ".github/workflows/test-meta.yml"
  push:
    branches:
      - main
    paths:
      - "EasyMod-backend/src/modules/integration/**"
      - "EasyMod-backend/src/modules/channel/**"
      - "EasyMod-backend/tests/webhooks/**"
      - "EasyMod-backend/tests/channel/**"
      - "EasyMod-frontend/src/app/components/Channels.tsx"
      - "EasyMod-frontend/src/app/components/OAuthCallbackPage.tsx"
      - "EasyMod-frontend/src/app/components/UnifiedInbox.tsx"
      - "EasyMod-frontend/src/test/Channels.test.tsx"
      - "EasyMod-frontend/src/test/OAuthCallbackPage.test.tsx"
      - "EasyMod-frontend/src/test/UnifiedInbox.test.tsx"
      - "EasyMod-frontend/tests/e2e/meta-platform.spec.ts"
      - ".github/workflows/test-meta.yml"

jobs:
  backend-meta-tests:
    name: Backend Meta Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: easymod_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: EasyMod-backend

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/easymod_test
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: EasyMod-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Meta webhook + OAuth backend tests
        run: npm test -- tests/webhooks/meta-webhook.test.js tests/channel/channel-oauth.test.js --runInBand --coverage=false

  frontend-meta-unit:
    name: Frontend Meta Unit Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: EasyMod-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: EasyMod-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Meta-focused frontend unit tests
        run: npm run test:unit -- src/test/Channels.test.tsx src/test/OAuthCallbackPage.test.tsx src/test/UnifiedInbox.test.tsx

  frontend-meta-e2e:
    name: Frontend Meta E2E Tests
    runs-on: ubuntu-latest
    needs: frontend-meta-unit

    defaults:
      run:
        working-directory: EasyMod-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: EasyMod-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Meta-focused Playwright test
        run: npm run test:e2e -- tests/e2e/meta-platform.spec.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-meta
          path: EasyMod-frontend/playwright-report/
          if-no-files-found: ignore
