name: Qdrant Migration Proof

on:
  workflow_dispatch:
    inputs:
      candidate_commit:
        description: 'Existing immutable candidate commit to pull (for example main HEAD)'
        required: true
        type: string
      confirmation:
        description: 'Type QDRANT-MIGRATION-ONLY to allow the non-deploying proof'
        required: true
        type: string

# This workflow intentionally cannot deploy the application. It uses only the
# existing production env file on the host, creates run-scoped isolated
# migration/calibration collections, retains failed restore evidence, and
# removes successful isolated restore containers and proof scripts at the end.
permissions:
  contents: read
  packages: read

env:
  GHCR_BACKEND: ghcr.io/${{ github.repository_owner }}/easymoderator-backend
  ACTIVE_COLLECTION: knowledge_documents
  OPENAI_ROLLBACK_COLLECTION_BASE: knowledge_documents_openai_rollback_20260816
  GEMINI_COLLECTION_BASE: knowledge_documents_gemini_20260816
  GEMINI_SEMANTIC_COLLECTION_BASE: knowledge_documents_gemini_semantic_20260816
  OPENAI_SEMANTIC_COLLECTION_BASE: knowledge_documents_openai_semantic_20260816
  EXPECTED_SOURCE_COUNT: '2'
  EXPECTED_LIVE_COUNT: '1'
  VECTOR_SIZE: '384'
  QDRANT_IMAGE: qdrant/qdrant@sha256:b3063c673f3973877c038eeecc392bad5011f072ee7892b56c9a8e204a3bdea9

jobs:
  qdrant-proof:
    name: Non-deploying Qdrant migration proof
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: vars.PRODUCTION_DEPLOY_ENABLED != 'true'
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DO_SSH_PRIVATE_KEY: ${{ secrets.DO_SSH_PRIVATE_KEY }}
      DO_SSH_KNOWN_HOSTS: ${{ secrets.DO_SSH_KNOWN_HOSTS }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_ACTOR: ${{ github.actor }}
      CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
      CONFIRMATION: ${{ inputs.confirmation }}
      PRODUCTION_DEPLOY_ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED || 'false' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
      GEMINI_EMBEDDING_MODEL: ${{ secrets.GEMINI_EMBEDDING_MODEL }}
      PROOF_SCRIPT_PATH: /opt/easymod/qdrant-migration-proof-${{ github.run_id }}.js
      ACCEPTANCE_CONTRACT_PATH: /opt/easymod/semantic-acceptance-contract-${{ github.run_id }}.js
      FIXTURE_SCRIPT_PATH: /opt/easymod/semantic-calibration-fixtures-${{ github.run_id }}.js
      READINESS_SCRIPT_PATH: /opt/easymod/qdrant-restore-readiness-${{ github.run_id }}.js
    steps:
      - name: Check out proof runner
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Pull and digest-pin the candidate with GITHUB_TOKEN
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "QDRANT-MIGRATION-ONLY"
          test "$PRODUCTION_DEPLOY_ENABLED" != "true"
          if ! printf '%s' "$CANDIDATE_COMMIT" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "candidate_commit must be a full commit SHA"
            exit 1
          fi
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin >/dev/null
          docker pull "$GHCR_BACKEND:$CANDIDATE_COMMIT" >/dev/null
          candidate_image=$(docker image inspect --format '{{index .RepoDigests 0}}' "$GHCR_BACKEND:$CANDIDATE_COMMIT")
          if ! printf '%s' "$candidate_image" | grep -Eq '^.+@sha256:[0-9a-f]{64}$'; then
            echo "candidate image did not resolve to a digest"
            exit 1
          fi
          echo "candidate_image=$candidate_image" >> "$GITHUB_OUTPUT"
          echo "GHCR_CANDIDATE_PULL=PASS"
          echo "CANDIDATE_IMAGE=$candidate_image"
          docker logout ghcr.io >/dev/null 2>&1 || true

      - name: Copy the proof runner to the production host
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DO_SSH_PRIVATE_KEY"
          test -n "$DO_SSH_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          printf '%s\n' "$DO_SSH_PRIVATE_KEY" > ~/.ssh/easymod_deploy_key
          chmod 600 ~/.ssh/easymod_deploy_key
          printf '%s\n' "$DO_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null
          ssh -i ~/.ssh/easymod_deploy_key root@"$DEPLOY_HOST" \
            "set -e; test -f /opt/easymod/.env.prod; test -f /opt/easymod/docker-compose.prod.yml; rm -f -- '$PROOF_SCRIPT_PATH' '$ACCEPTANCE_CONTRACT_PATH' '$FIXTURE_SCRIPT_PATH' '$READINESS_SCRIPT_PATH'"
          scp -i ~/.ssh/easymod_deploy_key scripts/qdrant-migration-proof.js \
            root@"$DEPLOY_HOST":"$PROOF_SCRIPT_PATH"
          scp -i ~/.ssh/easymod_deploy_key scripts/semantic-acceptance-contract.js \
            root@"$DEPLOY_HOST":"$ACCEPTANCE_CONTRACT_PATH"
          scp -i ~/.ssh/easymod_deploy_key scripts/semantic-calibration-fixtures.js \
            root@"$DEPLOY_HOST":"$FIXTURE_SCRIPT_PATH"
          scp -i ~/.ssh/easymod_deploy_key scripts/qdrant-restore-readiness.js \
            root@"$DEPLOY_HOST":"$READINESS_SCRIPT_PATH"
          ssh -i ~/.ssh/easymod_deploy_key root@"$DEPLOY_HOST" \
            "chmod 644 '$PROOF_SCRIPT_PATH' '$ACCEPTANCE_CONTRACT_PATH' '$FIXTURE_SCRIPT_PATH' '$READINESS_SCRIPT_PATH'"
          echo "PROOF_SCRIPT_PATH=$PROOF_SCRIPT_PATH" >> "$GITHUB_ENV"
          echo "ACCEPTANCE_CONTRACT_PATH=$ACCEPTANCE_CONTRACT_PATH" >> "$GITHUB_ENV"

      - name: Execute isolated rollback and Gemini proof without deployment
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          CANDIDATE_IMAGE: ${{ steps.candidate.outputs.candidate_image }}
          GHCR_BACKEND: ${{ env.GHCR_BACKEND }}
          ACTIVE_COLLECTION: ${{ env.ACTIVE_COLLECTION }}
          OPENAI_ROLLBACK_COLLECTION_BASE: ${{ env.OPENAI_ROLLBACK_COLLECTION_BASE }}
          GEMINI_COLLECTION_BASE: ${{ env.GEMINI_COLLECTION_BASE }}
          GEMINI_SEMANTIC_COLLECTION_BASE: ${{ env.GEMINI_SEMANTIC_COLLECTION_BASE }}
          OPENAI_SEMANTIC_COLLECTION_BASE: ${{ env.OPENAI_SEMANTIC_COLLECTION_BASE }}
          EXPECTED_SOURCE_COUNT: ${{ env.EXPECTED_SOURCE_COUNT }}
          EXPECTED_LIVE_COUNT: ${{ env.EXPECTED_LIVE_COUNT }}
          VECTOR_SIZE: ${{ env.VECTOR_SIZE }}
          QDRANT_IMAGE: ${{ env.QDRANT_IMAGE }}
          PROOF_SCRIPT_PATH: ${{ env.PROOF_SCRIPT_PATH }}
          ACCEPTANCE_CONTRACT_PATH: ${{ env.ACCEPTANCE_CONTRACT_PATH }}
          FIXTURE_SCRIPT_PATH: ${{ env.FIXTURE_SCRIPT_PATH }}
          READINESS_SCRIPT_PATH: ${{ env.READINESS_SCRIPT_PATH }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          PRODUCTION_DEPLOY_ENABLED: ${{ env.PRODUCTION_DEPLOY_ENABLED }}
          OPENAI_API_KEY: ${{ env.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ env.GEMINI_API_KEY }}
          GEMINI_EMBEDDING_MODEL: ${{ env.GEMINI_EMBEDDING_MODEL }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          timeout: 1800s
          envs: CANDIDATE_IMAGE,GHCR_BACKEND,GH_ACTOR,GH_TOKEN,ACTIVE_COLLECTION,OPENAI_ROLLBACK_COLLECTION_BASE,GEMINI_COLLECTION_BASE,GEMINI_SEMANTIC_COLLECTION_BASE,OPENAI_SEMANTIC_COLLECTION_BASE,EXPECTED_SOURCE_COUNT,EXPECTED_LIVE_COUNT,VECTOR_SIZE,QDRANT_IMAGE,PROOF_SCRIPT_PATH,ACCEPTANCE_CONTRACT_PATH,FIXTURE_SCRIPT_PATH,READINESS_SCRIPT_PATH,WORKFLOW_RUN_ID,PRODUCTION_DEPLOY_ENABLED,OPENAI_API_KEY,GEMINI_API_KEY,GEMINI_EMBEDDING_MODEL
          script: |
            set -euo pipefail
            umask 077

            ENV_PATH=/opt/easymod/.env.prod
            NETWORK=easymod_internal
            RUN_DIR="/opt/easymod/qdrant-migration/${WORKFLOW_RUN_ID}"
            OPENAI_ROLLBACK_COLLECTION="${OPENAI_ROLLBACK_COLLECTION_BASE}_${WORKFLOW_RUN_ID}"
            GEMINI_COLLECTION="${GEMINI_COLLECTION_BASE}_${WORKFLOW_RUN_ID}"
            GEMINI_SEMANTIC_COLLECTION="${GEMINI_SEMANTIC_COLLECTION_BASE}_${WORKFLOW_RUN_ID}"
            OPENAI_SEMANTIC_COLLECTION="${OPENAI_SEMANTIC_COLLECTION_BASE}_${WORKFLOW_RUN_ID}"
            OPENAI_FALLBACK_MODEL=text-embedding-3-small
            GEMINI_MODEL="${GEMINI_EMBEDDING_MODEL:-gemini-embedding-2}"
            RESTORE_CONTAINER="easymod-qdrant-restore-${WORKFLOW_RUN_ID}"
            RESTORE_HOST="$RESTORE_CONTAINER"
            RESTORE_COLLECTION="${OPENAI_ROLLBACK_COLLECTION}_restored"
            SNAPSHOT_FILE="${OPENAI_ROLLBACK_COLLECTION}.snapshot"
            RESTORE_CONTAINER_OWNED=false

            capture_restore_evidence() {
              local evidence_dir="$RUN_DIR/restore-evidence"
              mkdir -p "$evidence_dir"
              printf 'WORKFLOW_EXIT_STATUS=%s\n' "$1" > "$evidence_dir/cleanup-context.log"
              printf 'RESTORE_CONTAINER=%s\n' "$RESTORE_CONTAINER" >> "$evidence_dir/cleanup-context.log"
              printf 'RESTORE_CONTAINER_OWNED=%s\n' "$RESTORE_CONTAINER_OWNED" >> "$evidence_dir/cleanup-context.log"
              printf 'CAPTURED_AT_UTC=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$evidence_dir/cleanup-context.log"

              if [ "$RESTORE_CONTAINER_OWNED" = true ] && docker inspect "$RESTORE_CONTAINER" >/dev/null 2>&1; then
                docker inspect \
                  --format='{"id":{{json .Id}},"name":{{json .Name}},"created":{{json .Created}},"path":{{json .Path}},"args":{{json .Args}},"state":{{json .State}},"image":{{json .Config.Image}},"cmd":{{json .Config.Cmd}},"entrypoint":{{json .Config.Entrypoint}},"working_dir":{{json .Config.WorkingDir}},"user":{{json .Config.User}},"network_mode":{{json .HostConfig.NetworkMode}},"restart_policy":{{json .HostConfig.RestartPolicy}},"mounts":{{json .Mounts}},"networks":{{json .NetworkSettings.Networks}}}' \
                  "$RESTORE_CONTAINER" \
                  > "$evidence_dir/container-inspect.json" 2>&1 || true
                timeout --signal=TERM --kill-after=5s 30s \
                  docker logs --timestamps "$RESTORE_CONTAINER" \
                  > "$evidence_dir/container-logs.txt" 2>&1 || true
                timeout --signal=TERM --kill-after=5s 30s \
                  docker stats --no-stream "$RESTORE_CONTAINER" \
                  > "$evidence_dir/container-stats.txt" 2>&1 || true
                docker port "$RESTORE_CONTAINER" \
                  > "$evidence_dir/container-ports.txt" 2>&1 || true
                timeout --signal=TERM --kill-after=5s 15s \
                  docker top "$RESTORE_CONTAINER" \
                  > "$evidence_dir/container-processes.txt" 2>&1 || true
                docker network inspect "$NETWORK" \
                  > "$evidence_dir/network-inspect.json" 2>&1 || true

                if [ "$(docker inspect --format '{{.State.Running}}' "$RESTORE_CONTAINER" 2>/dev/null || true)" = "true" ]; then
                  timeout --signal=TERM --kill-after=5s 15s \
                    docker exec "$RESTORE_CONTAINER" /bin/sh -c \
                    'id; printf "PWD="; pwd; ps -ef 2>/dev/null || ps 2>/dev/null || true; ls -ld /qdrant /qdrant/storage /qdrant/snapshots 2>&1 || true; find /qdrant/snapshots -maxdepth 1 -type f -printf "%M %u:%g %s %TY-%Tm-%TdT%TH:%TM:%TS %p\n" 2>/dev/null || true' \
                    > "$evidence_dir/container-readonly-state.txt" 2>&1 || true
                fi

                printf 'RESTORE_CONTAINER_PRESENT=YES\nRESTORE_CONTAINER_RETAINED=YES\n' \
                  >> "$evidence_dir/cleanup-context.log"
                echo "RESTORE_EVIDENCE_DIR=$evidence_dir"
                echo "RESTORE_CONTAINER_RETAINED=YES"
              else
                printf 'RESTORE_CONTAINER_PRESENT=NO_OR_NOT_OWNED\nRESTORE_CONTAINER_RETAINED=NO_CONTAINER_CAPTURED\n' \
                  >> "$evidence_dir/cleanup-context.log"
                echo "RESTORE_EVIDENCE_DIR=$evidence_dir"
                echo "RESTORE_CONTAINER_RETAINED=NO_CONTAINER_CAPTURED"
              fi
            }

            cleanup() {
              local workflow_status="$1"
              set +e
              if [ "$workflow_status" -ne 0 ]; then
                capture_restore_evidence "$workflow_status"
              else
                if [ "$RESTORE_CONTAINER_OWNED" = true ]; then
                  docker rm -f "$RESTORE_CONTAINER" >/dev/null 2>&1 || true
                fi
                echo "RESTORE_CONTAINER_RETAINED=NO"
              fi
              rm -f -- "$PROOF_SCRIPT_PATH" "$ACCEPTANCE_CONTRACT_PATH" "$FIXTURE_SCRIPT_PATH" "$READINESS_SCRIPT_PATH"
              docker logout ghcr.io >/dev/null 2>&1 || true
            }
            trap 'workflow_status=$?; cleanup "$workflow_status"; exit "$workflow_status"' EXIT

            test "${PRODUCTION_DEPLOY_ENABLED:-false}" != "true"
            test -f "$ENV_PATH"
            test -f "$PROOF_SCRIPT_PATH"
            test -f /opt/easymod/docker-compose.prod.yml
            test -d /opt/easymod
            docker network inspect "$NETWORK" >/dev/null
            docker inspect easymod-qdrant-1 >/dev/null
            docker inspect easymod-postgres-1 >/dev/null
            if docker ps -a --format '{{.Names}}' | grep -Fxq "$RESTORE_CONTAINER"; then
              echo "refusing to reuse an existing isolated restore container"
              exit 1
            fi

            for required_name in DATABASE_URL QDRANT_URL QDRANT_COLLECTION OPENAI_API_KEY GEMINI_API_KEY; do
              grep -q "^${required_name}=" "$ENV_PATH"
            done
            test -n "$OPENAI_API_KEY"
            test -n "$GEMINI_API_KEY"
            printf '%s' "$GEMINI_MODEL" | grep -Eq '^gemini-embedding-[A-Za-z0-9.-]+$'
            configured_collection=$(awk -F= '$1 == "QDRANT_COLLECTION" { sub(/^[^=]*=/, ""); print; exit }' "$ENV_PATH")
            configured_collection="${configured_collection#\"}"
            configured_collection="${configured_collection%\"}"
            test "$configured_collection" = "$ACTIVE_COLLECTION"

            case "$CANDIDATE_IMAGE" in
              *@sha256:[0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F]*) ;;
              *) echo "candidate image is not digest-pinned"; exit 1 ;;
            esac
            if ! printf '%s' "$CANDIDATE_IMAGE" | grep -Eq '^.+@sha256:[0-9a-f]{64}$'; then
              echo "candidate image is not digest-pinned"
              exit 1
            fi
            mkdir -p "$RUN_DIR"
            chmod 755 "$RUN_DIR"
            chown 1000:1000 "$RUN_DIR"

            printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin >/dev/null
            docker pull "$CANDIDATE_IMAGE" >/dev/null
            echo "GHCR_PRIVILEGED_CANDIDATE_PULL=PASS"

            previous_backend=$(docker inspect easymod-backend-1 --format '{{.Config.Image}}')
            previous_frontend=$(docker inspect easymod-frontend-1 --format '{{.Config.Image}}')
            printf '%s\n' "$previous_backend" "$previous_frontend" | grep -Eq '^.+@sha256:[0-9a-f]{64}$'
            echo "APPLICATION_ROLLBACK=$previous_backend|$previous_frontend"
            echo "APPLICATION_ROLLBACK_PLAN=restore the captured backend and frontend digest references above; no application switch is executed"
            echo "QDRANT_ROLLBACK_PLAN=set QDRANT_COLLECTION=$OPENAI_ROLLBACK_COLLECTION in a separately approved deployment; do not delete any collection"

            run_proof() {
              docker run --rm --network "$NETWORK" --env-file "$ENV_PATH" \
                -e NODE_ENV=production \
                -e NODE_PATH=/app/node_modules \
                -e ACTIVE_COLLECTION="$ACTIVE_COLLECTION" \
                -e EXPECTED_SOURCE_COUNT="$EXPECTED_SOURCE_COUNT" \
                -e EXPECTED_LIVE_COUNT="$EXPECTED_LIVE_COUNT" \
                -e QDRANT_VECTOR_SIZE="$VECTOR_SIZE" \
                -e QDRANT_PER_TENANT=false \
                -e OPENAI_API_KEY="$OPENAI_API_KEY" \
                -e GEMINI_API_KEY="$GEMINI_API_KEY" \
                -e OPENAI_ROLLBACK_COLLECTION="$OPENAI_ROLLBACK_COLLECTION" \
                -e GEMINI_COLLECTION="$GEMINI_COLLECTION" \
                -e EXPECTED_LIVE_ALIAS_FINGERPRINT="${EXPECTED_LIVE_ALIAS_FINGERPRINT:-}" \
                -e SNAPSHOT_DIR=/tmp/migration \
                -e SEMANTIC_ACCEPTANCE_CONTRACT_PATH=/tmp/semantic-acceptance-contract.js \
                -v "$RUN_DIR:/tmp/migration:rw" \
                -v "$PROOF_SCRIPT_PATH:/tmp/qdrant-migration-proof.js:ro" \
                -v "$ACCEPTANCE_CONTRACT_PATH:/tmp/semantic-acceptance-contract.js:ro" \
                "$CANDIDATE_IMAGE" node /tmp/qdrant-migration-proof.js "$@"
            }

            run_provider_proof() {
              provider="$1"
              embedding_model="$2"
              gemini_model="$3"
              collection="$4"
              shift 4
              docker run --rm --network "$NETWORK" --env-file "$ENV_PATH" \
                -e NODE_ENV=production \
                -e NODE_PATH=/app/node_modules \
                -e ACTIVE_COLLECTION="$ACTIVE_COLLECTION" \
                -e EXPECTED_SOURCE_COUNT="$EXPECTED_SOURCE_COUNT" \
                -e EXPECTED_LIVE_COUNT="$EXPECTED_LIVE_COUNT" \
                -e QDRANT_VECTOR_SIZE="$VECTOR_SIZE" \
                -e QDRANT_PER_TENANT=false \
                -e QDRANT_COLLECTION="$collection" \
                -e OPENAI_API_KEY="$OPENAI_API_KEY" \
                -e GEMINI_API_KEY="$GEMINI_API_KEY" \
                -e EMBEDDING_PROVIDER="$provider" \
                -e EMBEDDING_MODEL="$embedding_model" \
                -e OPENAI_EMBEDDING_MODEL="$embedding_model" \
                -e GEMINI_EMBEDDING_MODEL="$gemini_model" \
                -e SNAPSHOT_DIR=/tmp/migration \
                -e SEMANTIC_ACCEPTANCE_CONTRACT_PATH=/tmp/semantic-acceptance-contract.js \
                -v "$RUN_DIR:/tmp/migration:rw" \
                -v "$PROOF_SCRIPT_PATH:/tmp/qdrant-migration-proof.js:ro" \
                -v "$ACCEPTANCE_CONTRACT_PATH:/tmp/semantic-acceptance-contract.js:ro" \
                "$CANDIDATE_IMAGE" node /tmp/qdrant-migration-proof.js "$@"
            }

            run_controlled_proof() {
              provider="$1"
              embedding_model="$2"
              gemini_model="$3"
              collection="$4"
              shift 4
              docker run --rm --network "$NETWORK" --env-file "$ENV_PATH" \
                -e NODE_ENV=production \
                -e NODE_PATH=/app/node_modules \
                -e ACTIVE_COLLECTION="$ACTIVE_COLLECTION" \
                -e QDRANT_VECTOR_SIZE="$VECTOR_SIZE" \
                -e QDRANT_PER_TENANT=false \
                -e QDRANT_COLLECTION="$collection" \
                -e OPENAI_API_KEY="$OPENAI_API_KEY" \
                -e GEMINI_API_KEY="$GEMINI_API_KEY" \
                -e EMBEDDING_PROVIDER="$provider" \
                -e EMBEDDING_MODEL="$embedding_model" \
                -e OPENAI_EMBEDDING_MODEL="$embedding_model" \
                -e GEMINI_EMBEDDING_MODEL="$gemini_model" \
                -e CONTROLLED_FIXTURE_PATH=/tmp/semantic-calibration-fixtures.js \
                -e SEMANTIC_ACCEPTANCE_CONTRACT_PATH=/tmp/semantic-acceptance-contract.js \
                -v "$PROOF_SCRIPT_PATH:/tmp/qdrant-migration-proof.js:ro" \
                -v "$ACCEPTANCE_CONTRACT_PATH:/tmp/semantic-acceptance-contract.js:ro" \
                -v "$FIXTURE_SCRIPT_PATH:/tmp/semantic-calibration-fixtures.js:ro" \
                "$CANDIDATE_IMAGE" node /tmp/qdrant-migration-proof.js "$@"
            }

            run_reindex() {
              provider="$1"
              embedding_model="$2"
              gemini_model="$3"
              target="$4"
              log_file="$5"
              set +e
              docker run --rm --network "$NETWORK" --env-file "$ENV_PATH" \
                -e NODE_ENV=production \
                -e NODE_PATH=/app/node_modules \
                -e QDRANT_COLLECTION="$ACTIVE_COLLECTION" \
                -e QDRANT_VECTOR_SIZE="$VECTOR_SIZE" \
                -e QDRANT_PER_TENANT=false \
                -e OPENAI_API_KEY="$OPENAI_API_KEY" \
                -e GEMINI_API_KEY="$GEMINI_API_KEY" \
                -e EMBEDDING_PROVIDER="$provider" \
                -e EMBEDDING_MODEL="$embedding_model" \
                -e OPENAI_EMBEDDING_MODEL="$embedding_model" \
                -e GEMINI_EMBEDDING_MODEL="$gemini_model" \
                "$CANDIDATE_IMAGE" npm run reindex:qdrant -- "--collection=$target" > "$log_file" 2>&1
              rc=$?
              set -e
              grep -E '^[[:space:]]+(shops|indexed|errors|duration):|Reindex complete|Reindex finished with errors' "$log_file" || true
              if [ "$rc" -ne 0 ]; then
                reindex_stage=$(sed -n 's/^REINDEX_STAGE=//p' "$log_file" | tail -1)
                reindex_type=$(sed -n 's/^REINDEX_ERROR_TYPE=//p' "$log_file" | tail -1)
                reindex_summary=$(sed -n 's/^REINDEX_ERROR_SUMMARY=//p' "$log_file" | tail -1)
                echo "REINDEX_PROVIDER=$provider"
                echo "REINDEX_STAGE=${reindex_stage:-unknown}"
                echo "REINDEX_ERROR_TYPE=${reindex_type:-UnknownError}"
                echo "REINDEX_ERROR_SUMMARY=${reindex_summary:-reindex command failed before sanitized diagnostics}"
                echo "REINDEX_EXIT_CODE=$rc"
                return "$rc"
              fi
              if ! grep -Eq '^[[:space:]]+errors:[[:space:]]+0$' "$log_file"; then
                echo "REINDEX_PROVIDER=$provider"
                echo "REINDEX_STAGE=index"
                echo "REINDEX_ERROR_TYPE=ReindexIngestionError"
                echo "REINDEX_ERROR_SUMMARY=Reindex completed with one or more ingestion errors"
                echo "REINDEX_EXIT_CODE=1"
                return 1
              fi
            }

            run_space_safety() {
              docker run --rm --network "$NETWORK" --env-file "$ENV_PATH" \
                -e NODE_ENV=production \
                -e NODE_PATH=/app/node_modules \
                -e QDRANT_VECTOR_SIZE="$VECTOR_SIZE" \
                -e EMBEDDING_MODEL="$OPENAI_FALLBACK_MODEL" \
                -e OPENAI_EMBEDDING_MODEL="$OPENAI_FALLBACK_MODEL" \
                -e GEMINI_EMBEDDING_MODEL="$GEMINI_MODEL" \
                -e SEMANTIC_ACCEPTANCE_CONTRACT_PATH=/tmp/semantic-acceptance-contract.js \
                -v "$PROOF_SCRIPT_PATH:/tmp/qdrant-migration-proof.js:ro" \
                -v "$ACCEPTANCE_CONTRACT_PATH:/tmp/semantic-acceptance-contract.js:ro" \
                "$CANDIDATE_IMAGE" node /tmp/qdrant-migration-proof.js space-safety
            }

            run_proof inspect | tee "$RUN_DIR/inspect.log"
            live_count=$(awk -F= '$1 == "LIVE_COUNT" { print $2 }' "$RUN_DIR/inspect.log" | tail -1)
            test "$live_count" = "$EXPECTED_LIVE_COUNT"
            EXPECTED_LIVE_ALIAS_FINGERPRINT=$(awk -F= '$1 == "LIVE_ALIAS_FINGERPRINT" { print $2 }' "$RUN_DIR/inspect.log" | tail -1)
            test -n "$EXPECTED_LIVE_ALIAS_FINGERPRINT"

            run_reindex gemini "$OPENAI_FALLBACK_MODEL" "$GEMINI_MODEL" "$GEMINI_COLLECTION" "$RUN_DIR/gemini-reindex.log"
            run_provider_proof gemini "$OPENAI_FALLBACK_MODEL" "$GEMINI_MODEL" "$GEMINI_COLLECTION" \
              validate "--collection=$GEMINI_COLLECTION" "--expected-count=$EXPECTED_SOURCE_COUNT" "--semantic=real-source" | tee "$RUN_DIR/gemini-validate.log"

            run_controlled_proof gemini "$OPENAI_FALLBACK_MODEL" "$GEMINI_MODEL" "$GEMINI_SEMANTIC_COLLECTION" \
              controlled-index "--collection=$GEMINI_SEMANTIC_COLLECTION" | tee "$RUN_DIR/gemini-controlled-index.log"
            run_controlled_proof gemini "$OPENAI_FALLBACK_MODEL" "$GEMINI_MODEL" "$GEMINI_SEMANTIC_COLLECTION" \
              controlled-validate "--collection=$GEMINI_SEMANTIC_COLLECTION" | tee "$RUN_DIR/gemini-controlled-validate.log"
            test "$(awk -F= '$1 == "CONTROLLED_SEMANTIC_VALIDATION" { print $2 }' "$RUN_DIR/gemini-controlled-validate.log" | tail -1)" = PASS
            echo "GEMINI_REAL_SOURCE_REINDEX=PASS"
            echo "GEMINI_CONTROLLED_SEMANTIC_VALIDATION=PASS"
            echo "GEMINI_COLLECTION_HOMOGENEITY=PASS"
            echo "GEMINI_MANIFEST_BINDING=PASS"

            run_space_safety | tee "$RUN_DIR/space-safety.log"
            for safety_gate in \
              CROSS_SPACE_QUERY_REJECTION \
              CROSS_SPACE_WRITE_REJECTION \
              QDRANT_SEARCH_NOT_EXECUTED_WITH_MISMATCH \
              UNSAFE_PER_REQUEST_FALLBACK_BLOCKED \
              WRONG_PROVIDER_REJECTED \
              WRONG_MODEL_REJECTED \
              WRONG_VERSION_REJECTED \
              WRONG_DIMENSION_REJECTED \
              LEGACY_UNKNOWN_FAIL_CLOSED \
              VECTOR_SIZE_ONLY_COMPATIBILITY_REJECTED; do
              test "$(awk -F= -v key="$safety_gate" '$1 == key { print $2 }' "$RUN_DIR/space-safety.log" | tail -1)" = PASS
            done

            run_reindex openai "$OPENAI_FALLBACK_MODEL" "$GEMINI_MODEL" "$OPENAI_ROLLBACK_COLLECTION" "$RUN_DIR/openai-reindex.log"
            run_provider_proof openai "$OPENAI_FALLBACK_MODEL" "$GEMINI_MODEL" "$OPENAI_ROLLBACK_COLLECTION" \
              validate "--collection=$OPENAI_ROLLBACK_COLLECTION" "--expected-count=$EXPECTED_SOURCE_COUNT" "--semantic=real-source" | tee "$RUN_DIR/openai-validate.log"

            run_controlled_proof openai "$OPENAI_FALLBACK_MODEL" "$GEMINI_MODEL" "$OPENAI_SEMANTIC_COLLECTION" \
              controlled-index "--collection=$OPENAI_SEMANTIC_COLLECTION" | tee "$RUN_DIR/openai-controlled-index.log"
            run_controlled_proof openai "$OPENAI_FALLBACK_MODEL" "$GEMINI_MODEL" "$OPENAI_SEMANTIC_COLLECTION" \
              controlled-validate "--collection=$OPENAI_SEMANTIC_COLLECTION" | tee "$RUN_DIR/openai-controlled-validate.log"
            openai_semantic_status=$(awk -F= '$1 == "CONTROLLED_SEMANTIC_VALIDATION" { print $2 }' "$RUN_DIR/openai-controlled-validate.log" | tail -1)
            openai_calibration_required=$(awk -F= '$1 == "OPENAI_SEMANTIC_CALIBRATION_REQUIRED" { print $2 }' "$RUN_DIR/openai-controlled-validate.log" | tail -1)
            test "$openai_semantic_status" = "OPENAI_SEMANTIC_CALIBRATION_REQUIRED"
            test "$openai_calibration_required" = YES
            echo "OPENAI_REINDEX=PASS"
            echo "OPENAI_COLLECTION_HOMOGENEITY=PASS"
            echo "OPENAI_MANIFEST_BINDING=PASS"
            echo "OPENAI_SEMANTIC_STATUS=CALIBRATION_REQUIRED"
            echo "OPENAI_SEMANTIC_CALIBRATION_REQUIRED=YES"
            echo "OPENAI_TOP1_ACCURACY=NOT_EVALUATED"

            run_provider_proof openai "$OPENAI_FALLBACK_MODEL" "$GEMINI_MODEL" "$OPENAI_ROLLBACK_COLLECTION" \
              snapshot "--collection=$OPENAI_ROLLBACK_COLLECTION" "--path=$SNAPSHOT_FILE" \
              | tee "$RUN_DIR/openai-snapshot.log"
            snapshot_name=$(awk -F= '$1 == "SNAPSHOT_NAME" { print $2 }' "$RUN_DIR/openai-snapshot.log" | tail -1)
            snapshot_sha=$(awk -F= '$1 == "SNAPSHOT_SHA256" { print $2 }' "$RUN_DIR/openai-snapshot.log" | tail -1)
            test -n "$snapshot_name"
            test -n "$snapshot_sha"
            test "$(sha256sum "$RUN_DIR/$SNAPSHOT_FILE" | awk '{ print $1 }')" = "$snapshot_sha"
            echo "OPENAI_ROLLBACK_SNAPSHOT=$snapshot_name"
            echo "OPENAI_ROLLBACK_SHA256=$snapshot_sha"

            RESTORE_CONTAINER_OWNED=true
            docker run -d --name "$RESTORE_CONTAINER" --network "$NETWORK" \
              --network-alias "$RESTORE_HOST" \
              -v "$RUN_DIR:/qdrant/snapshots:ro" \
              "$QDRANT_IMAGE" \
              ./qdrant \
              --snapshot "/qdrant/snapshots/$SNAPSHOT_FILE:$RESTORE_COLLECTION" >/dev/null
            RESTORE_REQUEST_TIMEOUT_MS=5000
            RESTORE_READINESS_DEADLINE_MS=180000
            RESTORE_READINESS_RETRY_INTERVAL_MS=2000
            restore_readiness_output=""
            restore_readiness_exit=0
            if restore_readiness_output=$(timeout --signal=TERM --kill-after=5s 240s \
              docker run --rm --network "$NETWORK" \
                -v "$READINESS_SCRIPT_PATH:/tmp/qdrant-restore-readiness.js:ro" \
                "$CANDIDATE_IMAGE" node /tmp/qdrant-restore-readiness.js \
                "http://$RESTORE_HOST:6333/readyz" \
                "$RESTORE_REQUEST_TIMEOUT_MS" \
                "$RESTORE_READINESS_DEADLINE_MS" \
                "$RESTORE_READINESS_RETRY_INTERVAL_MS"); then
              restore_readiness_exit=0
            else
              restore_readiness_exit=$?
            fi
            printf '%s\n' "$restore_readiness_output" | tee "$RUN_DIR/restore-readiness.log"
            if [ "$restore_readiness_exit" -ne 0 ]; then
              if [ "$restore_readiness_exit" -eq 124 ]; then
                echo "ROLLBACK_RESTORE_READINESS=FAIL"
                echo "FAILURE_TYPE=CONTAINER_PROBE_TIMEOUT"
                echo "ATTEMPTS=UNKNOWN"
                echo "ELAPSED_MS=240000"
                echo "LAST_HTTP_STATUS=UNKNOWN"
                echo "LAST_QDRANT_STATUS=UNKNOWN"
                echo "LAST_ERROR_TYPE=CONTAINER_PROBE_TIMEOUT"
                echo "LAST_ERROR_SUMMARY=readiness probe container exceeded its bounded command deadline"
              fi
              exit "$restore_readiness_exit"
            fi
            test "$(awk -F= '$1 == "ROLLBACK_RESTORE_READINESS" { print $2 }' "$RUN_DIR/restore-readiness.log" | tail -1)" = PASS
            echo "ROLLBACK_RESTORE_READINESS=PASS"
            echo "QDRANT_RESTORE_READY=PASS"
            docker run --rm --network "$NETWORK" --env-file "$ENV_PATH" \
              -e NODE_ENV=production \
              -e NODE_PATH=/app/node_modules \
              -e QDRANT_URL="http://$RESTORE_HOST:6333" \
              -e QDRANT_API_KEY= \
              -e QDRANT_COLLECTION="$RESTORE_COLLECTION" \
              -e ACTIVE_COLLECTION=__isolated_restore__ \
              -e EXPECTED_SOURCE_COUNT="$EXPECTED_SOURCE_COUNT" \
              -e QDRANT_VECTOR_SIZE="$VECTOR_SIZE" \
              -e QDRANT_PER_TENANT=false \
              -e OPENAI_API_KEY="$OPENAI_API_KEY" \
              -e GEMINI_API_KEY="$GEMINI_API_KEY" \
              -e EMBEDDING_PROVIDER=openai \
              -e EMBEDDING_MODEL="$OPENAI_FALLBACK_MODEL" \
              -e GEMINI_EMBEDDING_MODEL="$GEMINI_MODEL" \
            -e SEMANTIC_ACCEPTANCE_CONTRACT_PATH=/tmp/semantic-acceptance-contract.js \
              -v "$PROOF_SCRIPT_PATH:/tmp/qdrant-migration-proof.js:ro" \
              -v "$ACCEPTANCE_CONTRACT_PATH:/tmp/semantic-acceptance-contract.js:ro" \
            "$CANDIDATE_IMAGE" node /tmp/qdrant-migration-proof.js validate \
              "--collection=$RESTORE_COLLECTION" "--expected-count=$EXPECTED_SOURCE_COUNT" "--semantic=real-source" \
              | tee "$RUN_DIR/restore-validate.log"
            echo "OPENAI_ROLLBACK_RESTORE=PASS"

            run_proof postflight | tee "$RUN_DIR/postflight.log"
            test "$(awk -F= '$1 == "LIVE_COLLECTION_UNTOUCHED" { print $2 }' "$RUN_DIR/postflight.log" | tail -1)" = PASS
            test "$(awk -F= '$1 == "LIVE_ALIAS_UNCHANGED" { print $2 }' "$RUN_DIR/postflight.log" | tail -1)" = PASS

            openai_count=$(awk -F= '$1 == "QDRANT_COUNT" { print $2 }' "$RUN_DIR/openai-validate.log" | tail -1)
            gemini_count=$(awk -F= '$1 == "QDRANT_COUNT" { print $2 }' "$RUN_DIR/gemini-validate.log" | tail -1)
            openai_vector_size=$(awk -F= '$1 == "VECTOR_SIZE" { print $2 }' "$RUN_DIR/openai-validate.log" | tail -1)
            gemini_vector_size=$(awk -F= '$1 == "VECTOR_SIZE" { print $2 }' "$RUN_DIR/gemini-validate.log" | tail -1)
            test "$openai_vector_size" = "$VECTOR_SIZE"
            test "$gemini_vector_size" = "$VECTOR_SIZE"
            for result_name in CONTROLLED_BANGLA_SEARCH CONTROLLED_ENGLISH_SEARCH CONTROLLED_CROSS_LINGUAL_SEARCH CONTROLLED_NEGATIVE_SEARCH CONTROLLED_TENANT_ISOLATION; do
              result_value=$(awk -F= -v key="$result_name" '$1 == key { print $2 }' "$RUN_DIR/gemini-controlled-validate.log" | tail -1)
              echo "GEMINI_$result_name=$result_value"
              test "$result_value" = PASS
            done
            test "$(awk -F= '$1 == "CONTROLLED_SEMANTIC_VALIDATION" { print $2 }' "$RUN_DIR/gemini-controlled-validate.log" | tail -1)" = PASS
            echo "GEMINI_CONTROLLED_SEMANTIC_VALIDATION=PASS"
            echo "SEMANTIC_SEARCH=PASS"
            echo "GEMINI_PRIMARY=PASS"
            echo "OPENAI_FALLBACK=COLLECTION_ONLY"
            echo "COLLECTION_LEVEL_FALLBACK=NOT_EXECUTED_OPENAI_CALIBRATION_REQUIRED"
            echo "PRIMARY_TO_FALLBACK_COLLECTION_ROUTING=NOT_EXECUTED_OPENAI_CALIBRATION_REQUIRED"
            echo "OPENAI_FALLBACK_PROOF=OPENAI_SEMANTIC_CALIBRATION_REQUIRED"
            echo "EMBEDDING_SPACE_SAFETY=PASS"
            echo "MANIFEST_EXCLUSION=PASS"
            echo "QDRANT_MUTATION_BY_PROOF=ISOLATED_ONLY"
            echo "FINAL_STATUS=PROVIDER_BOUND_QDRANT_PROOF_PASS_OPENAI_SEMANTIC_CALIBRATION_REQUIRED"
            echo "OPENAI_ROLLBACK_COLLECTION=$OPENAI_ROLLBACK_COLLECTION"
            echo "OPENAI_ROLLBACK_COUNT=$openai_count"
            echo "GEMINI_COLLECTION=$GEMINI_COLLECTION"
            echo "GEMINI_SOURCE_COUNT=$EXPECTED_SOURCE_COUNT"
            echo "GEMINI_QDRANT_COUNT=$gemini_count"
            echo "GEMINI_VECTOR_SIZE=$gemini_vector_size"
            echo "GEMINI_REINDEX=PASS"
            echo "APPLICATION_ROLLBACK_PLAN=restore the captured immutable backend/frontend digests; no application deployment executed"
            echo "QDRANT_ROLLBACK_PLAN=switch configuration to $OPENAI_ROLLBACK_COLLECTION in a separately approved deployment"
            echo "PRODUCTION_DEPLOY_ENABLED=false"
            echo "HARD_BLOCKERS=OPENAI_SEMANTIC_CALIBRATION_REQUIRED"
            echo "NEXT_SAFE_ACTION=calibrate OpenAI semantic acceptance before authorizing collection-level fallback proof; do not deploy in this run"
