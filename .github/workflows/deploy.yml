name: Deploy Backend to GCP Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: true

# Required for Workload Identity Federation
permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: gen-lang-client-0405487706
  REGION: us-central1
  REGISTRY: us-central1-docker.pkg.dev
  REPOSITORY: easymod-backend
  SERVICE_NAME: easymod-backend
  SERVICE_ACCOUNT: easymod-backend-sa@gen-lang-client-0405487706.iam.gserviceaccount.com

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --passWithNoTests --forceExit

  build-and-deploy:
    name: Build, Push & Deploy
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: github-actions-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build and push Docker image
        id: image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/app
        run: |
          IMAGE_TAG="${IMAGE}:${{ github.sha }}"
          IMAGE_LATEST="${IMAGE}:latest"

          docker build -t "$IMAGE_TAG" -t "$IMAGE_LATEST" .
          docker push "$IMAGE_TAG"
          docker push "$IMAGE_LATEST"

          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloud Run
        run: |
          # Use --no-traffic only if the service already exists (not first deploy)
          if gcloud run services describe ${{ env.SERVICE_NAME }} --region=${{ env.REGION }} --quiet 2>/dev/null; then
            TRAFFIC_FLAG="--no-traffic"
            echo "Existing service detected — deploying with --no-traffic"
          else
            TRAFFIC_FLAG=""
            echo "New service — deploying with full traffic"
          fi

          gcloud run deploy ${{ env.SERVICE_NAME }}             --image="${{ steps.image.outputs.image_tag }}"             --region=${{ env.REGION }}             --service-account=${{ env.SERVICE_ACCOUNT }}             --network=easymod-vpc             --subnet=easymod-subnet             --vpc-egress=private-ranges-only             --set-env-vars="NODE_ENV=production,PORT=3000,GCP_PROJECT_ID=${{ env.PROJECT_ID }},GCP_SECRET_PREFIX=easymod-"             --min-instances=1             --max-instances=10             --concurrency=80             --cpu=1             --memory=1Gi             --timeout=300             --port=3000             --platform=managed             --allow-unauthenticated             $TRAFFIC_FLAG

      - name: Run database migrations (Cloud Run Job)
        run: |
          JOB_NAME="migrate-${GITHUB_SHA:0:10}"

          gcloud run jobs create "$JOB_NAME"             --image="${{ steps.image.outputs.image_tag }}"             --region=${{ env.REGION }}             --service-account=${{ env.SERVICE_ACCOUNT }}             --network=easymod-vpc             --subnet=easymod-subnet             --vpc-egress=private-ranges-only             --set-env-vars="NODE_ENV=production,GCP_PROJECT_ID=${{ env.PROJECT_ID }},GCP_SECRET_PREFIX=easymod-"             --command="node"             --args="src/database/migrate.js,up"             --max-retries=1             --task-timeout=300 2>/dev/null ||           gcloud run jobs update "$JOB_NAME"             --image="${{ steps.image.outputs.image_tag }}"             --region=${{ env.REGION }}

          gcloud run jobs execute "$JOB_NAME"             --region=${{ env.REGION }}             --wait

      - name: Shift 100% traffic to new revision
        run: |
          LATEST_REVISION=$(gcloud run revisions list             --service=${{ env.SERVICE_NAME }}             --region=${{ env.REGION }}             --sort-by="~metadata.creationTimestamp"             --limit=1             --format="value(metadata.name)")

          gcloud run services update-traffic ${{ env.SERVICE_NAME }}             --region=${{ env.REGION }}             --to-revisions="${LATEST_REVISION}=100"

          echo "Traffic shifted to revision: $LATEST_REVISION"

      - name: Health check
        run: |
          BACKEND_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }}             --region=${{ env.REGION }}             --format="value(status.url)")

          echo "Checking: ${BACKEND_URL}/health/ready"
          for i in $(seq 1 20); do
            STATUS=$(curl -sf "${BACKEND_URL}/health/ready" -o /dev/null -w "%{http_code}" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed on attempt $i"
              exit 0
            fi
            echo "Attempt $i: status=$STATUS — retrying in 5s..."
            sleep 5
          done
          echo "ERROR: Health check failed after 20 attempts"
          exit 1
