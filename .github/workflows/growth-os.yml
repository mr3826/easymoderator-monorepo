name: Growth OS CI / CD

# Changes to release-safety workflows intentionally exercise the required PR
# verification jobs; receipt-only and docs-only updates use this path too;
# image publication remains guarded by its event and main-ref condition.
#
# On pull requests this workflow is invoked by ci-cd.yml's PR Merge Gate via
# workflow_call — see the `on:` block below for why it has no pull_request
# trigger of its own.
# Growth OS ships on its own pipeline, not through ci-cd.yml. It is an internal
# staff surface with its own image, its own host (growth.easymod.tech) and no
# coupling to the merchant app's deploy — keeping it separate is the point.
#
# The SPA talks to the backend same-origin: Caddy terminates growth.easymod.tech
# and proxies /api/* to backend:3000, so VITE_API_BASE_URL stays empty and no
# cross-origin secret is needed at build time.

on:
  push:
    branches: [main]
    paths:
      - "EasyMod-growth/**"
      - "EasyMod-extension/**"
      - "EasyMod-backend/src/modules/growth-os/**"
      - "EasyMod-backend/src/modules/entities.js"
      # Auth sign-in/refresh and activation tracking are exercised by the
      # browser gate (internal users, onboarding -> activation).
      - "EasyMod-backend/src/modules/auth/auth.service.js"
      - "EasyMod-backend/src/modules/auth/totp.controller.js"
      - "EasyMod-backend/src/modules/analytics/growth-metrics.service.js"
      - "EasyMod-backend/src/scripts/seed-growth-e2e.js"
      - "EasyMod-backend/src/scripts/grant-growth-role.js"
      - "EasyMod-backend/scripts/import-growth-prospects.js"
      # The browser gate runs the migration chain against its disposable
      # PostgreSQL before seeding fixtures, so a migration change can break it
      # without touching a single Growth file.
      - "EasyMod-backend/src/database/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/run-growth-e2e.js"
      - "Caddyfile"
      - "docker-compose.prod.yml"
      - "docker-compose.test.yml"
      - ".github/workflows/growth-os.yml"
  # No pull_request trigger. A workflow-level paths filter means the workflow
  # never starts on an unrelated diff, so its job contexts never exist, and a
  # required context that never reports blocks the PR forever with "Expected —
  # waiting for status". PR validation is driven through workflow_call by
  # ci-cd.yml's `PR Merge Gate`, which DOES run on every PR and decides there
  # whether Growth is affected. Publication is restricted to the default branch
  # even for manual dispatches; validation remains callable from pull requests.
  workflow_call:
  workflow_dispatch:

concurrency:
  group: growth-os-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/easymoderator-growth-os

jobs:
  verify:
    name: Growth OS build gate
    runs-on: ubuntu-latest
    # Ceiling-allowed but narrowed to read: this job runs PR-controlled code,
    # so the caller's package-write ceiling must not reach its GITHUB_TOKEN.
    # Job-scoped permissions in reusable workflows may restrict but never
    # expand above the caller's grant, and the top-level block is still a
    # superset for `build-and-push`. GitHub's plan check accepts the whole
    # arrangement because the ceiling here matches the caller exactly.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      # EasyMod-growth is an npm workspace, so `npm ci` from inside it walks up
      # and installs from the ROOT lockfile into the ROOT node_modules anyway.
      # Do that explicitly: keying the cache on EasyMod-growth/package-lock.json
      # named a file this step never reads. That per-app lockfile is still real
      # — the Dockerfile copies it into an isolated build stage with no root.
      - name: Install workspace dependencies
        run: npm ci

      - name: Browser extension source validation
        run: npm run validate:extension

      - name: Browser extension tests
        run: npm run test:extension

      # tsc --noEmit. The old JSX app's "test" was an alias for its build, which
      # proved nothing the build step below did not already prove.
      - name: Typecheck
        run: npm run typecheck --workspace=easymod-growth

      - name: Growth OS behavioral tests
        run: npm test --workspace=easymod-growth

      - name: Build
        run: npm run build --workspace=easymod-growth

  browser-e2e:
    name: Growth OS browser E2E gate
    runs-on: ubuntu-latest
    needs: verify
    # Same narrowing rationale as `verify`: this job runs PR-controlled code.
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: easymod_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U e2e -d easymod_e2e"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run disposable-stack browser gate
        env:
          TEST_POSTGRES_PORT: 5432
          TEST_REDIS_PORT: 6379
          GROWTH_E2E_USE_EXISTING_SERVICES: "true"
        run: npm run test:growthos:e2e

      - name: Upload Growth browser artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: growth-os-browser-e2e
          path: |
            EasyMod-growth/playwright-report/
            EasyMod-growth/test-results/
          if-no-files-found: ignore

  build-and-push:
    name: Build and publish Growth OS image
    runs-on: ubuntu-latest
    needs: [verify, browser-e2e]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./EasyMod-growth
          file: ./EasyMod-growth/Dockerfile
          push: true
          build-args: |
            VITE_ENV=production
            VITE_BUILD_SHA=${{ github.sha }}
          # :latest is a human-readable publication label only. Production resolves
          # GHCR_IMAGE_GROWTH to a digest; docker-compose.prod.yml has no :latest fallback.
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
