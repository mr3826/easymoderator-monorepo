name: Load Testing Fixed

on:
  schedule:
    # Run daily at 3 AM UTC (10 PM Bangladesh time)
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Type of load test'
        required: false
        default: 'smoke'
        type: choice
        options:
          - smoke
          - baseline
          - peak
          - stress
      environment:
        description: 'Target environment'
        required: false
        default: 'staging'
        type: choice
        options:
          - staging
          - production

# Required for Workload Identity Federation
permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: gen-lang-client-0405487706
  REGION: us-central1
  REGISTRY: us-central1-docker.pkg.dev
  REPOSITORY: easymod-backend
  STAGING_SERVICE_NAME: easymod-backend-staging
  SERVICE_NAME: easymod-backend

jobs:
  load-test-staging:
    name: Load Test Staging
    runs-on: ubuntu-latest
    if: github.event.inputs.environment == 'staging' || github.event_name == 'schedule'
    
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: EasyMod-backend/package-lock.json

      - name: Install dependencies
        working-directory: ./EasyMod-backend
        run: npm ci

      - name: Install k6
        uses: grafana/k6-action@e4714b734f2b0afaabeb7b4a69142745548ab9ec # v0.3.1
        with:
          k6-version: v0.50.0

      - name: Wait for staging to be ready
        run: |
          echo "Waiting for staging service to be ready..."
          sleep 30
          
          # Check staging health
          for i in {1..10}; do
            if curl -f https://easymod-backend-staging-xxxxx-uc.a.run.app/health; then
              echo "✅ Staging is ready"
              break
            fi
            echo "Attempt $i: waiting..."
            sleep 10
          done

      - name: Run smoke load test
        if: github.event.inputs.test_type == 'smoke' || github.event.inputs.test_type == ''
        run: |
          echo "🚀 Running smoke load test..."
          
          cat > smoke-test.js << 'EOF'
          import http from 'k6/http';
          import { check, sleep } from 'k6';
          
          export let options = {
            vus: 10,
            duration: '2m',
            thresholds: {
              http_req_duration: ['p(95)<500'],
              http_req_failed: ['rate<0.1'],
            },
          };
          
          export default function () {
            const BASE_URL = 'https://easymod-backend-staging-xxxxx-uc.a.run.app';
            
            export let setup = {
              headers: {
                'Content-Type': 'application/json',
              },
            };
            
            export default function () {
              let responses = http.get([`\${BASE_URL}/health`, `\${BASE_URL}/health/database`, `\${BASE_URL}/health/redis`], setup);
              
              check(responses, {
                'health endpoints status': (r) => r.status === 200,
                'response time < 500ms': (r) => r.timings.duration < 500,
              });
              
              sleep(1);
            };
            
            export default function handleSummary(data) {
              console.log('Smoke Test Summary:');
              console.log(`  Requests: \${data.metrics.http_requests_total}`);
              console.log(`  Failed: \${data.metrics.http_req_failed}`);
              console.log(`  Response Time (p95): \${data.metrics.http_req_duration['p(95)']}ms`);
            }
          EOF
          
          k6 run smoke-test.js --out json=smoke-results.json

      - name: Run baseline load test
        if: github.event.inputs.test_type == 'baseline'
        run: |
          echo "📊 Running baseline load test..."
          
          cat > baseline-test.js << 'EOF'
          import http from 'k6/http';
          import { check, sleep } from 'k6';
          
          export let options = {
            vus: 50,
            duration: '5m',
            thresholds: {
              http_req_duration: ['p(95)<1000'],
              http_req_failed: ['rate<0.05'],
            },
          };
          
          export default function () {
            const BASE_URL = 'https://easymod-backend-staging-xxxxx-uc.a.run.app';
            
            export let setup = {
              headers: {
                'Content-Type': 'application/json',
              },
            };
            
            export default function () {
              let responses = http.get([\`\${BASE_URL}/health`, `\${BASE_URL}/health/database`, `\${BASE_URL}/health/redis`], setup);
              
              check(responses, {
                'health endpoints status': (r) => r.status === 200,
                'response time < 1000ms': (r) => r.timings.duration < 1000,
              });
              
              sleep(0.1);
            };
            
            export default function handleSummary(data) {
              console.log('Baseline Test Summary:');
              console.log(`  Total Requests: \${data.metrics.http_requests_total}`);
              console.log(`  Failed Requests: \${data.metrics.http_req_failed}`);
              console.log(`  Response Time (p95): \${data.metrics.http_req_duration['p(95)']}ms`);
              console.log(`  Request Rate: \${data.metrics.http_reqs_per_sec}`);
            }
          EOF
          
          k6 run baseline-test.js --out json=baseline-results.json

      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: load-test-results-${{ github.event.inputs.test_type || 'smoke' }}
          path: |
            smoke-results.json
            baseline-results.json
          retention-days: 7

  load-test-production:
    name: Load Test Production
    runs-on: ubuntu-latest
    if: github.event.inputs.environment == 'production'
    
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: EasyMod-backend/package-lock.json

      - name: Install dependencies
        working-directory: ./EasyMod-backend
        run: npm ci

      - name: Install k6
        uses: grafana/k6-action@e4714b734f2b0afaabeb7b4a69142745548ab9ec # v0.3.1
        with:
          k6-version: v0.50.0

      - name: Get production URL
        id: get-url
        run: |
          PROD_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --format="value(status.url)")
          echo "production_url=$PROD_URL" >> "$GITHUB_OUTPUT"

      - name: Run production smoke test
        if: github.event.inputs.test_type == 'smoke' || github.event.inputs.test_type == ''
        run: |
          echo "🚀 Running production smoke test..."
          
          cat > prod-smoke-test.js << 'EOF'
          import http from 'k6/http';
          import { check, sleep } from 'k6';
          
          export let options = {
            vus: 5,
            duration: '1m',
            thresholds: {
              http_req_duration: ['p(95)<500'],
              http_req_failed: ['rate<0.1'],
            },
          };
          
          export default function () {
            const BASE_URL = '${{ steps.get-url.outputs.production_url }}';
            
            export let setup = {
              headers: {
                'Content-Type': 'application/json',
              },
            };
            
            export default function () {
              let responses = http.get([\`\${BASE_URL}/health`, `\${BASE_URL}/health/database`, `\${BASE_URL}/health/redis`], setup);
              
              check(responses, {
                'health endpoints status': (r) => r.status === 200,
                'response time < 500ms': (r) => r.timings.duration < 500,
              });
              
              sleep(1);
            };
            
            export default function handleSummary(data) {
              console.log('Production Smoke Test Summary:');
              console.log(`  Requests: \${data.metrics.http_requests_total}`);
              console.log(`  Failed: \${data.metrics.http_req_failed}`);
              console.log(`  Response Time (p95): \${data.metrics.http_req_duration['p(95)']}ms`);
            }
          EOF
          
          k6 run prod-smoke-test.js --out json=prod-smoke-results.json

      - name: Upload production results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-load-test-results
          path: prod-smoke-results.json
          retention-days: 7
