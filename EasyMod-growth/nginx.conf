server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/json application/javascript image/svg+xml font/woff font/woff2;
    gzip_min_length 1000;

    location = /health {
        access_log off;
        return 200 '{"status":"healthy","app":"growth-os","timestamp":"$time_iso8601"}\n';
        add_header Content-Type application/json;
    }

    location = /health/ready {
        access_log off;
        if (!-f /usr/share/nginx/html/index.html) { return 503 '{"status":"not_ready","app":"growth-os"}\n'; }
        return 200 '{"status":"ready","app":"growth-os","timestamp":"$time_iso8601"}\n';
        add_header Content-Type application/json;
    }

    location ~* \.(js|css|woff|woff2|ttf|eot|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self' https://growth.easymod.tech https://easymod.tech; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self' https://growth.easymod.tech https://easymod.tech; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;
    }
}
