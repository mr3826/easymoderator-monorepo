name: Deploy Backend to Digital Ocean

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/easymod-backend
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: meta
        run: |
          SHORT="${GITHUB_SHA::8}"
          echo "image_tag=${{ env.GHCR_IMAGE }}:${SHORT}" >> $GITHUB_OUTPUT

      - name: Build & push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image_tag }}
            ${{ env.GHCR_IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache,mode=max

  deploy:
    name: Deploy to DO Droplet
    runs-on: ubuntu-latest
    needs: build
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DO_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DO_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Sync docker-compose.prod.yml to droplet
        run: scp -i ~/.ssh/deploy_key docker-compose.prod.yml root@${{ secrets.DO_HOST }}:/opt/easymod/docker-compose.prod.yml

      - name: Patch seed-admin vars in .env.prod on droplet
        # Requires secrets.SEED_ADMIN_PASSWORD to be set in GitHub repo Settings → Secrets
        env:
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
        run: |
          ssh -i ~/.ssh/deploy_key root@${{ secrets.DO_HOST }} '
          set -e
          ENV_FILE=/opt/easymod/.env.prod
          patch_var() {
            local key="$1" val="$2"
            if grep -q "^${key}=" "$ENV_FILE" 2>/dev/null; then
              sed -i "s|^${key}=.*|${key}=${val}|" "$ENV_FILE"
            else
              echo "${key}=${val}" >> "$ENV_FILE"
            fi
          }
          patch_var SEED_ADMIN_EMAIL "admin@test.prod"
          patch_var SEED_ADMIN_PASSWORD "'"$SEED_ADMIN_PASSWORD"'"
          patch_var SEED_ADMIN_NAME "EasyMod Admin"
          patch_var SEED_ADMIN_PHONE "01700000000"
          echo "Seed admin vars patched in .env.prod"
          '

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DO_HOST }}
          username: root
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          timeout: 300s
          envs: GHCR_IMAGE,IMAGE_TAG,GH_ACTOR,GH_TOKEN
          script: |
            set -e
            echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

            echo "Pulling backend: $IMAGE_TAG"
            docker pull "$IMAGE_TAG"
            docker tag "$IMAGE_TAG" "$GHCR_IMAGE:latest"

            cd /opt/easymod
            export GHCR_IMAGE_BACKEND="$GHCR_IMAGE:latest"
            export GHCR_IMAGE_FRONTEND="$(docker inspect easymod-frontend-1 --format='{{index .Config.Image}}' 2>/dev/null || echo easymod-frontend:latest)"
            docker compose -f docker-compose.prod.yml up -d backend worker scheduler frontend --no-build --force-recreate --remove-orphans

            echo "Running database migrations..."
            docker compose -f docker-compose.prod.yml exec -T backend npm run migrate

            echo "Seeding admin user (idempotent)..."
            docker compose -f docker-compose.prod.yml exec -T backend node src/scripts/seed-admin.js || echo "Seed skipped or already exists"

            for i in $(seq 1 20); do
              STATUS=$(curl -sf http://localhost:3000/health/ready -o /dev/null -w "%{http_code}" || echo "000")
              if [ "$STATUS" = "200" ]; then echo "Health check passed (attempt $i)"; break; fi
              echo "Attempt $i: $STATUS — retrying in 5s..."
              sleep 5
              if [ "$i" = "20" ]; then echo "ERROR: Health check failed"; exit 1; fi
            done

            docker image prune -f
        env:
          GHCR_IMAGE: ${{ env.GHCR_IMAGE }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
