# Hardened NGINX config with edge rate limiting and canary deploy support

worker_processes auto;
events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Rate limiting zone: 20 req/sec burst 40 per IP
    limit_req_zone $binary_remote_addr zone=meta_webhook:10m rate=20r/s;

    upstream app_backend {
        server app-v1:3000;
        server app-v2:3000;
        # Add more canary servers as needed
    }

    server {
        listen 443 ssl;
        server_name api.easymod.tech;
        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        location /webhooks/meta {
            limit_req zone=meta_webhook burst=40 nodelay;
            proxy_pass http://app_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Canary deploy: route 5% of traffic to app-v2
        split_clients "$request_id" $canary {
            5%     app-v2;
            *      app-v1;
        }
        location / {
            proxy_pass http://$canary;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
