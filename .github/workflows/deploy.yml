name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: EasyMod-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: EasyMod-backend/package-lock.json

      - run: npm ci
      - run: npm test -- --passWithNoTests --forceExit

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: EasyMod-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: EasyMod-frontend/package-lock.json

      - run: npm ci

      - name: Build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_META_APP_ID: ${{ secrets.VITE_META_APP_ID }}
          VITE_ENV: production
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: EasyMod-frontend/dist/
          retention-days: 1

  deploy:
    name: Deploy Frontend & Backend
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend]
    if: ${{ always() && !cancelled() && needs.build-frontend.result == 'success' }}
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist/

      - name: Create GitHub deployment
        id: deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ID=$(gh api repos/${{ github.repository }}/deployments \
            --method POST \
            --field ref=${{ github.sha }} \
            --field environment=production \
            --field description="Deploy ${{ github.sha }}" \
            --field auto_merge=false \
            --jq '.id')
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Mark deployment in progress
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/deployments/${{ steps.deployment.outputs.id }}/statuses \
            --method POST \
            --field state=in_progress \
            --field description="Deploying frontend and backend..."

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy backend
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh "$SERVER_USER@$SERVER_HOST" bash -s << EOF
            set -e
            git -C "$DEPLOY_PATH" pull origin main
            cd "$DEPLOY_PATH/EasyMod-backend"
            npm ci --omit=dev
            pm2 reload easymod-backend --update-env
            pm2 reload easymod-queue-worker --update-env || true
          EOF

      - name: Deploy frontend (rsync dist to nginx webroot)
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          FRONTEND_PATH: ${{ secrets.FRONTEND_PATH }}
        run: |
          rsync -az --delete frontend-dist/ "$SERVER_USER@$SERVER_HOST:$FRONTEND_PATH/"

      - name: Health check — backend
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          for i in $(seq 1 20); do
            STATUS=$(curl -sf "http://$SERVER_HOST/health/ready" -o /dev/null -w "%{http_code}" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Backend healthy on attempt $i"
              break
            fi
            echo "Attempt $i: status=$STATUS — retrying in 5s..."
            sleep 5
            if [ "$i" = "20" ]; then
              echo "ERROR: Backend health check failed"
              exit 1
            fi
          done

      - name: Mark deployment success
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/deployments/${{ steps.deployment.outputs.id }}/statuses \
            --method POST \
            --field state=success \
            --field description="Frontend and backend deployed"

      - name: Mark deployment failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/deployments/${{ steps.deployment.outputs.id }}/statuses \
            --method POST \
            --field state=failure \
            --field description="Deployment failed"
