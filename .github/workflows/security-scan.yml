name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Historical secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Scan repository history with Gitleaks
        # The digest pins Gitleaks v8.28.0. Keep the block scalar free of
        # inline comments because they become literal Docker arguments.
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/repo"
          zricethezav/gitleaks@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
          git --config=/repo/.gitleaks.toml --redact --verbose --log-opts="--all" /repo

  production-dependency-audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --workspaces --include-workspace-root --omit=dev --audit-level=high

  # Branch protection requires this single context, not the two jobs above.
  # Naming the individual jobs meant every added or renamed scan job needed a
  # matching branch-protection edit; this one aggregates them and has no `if`
  # and no paths filter, so it always reports.
  gate:
    name: Security Scan
    runs-on: ubuntu-latest
    if: always()
    needs: [gitleaks, production-dependency-audit]
    steps:
      - name: Report the security verdict
        env:
          R_GITLEAKS: ${{ needs.gitleaks.result }}
          R_AUDIT: ${{ needs.production-dependency-audit.result }}
        run: |
          set -euo pipefail
          echo "Historical secret scan:       $R_GITLEAKS"
          echo "Production dependency audit:  $R_AUDIT"
          # Both jobs are unconditional, so anything other than success — including
          # skipped or cancelled — means the scan did not actually clear.
          if [ "$R_GITLEAKS" != "success" ] || [ "$R_AUDIT" != "success" ]; then
            echo "Security Scan: FAIL"
            exit 1
          fi
          echo "Security Scan: PASS"
