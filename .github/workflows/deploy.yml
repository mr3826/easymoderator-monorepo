name: Deploy Backend To AWS

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    name: Build And Push To ECR
    runs-on: ubuntu-latest
    outputs:
      ecr-image: ${{ steps.image.outputs.ecr-image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Retrieve secrets from AWS Secrets Manager
        id: secrets
        run: |
          # Get all secrets for Easy Moderator
          SECRETS_JSON=$(aws secretsmanager get-secret-value \
            --secret-id "easymoderator/production" \
            --query SecretString \
            --output text)
          
          # Output key secrets for other steps
          echo "ec2_host=$(echo $SECRETS_JSON | jq -r '.EC2_HOST')" >> $GITHUB_OUTPUT
          
          # Export all secrets as environment variables
          echo "POSTGRES_DB=$(echo $SECRETS_JSON | jq -r '.POSTGRES_DB')" >> $GITHUB_ENV
          echo "POSTGRES_USER=$(echo $SECRETS_JSON | jq -r '.POSTGRES_USER')" >> $GITHUB_ENV
          echo "POSTGRES_PASSWORD=$(echo $SECRETS_JSON | jq -r '.POSTGRES_PASSWORD')" >> $GITHUB_ENV
          echo "DATABASE_URL=$(echo $SECRETS_JSON | jq -r '.DATABASE_URL')" >> $GITHUB_ENV
          echo "REDIS_URL=$(echo $SECRETS_JSON | jq -r '.REDIS_URL')" >> $GITHUB_ENV
          echo "PORT=$(echo $SECRETS_JSON | jq -r '.PORT')" >> $GITHUB_ENV
          echo "CORS_ORIGINS=$(echo $SECRETS_JSON | jq -r '.CORS_ORIGINS')" >> $GITHUB_ENV
          echo "FRONTEND_URL=$(echo $SECRETS_JSON | jq -r '.FRONTEND_URL')" >> $GITHUB_ENV
          echo "BASE_URL=$(echo $SECRETS_JSON | jq -r '.BASE_URL')" >> $GITHUB_ENV
          echo "BODY_SIZE_LIMIT=$(echo $SECRETS_JSON | jq -r '.BODY_SIZE_LIMIT')" >> $GITHUB_ENV
          echo "ALLOW_SELF_SIGNED_TLS=$(echo $SECRETS_JSON | jq -r '.ALLOW_SELF_SIGNED_TLS')" >> $GITHUB_ENV
          echo "JWT_ACCESS_SECRET=$(echo $SECRETS_JSON | jq -r '.JWT_ACCESS_SECRET')" >> $GITHUB_ENV
          echo "JWT_REFRESH_SECRET=$(echo $SECRETS_JSON | jq -r '.JWT_REFRESH_SECRET')" >> $GITHUB_ENV
          echo "JWT_ACCESS_EXPIRES_IN=$(echo $SECRETS_JSON | jq -r '.JWT_ACCESS_EXPIRES_IN')" >> $GITHUB_ENV
          echo "JWT_REFRESH_EXPIRES_IN=$(echo $SECRETS_JSON | jq -r '.JWT_REFRESH_EXPIRES_IN')" >> $GITHUB_ENV
          echo "SESSION_SECRET=$(echo $SECRETS_JSON | jq -r '.SESSION_SECRET')" >> $GITHUB_ENV
          echo "PAYMENT_ENCRYPTION_KEY=$(echo $SECRETS_JSON | jq -r '.PAYMENT_ENCRYPTION_KEY')" >> $GITHUB_ENV
          echo "CHANNEL_ENCRYPTION_KEY=$(echo $SECRETS_JSON | jq -r '.CHANNEL_ENCRYPTION_KEY')" >> $GITHUB_ENV
          echo "WF1_WEBHOOK_URL=$(echo $SECRETS_JSON | jq -r '.WF1_WEBHOOK_URL')" >> $GITHUB_ENV
          echo "INTERNAL_WEBHOOK_SECRET=$(echo $SECRETS_JSON | jq -r '.INTERNAL_WEBHOOK_SECRET')" >> $GITHUB_ENV
          echo "META_WEBHOOK_APP_SECRET=$(echo $SECRETS_JSON | jq -r '.META_WEBHOOK_APP_SECRET')" >> $GITHUB_ENV
          echo "META_WEBHOOK_VERIFY_TOKEN=$(echo $SECRETS_JSON | jq -r '.META_WEBHOOK_VERIFY_TOKEN')" >> $GITHUB_ENV
          echo "EMBEDDING_PROVIDER=$(echo $SECRETS_JSON | jq -r '.EMBEDDING_PROVIDER')" >> $GITHUB_ENV
          echo "EMBEDDING_MODEL=$(echo $SECRETS_JSON | jq -r '.EMBEDDING_MODEL')" >> $GITHUB_ENV
          echo "GEMINI_EMBEDDING_MODEL=$(echo $SECRETS_JSON | jq -r '.GEMINI_EMBEDDING_MODEL')" >> $GITHUB_ENV
          echo "Google_Gemini_Api_KEY=$(echo $SECRETS_JSON | jq -r '.GOOGLE_GEMINI_API_KEY')" >> $GITHUB_ENV
          echo "OPENAI_API_KEY=$(echo $SECRETS_JSON | jq -r '.OPENAI_API_KEY')" >> $GITHUB_ENV
          echo "PINECONE_API_KEY=$(echo $SECRETS_JSON | jq -r '.PINECONE_API_KEY')" >> $GITHUB_ENV
          echo "PINECONE_INDEX=$(echo $SECRETS_JSON | jq -r '.PINECONE_INDEX')" >> $GITHUB_ENV
          echo "PINECONE_NAMESPACE=$(echo $SECRETS_JSON | jq -r '.PINECONE_NAMESPACE')" >> $GITHUB_ENV
          echo "SMTP_HOST=$(echo $SECRETS_JSON | jq -r '.SMTP_HOST')" >> $GITHUB_ENV
          echo "SMTP_PORT=$(echo $SECRETS_JSON | jq -r '.SMTP_PORT')" >> $GITHUB_ENV
          echo "SMTP_USER=$(echo $SECRETS_JSON | jq -r '.SMTP_USER')" >> $GITHUB_ENV
          echo "SMTP_PASS=$(echo $SECRETS_JSON | jq -r '.SMTP_PASS')" >> $GITHUB_ENV
          echo "SMTP_SECURE=$(echo $SECRETS_JSON | jq -r '.SMTP_SECURE')" >> $GITHUB_ENV
          echo "EMAIL_FROM=$(echo $SECRETS_JSON | jq -r '.EMAIL_FROM')" >> $GITHUB_ENV
          echo "DELIVERY_ENCRYPTION_KEY=$(echo $SECRETS_JSON | jq -r '.DELIVERY_ENCRYPTION_KEY')" >> $GITHUB_ENV

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region ap-south-1 \
            | docker login --username AWS --password-stdin \
              441250065813.dkr.ecr.ap-south-1.amazonaws.com

      - name: Build and push image
        id: image
        run: |
          ECR_IMAGE="441250065813.dkr.ecr.ap-south-1.amazonaws.com/easymod-backend:${{ github.sha }}"
          docker build -t "$ECR_IMAGE" .
          docker tag "$ECR_IMAGE" "441250065813.dkr.ecr.ap-south-1.amazonaws.com/easymod-backend:latest"
          docker push "$ECR_IMAGE"
          docker push "441250065813.dkr.ecr.ap-south-1.amazonaws.com/easymod-backend:latest"
          echo "ecr-image=$ECR_IMAGE" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy On EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Retrieve secrets from AWS Secrets Manager
        run: |
          # Get all secrets for Easy Moderator
          SECRETS_JSON=$(aws secretsmanager get-secret-value \
            --secret-id "easymoderator/production" \
            --query SecretString \
            --output text)
          
          # Export all secrets as environment variables
          echo "EC2_HOST=$(echo $SECRETS_JSON | jq -r '.EC2_HOST')" >> $GITHUB_ENV
          echo "POSTGRES_DB=$(echo $SECRETS_JSON | jq -r '.POSTGRES_DB')" >> $GITHUB_ENV
          echo "POSTGRES_USER=$(echo $SECRETS_JSON | jq -r '.POSTGRES_USER')" >> $GITHUB_ENV
          echo "POSTGRES_PASSWORD=$(echo $SECRETS_JSON | jq -r '.POSTGRES_PASSWORD')" >> $GITHUB_ENV
          echo "DATABASE_URL=$(echo $SECRETS_JSON | jq -r '.DATABASE_URL')" >> $GITHUB_ENV
          echo "REDIS_URL=$(echo $SECRETS_JSON | jq -r '.REDIS_URL')" >> $GITHUB_ENV
          echo "PORT=$(echo $SECRETS_JSON | jq -r '.PORT')" >> $GITHUB_ENV
          echo "CORS_ORIGINS=$(echo $SECRETS_JSON | jq -r '.CORS_ORIGINS')" >> $GITHUB_ENV
          echo "FRONTEND_URL=$(echo $SECRETS_JSON | jq -r '.FRONTEND_URL')" >> $GITHUB_ENV
          echo "BASE_URL=$(echo $SECRETS_JSON | jq -r '.BASE_URL')" >> $GITHUB_ENV
          echo "BODY_SIZE_LIMIT=$(echo $SECRETS_JSON | jq -r '.BODY_SIZE_LIMIT')" >> $GITHUB_ENV
          echo "ALLOW_SELF_SIGNED_TLS=$(echo $SECRETS_JSON | jq -r '.ALLOW_SELF_SIGNED_TLS')" >> $GITHUB_ENV
          echo "JWT_ACCESS_SECRET=$(echo $SECRETS_JSON | jq -r '.JWT_ACCESS_SECRET')" >> $GITHUB_ENV
          echo "JWT_REFRESH_SECRET=$(echo $SECRETS_JSON | jq -r '.JWT_REFRESH_SECRET')" >> $GITHUB_ENV
          echo "JWT_ACCESS_EXPIRES_IN=$(echo $SECRETS_JSON | jq -r '.JWT_ACCESS_EXPIRES_IN')" >> $GITHUB_ENV
          echo "JWT_REFRESH_EXPIRES_IN=$(echo $SECRETS_JSON | jq -r '.JWT_REFRESH_EXPIRES_IN')" >> $GITHUB_ENV
          echo "SESSION_SECRET=$(echo $SECRETS_JSON | jq -r '.SESSION_SECRET')" >> $GITHUB_ENV
          echo "PAYMENT_ENCRYPTION_KEY=$(echo $SECRETS_JSON | jq -r '.PAYMENT_ENCRYPTION_KEY')" >> $GITHUB_ENV
          echo "CHANNEL_ENCRYPTION_KEY=$(echo $SECRETS_JSON | jq -r '.CHANNEL_ENCRYPTION_KEY')" >> $GITHUB_ENV
          echo "WF1_WEBHOOK_URL=$(echo $SECRETS_JSON | jq -r '.WF1_WEBHOOK_URL')" >> $GITHUB_ENV
          echo "INTERNAL_WEBHOOK_SECRET=$(echo $SECRETS_JSON | jq -r '.INTERNAL_WEBHOOK_SECRET')" >> $GITHUB_ENV
          echo "META_WEBHOOK_APP_SECRET=$(echo $SECRETS_JSON | jq -r '.META_WEBHOOK_APP_SECRET')" >> $GITHUB_ENV
          echo "META_WEBHOOK_VERIFY_TOKEN=$(echo $SECRETS_JSON | jq -r '.META_WEBHOOK_VERIFY_TOKEN')" >> $GITHUB_ENV
          echo "EMBEDDING_PROVIDER=$(echo $SECRETS_JSON | jq -r '.EMBEDDING_PROVIDER')" >> $GITHUB_ENV
          echo "EMBEDDING_MODEL=$(echo $SECRETS_JSON | jq -r '.EMBEDDING_MODEL')" >> $GITHUB_ENV
          echo "GEMINI_EMBEDDING_MODEL=$(echo $SECRETS_JSON | jq -r '.GEMINI_EMBEDDING_MODEL')" >> $GITHUB_ENV
          echo "Google_Gemini_Api_KEY=$(echo $SECRETS_JSON | jq -r '.GOOGLE_GEMINI_API_KEY')" >> $GITHUB_ENV
          echo "OPENAI_API_KEY=$(echo $SECRETS_JSON | jq -r '.OPENAI_API_KEY')" >> $GITHUB_ENV
          echo "PINECONE_API_KEY=$(echo $SECRETS_JSON | jq -r '.PINECONE_API_KEY')" >> $GITHUB_ENV
          echo "PINECONE_INDEX=$(echo $SECRETS_JSON | jq -r '.PINECONE_INDEX')" >> $GITHUB_ENV
          echo "PINECONE_NAMESPACE=$(echo $SECRETS_JSON | jq -r '.PINECONE_NAMESPACE')" >> $GITHUB_ENV
          echo "SMTP_HOST=$(echo $SECRETS_JSON | jq -r '.SMTP_HOST')" >> $GITHUB_ENV
          echo "SMTP_PORT=$(echo $SECRETS_JSON | jq -r '.SMTP_PORT')" >> $GITHUB_ENV
          echo "SMTP_USER=$(echo $SECRETS_JSON | jq -r '.SMTP_USER')" >> $GITHUB_ENV
          echo "SMTP_PASS=$(echo $SECRETS_JSON | jq -r '.SMTP_PASS')" >> $GITHUB_ENV
          echo "SMTP_SECURE=$(echo $SECRETS_JSON | jq -r '.SMTP_SECURE')" >> $GITHUB_ENV
          echo "EMAIL_FROM=$(echo $SECRETS_JSON | jq -r '.EMAIL_FROM')" >> $GITHUB_ENV
          echo "DELIVERY_ENCRYPTION_KEY=$(echo $SECRETS_JSON | jq -r '.DELIVERY_ENCRYPTION_KEY')" >> $GITHUB_ENV

      - name: Copy docker-compose to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: docker-compose.prod.yml
          target: /home/ec2-user/easymod-backend/

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          ECR_IMAGE: ${{ needs.build-and-push.outputs.ecr-image }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          DATABASE_URL: ${{ env.DATABASE_URL }}
          REDIS_URL: ${{ env.REDIS_URL }}
          PORT: ${{ env.PORT }}
          CORS_ORIGINS: ${{ env.CORS_ORIGINS }}
          FRONTEND_URL: ${{ env.FRONTEND_URL }}
          BASE_URL: ${{ env.BASE_URL }}
          BODY_SIZE_LIMIT: ${{ env.BODY_SIZE_LIMIT }}
          ALLOW_SELF_SIGNED_TLS: ${{ env.ALLOW_SELF_SIGNED_TLS }}
          JWT_ACCESS_SECRET: ${{ env.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ env.JWT_REFRESH_SECRET }}
          JWT_ACCESS_EXPIRES_IN: ${{ env.JWT_ACCESS_EXPIRES_IN }}
          JWT_REFRESH_EXPIRES_IN: ${{ env.JWT_REFRESH_EXPIRES_IN }}
          SESSION_SECRET: ${{ env.SESSION_SECRET }}
          PAYMENT_ENCRYPTION_KEY: ${{ env.PAYMENT_ENCRYPTION_KEY }}
          CHANNEL_ENCRYPTION_KEY: ${{ env.CHANNEL_ENCRYPTION_KEY }}
          WF1_WEBHOOK_URL: ${{ env.WF1_WEBHOOK_URL }}
          INTERNAL_WEBHOOK_SECRET: ${{ env.INTERNAL_WEBHOOK_SECRET }}
          META_WEBHOOK_APP_SECRET: ${{ env.META_WEBHOOK_APP_SECRET }}
          META_WEBHOOK_VERIFY_TOKEN: ${{ env.META_WEBHOOK_VERIFY_TOKEN }}
          EMBEDDING_PROVIDER: ${{ env.EMBEDDING_PROVIDER }}
          EMBEDDING_MODEL: ${{ env.EMBEDDING_MODEL }}
          GEMINI_EMBEDDING_MODEL: ${{ env.GEMINI_EMBEDDING_MODEL }}
          Google_Gemini_Api_KEY: ${{ env.Google_Gemini_Api_KEY }}
          OPENAI_API_KEY: ${{ env.OPENAI_API_KEY }}
          PINECONE_API_KEY: ${{ env.PINECONE_API_KEY }}
          PINECONE_INDEX: ${{ env.PINECONE_INDEX }}
          PINECONE_NAMESPACE: ${{ env.PINECONE_NAMESPACE }}
          SMTP_HOST: ${{ env.SMTP_HOST }}
          SMTP_PORT: ${{ env.SMTP_PORT }}
          SMTP_USER: ${{ env.SMTP_USER }}
          SMTP_PASS: ${{ env.SMTP_PASS }}
          SMTP_SECURE: ${{ env.SMTP_SECURE }}
          EMAIL_FROM: ${{ env.EMAIL_FROM }}
          DELIVERY_ENCRYPTION_KEY: ${{ env.DELIVERY_ENCRYPTION_KEY }}
        with:
          host: ${{ env.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: ECR_IMAGE,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,POSTGRES_DB,POSTGRES_USER,POSTGRES_PASSWORD,DATABASE_URL,REDIS_URL,PORT,CORS_ORIGINS,FRONTEND_URL,BASE_URL,BODY_SIZE_LIMIT,ALLOW_SELF_SIGNED_TLS,JWT_ACCESS_SECRET,JWT_REFRESH_SECRET,JWT_ACCESS_EXPIRES_IN,JWT_REFRESH_EXPIRES_IN,SESSION_SECRET,PAYMENT_ENCRYPTION_KEY,CHANNEL_ENCRYPTION_KEY,WF1_WEBHOOK_URL,INTERNAL_WEBHOOK_SECRET,META_WEBHOOK_APP_SECRET,META_WEBHOOK_VERIFY_TOKEN,EMBEDDING_PROVIDER,EMBEDDING_MODEL,GEMINI_EMBEDDING_MODEL,Google_Gemini_Api_KEY,OPENAI_API_KEY,PINECONE_API_KEY,PINECONE_INDEX,PINECONE_NAMESPACE,SMTP_HOST,SMTP_PORT,SMTP_USER,SMTP_PASS,SMTP_SECURE,EMAIL_FROM,DELIVERY_ENCRYPTION_KEY
          script: |
            set -eo pipefail

            # Install Docker if not present
            if ! command -v docker &> /dev/null; then
              sudo yum install -y docker
              sudo systemctl enable docker
              sudo systemctl start docker
              sudo usermod -aG docker ec2-user
            fi

            # Install docker compose plugin if not present
            if ! docker compose version &> /dev/null; then
              sudo mkdir -p /usr/local/lib/docker/cli-plugins
              sudo curl -SL https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64 -o /usr/local/lib/docker/cli-plugins/docker-compose
              sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
            fi

            # Install AWS CLI v2 if not present
            if ! command -v aws &> /dev/null; then
              sudo yum install -y -q unzip
              curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
              unzip -q /tmp/awscliv2.zip -d /tmp
              sudo /tmp/aws/install
              rm -rf /tmp/awscliv2.zip /tmp/aws
            fi

            cd /home/ec2-user/easymod-backend

            # URL-encode the DB password so special chars are safe in the connection URL
            ENCODED_PG_PASS=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1],safe=''))" "${POSTGRES_PASSWORD}")
            DB_URL_DEFAULT="postgresql://${POSTGRES_USER}:${ENCODED_PG_PASS}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
            REDIS_URL_DEFAULT="redis://redis:6379"
            DATABASE_URL_FINAL="${DATABASE_URL:-$DB_URL_DEFAULT}"
            REDIS_URL_FINAL="${REDIS_URL:-$REDIS_URL_DEFAULT}"

            # Guarantee CHANNEL_ENCRYPTION_KEY is present for app startup.
            CHANNEL_ENCRYPTION_KEY_FINAL="${CHANNEL_ENCRYPTION_KEY:-}"
            if [ -z "$CHANNEL_ENCRYPTION_KEY_FINAL" ]; then
              CHANNEL_ENCRYPTION_KEY_FINAL=$(openssl rand -hex 32)
            fi

            # Write .env.prod using printf to avoid heredoc YAML conflicts
            {
              printf 'ECR_IMAGE="%s"\n'               "${ECR_IMAGE}"
              printf 'POSTGRES_DB="%s"\n'             "${POSTGRES_DB}"
              printf 'POSTGRES_USER="%s"\n'           "${POSTGRES_USER}"
              printf 'POSTGRES_PASSWORD="%s"\n'       "${POSTGRES_PASSWORD}"
              printf 'PORT="%s"\n'                    "${PORT:-3000}"
              printf 'NODE_ENV=production\n'
              printf 'DATABASE_URL="%s"\n'            "${DATABASE_URL_FINAL}"
              printf 'REDIS_URL="%s"\n'               "${REDIS_URL_FINAL}"
              printf 'BODY_SIZE_LIMIT="%s"\n'         "${BODY_SIZE_LIMIT:-10mb}"
              printf 'ALLOW_SELF_SIGNED_TLS="%s"\n'   "${ALLOW_SELF_SIGNED_TLS:-false}"
              printf 'CORS_ORIGINS="%s"\n'            "${CORS_ORIGINS}"
              printf 'JWT_ACCESS_SECRET="%s"\n'       "${JWT_ACCESS_SECRET}"
              printf 'JWT_REFRESH_SECRET="%s"\n'      "${JWT_REFRESH_SECRET}"
              printf 'JWT_ACCESS_EXPIRES_IN="%s"\n'   "${JWT_ACCESS_EXPIRES_IN}"
              printf 'JWT_REFRESH_EXPIRES_IN="%s"\n'  "${JWT_REFRESH_EXPIRES_IN}"
              printf 'SESSION_SECRET="%s"\n'          "${SESSION_SECRET}"
              printf 'PAYMENT_ENCRYPTION_KEY="%s"\n'  "${PAYMENT_ENCRYPTION_KEY}"
              printf 'CHANNEL_ENCRYPTION_KEY="%s"\n'  "${CHANNEL_ENCRYPTION_KEY_FINAL}"
              printf 'DELIVERY_ENCRYPTION_KEY="%s"\n' "${DELIVERY_ENCRYPTION_KEY}"
              printf 'WF1_WEBHOOK_URL="%s"\n'         "${WF1_WEBHOOK_URL}"
              printf 'INTERNAL_WEBHOOK_SECRET="%s"\n' "${INTERNAL_WEBHOOK_SECRET}"
              printf 'META_WEBHOOK_APP_SECRET="%s"\n' "${META_WEBHOOK_APP_SECRET}"
              printf 'META_WEBHOOK_VERIFY_TOKEN="%s"\n' "${META_WEBHOOK_VERIFY_TOKEN}"
              printf 'EMBEDDING_PROVIDER="%s"\n'      "${EMBEDDING_PROVIDER}"
              printf 'EMBEDDING_MODEL="%s"\n'         "${EMBEDDING_MODEL}"
              printf 'GEMINI_EMBEDDING_MODEL="%s"\n'  "${GEMINI_EMBEDDING_MODEL}"
              printf 'Google_Gemini_Api_KEY="%s"\n'   "${Google_Gemini_Api_KEY}"
              printf 'OPENAI_API_KEY="%s"\n'          "${OPENAI_API_KEY}"
              printf 'FRONTEND_URL="%s"\n'            "${FRONTEND_URL}"
              printf 'BASE_URL="%s"\n'                "${BASE_URL}"
              printf 'SMTP_HOST="%s"\n'               "${SMTP_HOST}"
              printf 'SMTP_PORT="%s"\n'               "${SMTP_PORT}"
              printf 'SMTP_USER="%s"\n'               "${SMTP_USER}"
              printf 'SMTP_PASS="%s"\n'               "${SMTP_PASS}"
              printf 'SMTP_SECURE="%s"\n'             "${SMTP_SECURE:-false}"
              printf 'EMAIL_FROM="%s"\n'              "${EMAIL_FROM}"
              printf 'PINECONE_API_KEY="%s"\n'        "${PINECONE_API_KEY}"
              printf 'PINECONE_INDEX="%s"\n'          "${PINECONE_INDEX}"
              printf 'PINECONE_NAMESPACE="%s"\n'      "${PINECONE_NAMESPACE}"
            } > .env.prod

            # Login to ECR
            aws ecr get-login-password --region ap-south-1 \
              | docker login --username AWS --password-stdin \
                441250065813.dkr.ecr.ap-south-1.amazonaws.com

            # Pull new backend and worker images
            docker compose --env-file .env.prod -f docker-compose.prod.yml pull backend worker

            # Start / restart postgres and redis
            docker compose --env-file .env.prod -f docker-compose.prod.yml up -d postgres redis

            # Wait for postgres to be ready (up to 30s)
            echo "Waiting for postgres..."
            for i in $(seq 1 15); do
              docker compose --env-file .env.prod -f docker-compose.prod.yml exec -T postgres \
                pg_isready -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" && break
              sleep 2
            done

            # Sync base schema (creates tables defined in Sequelize models, e.g. shops)
            # Use force:false so Sequelize respects FK ordering when creating fresh tables
            docker compose --env-file .env.prod -f docker-compose.prod.yml run --rm backend \
              node -e "require('module-alias/register');require('src/modules/entities');const{sequelize}=require('src/utils/database/database-setup');sequelize.sync({force:false}).then(()=>{console.log('Sync complete');process.exit(0)}).catch(e=>{console.error(e);process.exit(1)})"

            # Run migrations (depends on base tables existing)
            docker compose --env-file .env.prod -f docker-compose.prod.yml run --rm backend npm run migrate

            # Start/restart backend and worker
            docker compose --env-file .env.prod -f docker-compose.prod.yml up -d backend worker

            # Clean up old images
            docker image prune -af --filter "until=72h"

            # Post-deploy health check (up to 60s)
            echo "Waiting for backend to be healthy..."
            for i in $(seq 1 20); do
              STATUS=$(docker compose --env-file .env.prod -f docker-compose.prod.yml \
                exec -T backend node -e \
                "require('http').get('http://localhost:3000/health/ready',(r)=>{process.stdout.write(String(r.statusCode));process.exit(0)}).on('error',()=>{process.stdout.write('000');process.exit(0)})" \
                2>/dev/null || echo "000")
              if [ "$STATUS" = "200" ]; then
                echo "Backend is healthy (attempt $i)"
                break
              fi
              if [ "$i" = "20" ]; then
                echo "ERROR: Backend failed health check after 20 attempts"
                docker compose --env-file .env.prod -f docker-compose.prod.yml logs --tail=50 backend
                docker compose --env-file .env.prod -f docker-compose.prod.yml logs --tail=50 worker
                exit 1
              fi
              sleep 3
            done

            # Verify worker container is running
            echo "Waiting for worker to be running..."
            for i in $(seq 1 15); do
              WORKER_STATUS=$(docker compose --env-file .env.prod -f docker-compose.prod.yml ps --status running --services worker 2>/dev/null || true)
              if [ "$WORKER_STATUS" = "worker" ]; then
                echo "Worker is running (attempt $i)"
                break
              fi
              if [ "$i" = "15" ]; then
                echo "ERROR: Worker failed to reach running state"
                docker compose --env-file .env.prod -f docker-compose.prod.yml logs --tail=80 worker
                exit 1
              fi
              sleep 2
            done
            echo "Deployment complete."
