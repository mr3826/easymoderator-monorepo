name: Grant Platform Admin

# ──────────────────────────────────────────────────────────────────────────────
# Manually grant / revoke an EasyModerator platform-operator role on production.
#
# This is the supported way to seed the FIRST SUPER_ADMIN and to manage operator
# access afterwards, without anyone needing direct SSH access to the droplet.
# It SSHes into the prod droplet using the same secrets as the deploy job and
# runs src/scripts/grant-platform-admin.js inside the running backend container.
#
# The target email MUST already exist as a registered app user — this only sets
# users.platform_role on an existing account, it does not create users.
#   SUPER_ADMIN   = read + mutate (incl. emergency AI kill switch)
#   SUPPORT_ADMIN = read-only
#   NONE          = revoke admin access
#
# Trigger:  Actions → "Grant Platform Admin" → Run workflow   (or `gh workflow run`)
# ──────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      email:
        description: 'Email of an EXISTING app user to grant/revoke'
        required: true
        type: string
      role:
        description: 'Platform role to set'
        required: true
        default: SUPER_ADMIN
        type: choice
        options:
          - SUPER_ADMIN
          - SUPPORT_ADMIN
          - NONE

# Never run two role changes at once.
concurrency:
  group: grant-platform-admin
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  grant:
    name: Set platform_role on production
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Derive pinned SSH host fingerprint
        id: ssh_host
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.DO_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          host_entry=$(ssh-keygen -F "$DEPLOY_HOST" -f "$HOME/.ssh/known_hosts" | awk '!/^#/ { print; exit }')
          key_type=$(printf '%s\n' "$host_entry" | awk '{ print $2 }')
          key_blob=$(printf '%s\n' "$host_entry" | awk '{ print $3 }')
          if [ -z "$key_type" ] || [ -z "$key_blob" ]; then
            echo '::error::pinned host key is missing for DEPLOY_HOST'
            exit 1
          fi
          fingerprint=$(printf '%s %s\n' "$key_type" "$key_blob" | ssh-keygen -lf - -E sha256 | awk '{ print $2 }')
          if [ -z "$fingerprint" ]; then
            echo '::error::could not derive the pinned host fingerprint'
            exit 1
          fi
          printf 'fingerprint=%s\n' "$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Run grant-platform-admin on droplet
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          fingerprint: ${{ steps.ssh_host.outputs.fingerprint }}
          timeout: 120s
          # Forward inputs as named env vars so they are NOT string-interpolated
          # into the remote shell (avoids command injection via the email field).
          # Use the already-running Compose backend container directly:
          # `docker compose exec` interpolates every required image variable
          # before it can exec, but .env.prod intentionally contains runtime
          # secrets/config only; the running container is the authoritative
          # production code target.
          envs: TARGET_EMAIL,TARGET_ROLE
          script: |
            set -euo pipefail
            cd /opt/easymod
            echo "==> Setting platform_role=${TARGET_ROLE} for ${TARGET_EMAIL}"
            backend_container=$(docker ps \
              --filter 'label=com.docker.compose.service=backend' \
              --filter 'status=running' \
              --format '{{.ID}}' | head -n 1)
            if [ -z "${backend_container}" ]; then
              echo 'No running Compose backend container was found.' >&2
              exit 1
            fi
            docker exec \
              "${backend_container}" node src/scripts/grant-platform-admin.js "${TARGET_EMAIL}" "${TARGET_ROLE}"
            echo "==> Done."
        env:
          TARGET_EMAIL: ${{ inputs.email }}
          TARGET_ROLE: ${{ inputs.role }}
